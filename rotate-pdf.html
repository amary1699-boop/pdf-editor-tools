<body>

<nav class="navbar">

<section class="hero">
  <h1>Rotate PDF</h1>
  <p>
    Rotate PDF pages online for free. Rotate individual pages or rotate
    all pages and download your new PDF.
  </p>
</section>

<main class="container">

  <div class="upload-box">

      Select PDF
    </label>

      id="fileInput"
      accept="application/pdf,.pdf"

      No PDF selected

    PDF Pages
  </h2>

    </button>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");
const pagesGrid = document.getElementById("pagesGrid");
const pagesTitle = document.getElementById("pagesTitle");
const controls = document.getElementById("controls");
const downloadArea = document.getElementById("downloadArea");
const downloadBtn = document.getElementById("downloadBtn");
const loading = document.getElementById("loading");
const status = document.getElementById("status");

const rotateAllLeft = document.getElementById("rotateAllLeft");
const rotateAllRight = document.getElementById("rotateAllRight");
const resetAll = document.getElementById("resetAll");

let originalFile = null;
let originalBytes = null;
let pdfDocument = null;

let pageData = [];

fileInput.addEventListener("change", async function(){

  const file = this.files[0];

  if(!file){
    return;
  }

  if(file.type !== "application/pdf" &&
     !file.name.toLowerCase().endsWith(".pdf")){

    alert("Please select a PDF file.");
    fileInput.value = "";
    return;
  }

  originalFile = file;

  fileName.textContent = file.name;

  pagesGrid.innerHTML = "";
  pageData = [];

  controls.style.display = "none";
  pagesTitle.style.display = "none";
  downloadArea.style.display = "none";
  status.textContent = "";

  loading.style.display = "block";

  try{

    originalBytes = await file.arrayBuffer();

    pdfDocument = await pdfjsLib.getDocument({
      data: originalBytes.slice(0)
    }).promise;

    await renderAllPages();

    controls.style.display = "block";
    pagesTitle.style.display = "block";
    downloadArea.style.display = "block";

    status.textContent =
      pdfDocument.numPages +
      " page" +
      (pdfDocument.numPages > 1 ? "s" : "") +
      " loaded successfully.";

  }catch(error){

    console.error(error);

    alert(
      "Unable to open this PDF. Please try another PDF file."
    );

    pagesGrid.innerHTML = "";
    pageData = [];

  }finally{

    loading.style.display = "none";

  }

});


async function renderAllPages(){

  for(let i = 1; i <= pdfDocument.numPages; i++){

    const page = await pdfDocument.getPage(i);

    const baseViewport = page.getViewport({
      scale:1
    });

    /*
      Preview width is limited so large PDFs do not become
      unnecessarily heavy in the browser.
    */

    const targetWidth = 500;

    const scale = Math.min(
      targetWidth / baseViewport.width,
      1.5
    );

    const viewport = page.getViewport({
      scale:scale
    });

    const canvas = document.createElement("canvas");

    canvas.width = Math.ceil(viewport.width);
    canvas.height = Math.ceil(viewport.height);

    const context = canvas.getContext("2d");

    await page.render({
      canvasContext:context,
      viewport:viewport
    }).promise;

    const card = document.createElement("div");
    card.className = "page-card";

    const header = document.createElement("div");
    header.className = "page-header";

    const pageNumber = document.createElement("div");
    pageNumber.className = "page-number";
    pageNumber.textContent = "Page " + i;

    const rotationLabel = document.createElement("div");
    rotationLabel.className = "rotation-label";
    rotationLabel.textContent = "Rotation: 0°";

    header.appendChild(pageNumber);
    header.appendChild(rotationLabel);

    const canvasWrap = document.createElement("div");
    canvasWrap.className = "canvas-wrap";
    canvasWrap.appendChild(canvas);

    const actions = document.createElement("div");
    actions.className = "page-actions";

    const leftButton = document.createElement("button");
    leftButton.className = "rotate-left";
    leftButton.textContent = "↶ Left";

    const rightButton = document.createElement("button");
    rightButton.className = "rotate-right";
    rightButton.textContent = "↷ Right";

    actions.appendChild(leftButton);
    actions.appendChild(rightButton);

    card.appendChild(header);
    card.appendChild(canvasWrap);
    card.appendChild(actions);

    pagesGrid.appendChild(card);

    const data = {
      pageNumber:i,
      canvas:canvas,
      baseCanvas:canvas,
      rotation:0,
      rotationLabel:rotationLabel,
      card:card,
      imageData:null
    };

    /*
      Store the original preview as an image.
      This allows smooth rotation without repeatedly
      rendering the PDF.
    */

    data.imageData = canvas.toDataURL("image/png");

    pageData.push(data);

    leftButton.addEventListener("click", function(){
      changePageRotation(i - 1, -90);
    });

    rightButton.addEventListener("click", function(){
      changePageRotation(i - 1, 90);
    });

  }

}


function changePageRotation(index, amount){

  const data = pageData[index];

  if(!data){
    return;
  }

  data.rotation =
    normalizeRotation(data.rotation + amount);

  drawRotatedPreview(data);

}


function normalizeRotation(value){

  value = value % 360;

  if(value < 0){
    value += 360;
  }

  return value;

}


function drawRotatedPreview(data){

  const image = new Image();

  image.onload = function(){

    const originalWidth = image.naturalWidth;
    const originalHeight = image.naturalHeight;

    const rotated =
      data.rotation === 90 ||
      data.rotation === 270;

    const newWidth =
      rotated ? originalHeight : originalWidth;

    const newHeight =
      rotated ? originalWidth : originalHeight;

    const canvas = data.canvas;

    canvas.width = newWidth;
    canvas.height = newHeight;

    const ctx = canvas.getContext("2d");

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );

    ctx.save();

    if(data.rotation === 90){

      ctx.translate(
        newWidth,
        0
      );

      ctx.rotate(
        Math.PI / 2
      );

    }else if(data.rotation === 180){

      ctx.translate(
        newWidth,
        newHeight
      );

      ctx.rotate(
        Math.PI
      );

    }else if(data.rotation === 270){

      ctx.translate(
        0,
        newHeight
      );

      ctx.rotate(
        -Math.PI / 2
      );

    }

    ctx.drawImage(
      image,
      0,
      0,
      originalWidth,
      originalHeight
    );

    ctx.restore();

    data.rotationLabel.textContent =
      "Rotation: " +
      data.rotation +
      "°";

  };

  image.src = data.imageData;

}


rotateAllLeft.addEventListener("click", function(){

  pageData.forEach(function(data){

    data.rotation =
      normalizeRotation(
        data.rotation - 90
      );

    drawRotatedPreview(data);

  });

});


rotateAllRight.addEventListener("click", function(){

  pageData.forEach(function(data){

    data.rotation =
      normalizeRotation(
        data.rotation + 90
      );

    drawRotatedPreview(data);

  });

});


resetAll.addEventListener("click", function(){

  pageData.forEach(function(data){

    data.rotation = 0;

    drawRotatedPreview(data);

  });

});


downloadBtn.addEventListener("click", async function(){

  if(!originalBytes || pageData.length === 0){

    alert("Please select a PDF first.");
    return;

  }

  const oldText = downloadBtn.textContent;

  downloadBtn.disabled = true;
  downloadBtn.textContent = "Creating PDF...";
  status.textContent = "Please wait...";

  try{

    const pdfLibDoc =
      await PDFLib.PDFDocument.load(
        originalBytes.slice(0)
      );

    const pages = pdfLibDoc.getPages();

    pageData.forEach(function(data, index){

      if(!pages[index]){
        return;
      }

      const currentRotation =
        pages[index].getRotation().angle || 0;

      const finalRotation =
        normalizeRotation(
          currentRotation + data.rotation
        );

      pages[index].setRotation(
        PDFLib.degrees(finalRotation)
      );

    });

    const outputBytes =
      await pdfLibDoc.save();

    const blob =
      new Blob(
        [outputBytes],
        {type:"application/pdf"}
      );

    const url =
      URL.createObjectURL(blob);

    const a =
      document.createElement("a");

    a.href = url;

    const originalName =
      originalFile
        ? originalFile.name.replace(
            /\.pdf$/i,
            ""
          )
        : "document";

    a.download =
      originalName +
      "-rotated.pdf";

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){
      URL.revokeObjectURL(url);
    },1000);

    status.textContent =
      "PDF downloaded successfully.";

  }catch(error){

    console.error(error);

    alert(
      "Download failed. Please try again."
    );

    status.textContent =
      "Unable to create the rotated PDF.";

  }finally{

    downloadBtn.disabled = false;
    downloadBtn.textContent = oldText;

  }

});

</script>

</body>
</html>
