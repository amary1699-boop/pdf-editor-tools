<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor Tools Free</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #0d6efd;
    padding:35px 15px;
    text-align:center;
    border-radius:10px;
    background:#f8fbff;
}

input[type="file"]{
    display:none;
}

.upload-btn{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:13px 22px;
    border-radius:6px;
    cursor:pointer;
}

.file-name{
    margin-top:15px;
    font-weight:bold;
    word-break:break-word;
}

#preview{
    display:none;
    margin-top:30px;
}

.page{
    margin:25px auto;
    padding:15px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}

.page-number{
    font-weight:bold;
    margin-bottom:12px;
}

.canvas-wrap{
    position:relative;
    width:max-content;
    max-width:100%;
    margin:auto;
}

.page canvas{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    margin:auto;
    border:1px solid #ddd;
}

.text-layer{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:100%;
    pointer-events:none;
}

.text-item{
    position:absolute;
    padding:3px 6px;
    border:1px dashed transparent;
    cursor:move;
    pointer-events:auto;
    user-select:none;
    white-space:nowrap;
    background:rgba(255,255,255,.05);
}

.text-item.selected{
    border:1px dashed #0d6efd;
    background:rgba(13,110,253,.08);
}

.text-input{
    position:absolute;
    z-index:1000;
    min-width:180px;
    padding:7px;
    border:2px solid #0d6efd;
    border-radius:5px;
    outline:none;
    font-size:16px;
}

.text-toolbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
    gap:7px;
    margin-top:10px;
    padding:10px;
    background:#f1f5f9;
    border-radius:8px;
}

.text-toolbar select,
.text-toolbar input,
.text-toolbar button{
    padding:7px 9px;
    border:1px solid #ccc;
    border-radius:5px;
    background:white;
}

.text-toolbar button{
    cursor:pointer;
    font-weight:bold;
}

.text-toolbar button:hover{
    background:#e9ecef;
}

.delete-text{
    color:white;
    background:#dc3545 !important;
    border-color:#dc3545 !important;
}

.page-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.page-buttons button{
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

.rotate-button{
    background:#0d6efd;
}

.delete-button{
    background:#dc3545;
}

.deleted{
    display:none;
}

.download-box{
    text-align:center;
    margin:30px 0 10px;
}

.download-button{
    border:none;
    background:#198754;
    color:white;
    padding:14px 30px;
    border-radius:7px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
    margin:5px;
}

.add-text-button{
    background:#0d6efd;
}

.download-button:hover{
    opacity:.9;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    header h1{
        font-size:24px;
    }

    .page{
        padding:8px;
    }

    .page-buttons{
        flex-direction:row;
    }

    .page-buttons button{
        flex:1;
        padding:10px 8px;
    }

    .text-toolbar{
        gap:5px;
    }

    .text-toolbar select,
    .text-toolbar input,
    .text-toolbar button{
        font-size:13px;
    }

}

</style>

</head>

<body>

<header>

<h1>PDF Editor Tools Free</h1>

<p>Edit PDF Online for Free</p>

</header>

<div class="container">

<div class="upload-box">

<h2>Upload Your PDF</h2>

<p>Select a PDF file from your device</p>

<label for="pdfFile" class="upload-btn">
Choose PDF
</label>

<input
type="file"
id="pdfFile"
accept="application/pdf">

<div id="fileName" class="file-name"></div>

</div>

<div id="preview">

<h2>PDF Preview</h2>

<div id="pages"></div>

<div class="download-box">

<button
id="addTextButton"
class="download-button add-text-button">

➕ Add Text

</button>

<button
id="downloadButton"
class="download-button">

💾 Download Edited PDF

</button>

</div>

<div id="status" class="status"></div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const fileName =
document.getElementById("fileName");

const preview =
document.getElementById("preview");

const pagesContainer =
document.getElementById("pages");

const downloadButton =
document.getElementById("downloadButton");

const addTextButton =
document.getElementById("addTextButton");

const statusBox =
document.getElementById("status");


let originalPdfBytes = null;

let pageSettings = [];

let addedTexts = [];

let textMode = false;

let selectedText = null;


/* =========================
   PDF UPLOAD
========================= */

fileInput.addEventListener(
"change",
function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    if(file.type !== "application/pdf"){

        alert("Please select a PDF file.");

        return;
    }

    fileName.textContent =
    "Selected: " + file.name;

    pagesContainer.innerHTML = "";

    pageSettings = [];

    addedTexts = [];

    selectedText = null;

    preview.style.display = "block";

    statusBox.textContent =
    "Loading PDF...";

    const reader =
    new FileReader();

    reader.onload =
    async function(){

        try{

            /*
            Important:
            Keep a separate copy of the PDF bytes.
            PDF.js may transfer/detach its input buffer.
            */

            originalPdfBytes =
            new Uint8Array(reader.result).slice(0);

            const pdfData =
            new Uint8Array(
                originalPdfBytes
            ).slice(0);

            const pdf =
            await pdfjsLib
            .getDocument({
                data:pdfData
            })
            .promise;

            pagesContainer.innerHTML = "";

            for(
                let i=1;
                i<=pdf.numPages;
                i++
            ){

                pageSettings.push({

                    rotation:0,

                    deleted:false

                });

                addedTexts.push([]);

                await createPage(
                    pdf,
                    i
                );

            }

            statusBox.textContent =
            "PDF loaded successfully.";

        }

        catch(error){

            console.error(error);

            statusBox.textContent = "";

            alert(
                "PDF could not be loaded."
            );

        }

    };

    reader.readAsArrayBuffer(file);

});


/* =========================
   CREATE PAGE
========================= */

async function createPage(
    pdf,
    pageNumber
){

    const page =
    await pdf.getPage(pageNumber);


    const pageBox =
    document.createElement("div");

    pageBox.className =
    "page";


    const number =
    document.createElement("div");

    number.className =
    "page-number";

    number.textContent =
    "Page " + pageNumber;


    const canvasWrap =
    document.createElement("div");

    canvasWrap.className =
    "canvas-wrap";


    const canvas =
    document.createElement("canvas");


    const textLayer =
    document.createElement("div");

    textLayer.className =
    "text-layer";


    canvasWrap.appendChild(
        canvas
    );

    canvasWrap.appendChild(
        textLayer
    );


    const buttonBox =
    document.createElement("div");

    buttonBox.className =
    "page-buttons";


    const rotateButton =
    document.createElement("button");

    rotateButton.className =
    "rotate-button";

    rotateButton.textContent =
    "🔄 Rotate";


    const deleteButton =
    document.createElement("button");

    deleteButton.className =
    "delete-button";

    deleteButton.textContent =
    "🗑️ Delete";


    buttonBox.appendChild(
        rotateButton
    );

    buttonBox.appendChild(
        deleteButton
    );


    pageBox.appendChild(
        number
    );

    pageBox.appendChild(
        canvasWrap
    );

    pageBox.appendChild(
        buttonBox
    );


    pagesContainer.appendChild(
        pageBox
    );


    async function renderPage(){

        const rotation =
        pageSettings[
            pageNumber - 1
        ].rotation;


        const viewport =
        page.getViewport({

            scale:1.5,

            rotation:rotation

        });


        canvas.width =
        viewport.width;

        canvas.height =
        viewport.height;


        canvas.style.width =
        "100%";


        canvas.style.height =
        "auto";


        const context =
        canvas.getContext("2d");


        textLayer.innerHTML = "";


        await page.render({

            canvasContext:
            context,

            viewport:
            viewport

        }).promise;


        renderTexts();

    }


    function renderTexts(){

        textLayer.innerHTML = "";


        const texts =
        addedTexts[
            pageNumber - 1
        ] || [];


        const scaleX =
        canvas.clientWidth /
        canvas.width;


        const scaleY =
        canvas.clientHeight /
        canvas.height;


        texts.forEach(
        function(item,index){

            const div =
            document.createElement("div");

            div.className =
            "text-item";


            div.textContent =
            item.text;


            div.style.left =
            (item.x * scaleX) + "px";


            div.style.top =
            (item.y * scaleY) + "px";


            div.style.fontSize =
            (item.fontSize * scaleY) + "px";


            div.style.fontFamily =
            item.fontFamily;


            div.style.fontWeight =
            item.bold
            ? "bold"
            : "normal";


            div.style.fontStyle =
            item.italic
            ? "italic"
            : "normal";


            div.style.textAlign =
            item.align;


            if(
                selectedText &&
                selectedText.pageIndex ===
                pageNumber - 1 &&
                selectedText.textIndex === index
            ){

                div.classList.add(
                    "selected"
                );

            }


            div.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                selectedText = {

                    pageIndex:
                    pageNumber - 1,

                    textIndex:
                    index

                };

                renderTexts();

                showToolbar(
                    pageBox,
                    pageNumber - 1,
                    index
                );

            });


            div.addEventListener(
            "dblclick",
            function(e){

                e.stopPropagation();

                const newText =
                prompt(
                    "Edit text:",
                    item.text
                );

                if(
                    newText !== null &&
                    newText.trim() !== ""
                ){

                    item.text =
                    newText;

                    renderTexts();

                }

            });


            makeDraggable(
                div,
                item,
                canvas
            );


            textLayer.appendChild(
                div
            );

        });

    }


    function showToolbar(
        box,
        pageIndex,
        textIndex
    ){

        const oldToolbar =
        box.querySelector(
            ".text-toolbar"
        );

        if(oldToolbar){
            oldToolbar.remove();
        }


        const item =
        addedTexts[
            pageIndex
        ][
            textIndex
        ];


        const toolbar =
        document.createElement("div");

        toolbar.className =
        "text-toolbar";


        const fontSelect =
        document.createElement("select");


        const fonts = [
            "Arial",
            "Helvetica",
            "Times New Roman",
            "Courier New"
        ];


        fonts.forEach(
        function(font){

            const option =
            document.createElement("option");

            option.value =
            font;

            option.textContent =
            font;

            if(
                font ===
                item.fontFamily
            ){

                option.selected =
                true;

            }

            fontSelect.appendChild(
                option
            );

        });


        const sizeInput =
        document.createElement("input");

        sizeInput.type =
        "number";

        sizeInput.min =
        "6";

        sizeInput.max =
        "100";

        sizeInput.value =
        item.fontSize;

        sizeInput.style.width =
        "70px";


        const boldButton =
        document.createElement("button");

        boldButton.textContent =
        "B";


        const italicButton =
        document.createElement("button");

        italicButton.textContent =
        "I";


        const leftButton =
        document.createElement("button");

        leftButton.textContent =
        "⬅";


        const centerButton =
        document.createElement("button");

        centerButton.textContent =
        "↔";


        const rightButton =
        document.createElement("button");

        rightButton.textContent =
        "➡";


        const deleteTextButton =
        document.createElement("button");

        deleteTextButton.className =
        "delete-text";

        deleteTextButton.textContent =
        "🗑️ Delete Text";


        toolbar.appendChild(
            fontSelect
        );

        toolbar.appendChild(
            sizeInput
        );

        toolbar.appendChild(
            boldButton
        );

        toolbar.appendChild(
            italicButton
        );

        toolbar.appendChild(
            leftButton
        );

        toolbar.appendChild(
            centerButton
        );

        toolbar.appendChild(
            rightButton
        );

        toolbar.appendChild(
            deleteTextButton
        );


        box.appendChild(
            toolbar
        );


        fontSelect.addEventListener(
        "change",
        function(){

            item.fontFamily =
            this.value;

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        sizeInput.addEventListener(
        "change",
        function(){

            item.fontSize =
            Number(this.value);

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        boldButton.addEventListener(
        "click",
        function(){

            item.bold =
            !item.bold;

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        italicButton.addEventListener(
        "click",
        function(){

            item.italic =
            !item.italic;

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        leftButton.addEventListener(
        "click",
        function(){

            item.align =
            "left";

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        centerButton.addEventListener(
        "click",
        function(){

            item.align =
            "center";

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        rightButton.addEventListener(
        "click",
        function(){

            item.align =
            "right";

            renderTexts();

            showToolbar(
                box,
                pageIndex,
                textIndex
            );

        });


        deleteTextButton.addEventListener(
        "click",
        function(){

            if(
                confirm(
                    "Delete this text?"
                )
            ){

                addedTexts[
                    pageIndex
                ].splice(
                    textIndex,
                    1
                );

                selectedText =
                null;

                toolbar.remove();

                renderTexts();

            }

        });

    }


    rotateButton.addEventListener(
    "click",
    async function(){

        const settings =
        pageSettings[
            pageNumber - 1
        ];


        settings.rotation =
        (
            settings.rotation +
            90
        ) % 360;


        await renderPage();

    });


    deleteButton.addEventListener(
    "click",
    function(){

        const settings =
        pageSettings[
            pageNumber - 1
        ];


        if(
            confirm(
                "Delete Page " +
                pageNumber +
                "?"
            )
        ){

            settings.deleted =
            true;

            pageBox.classList.add(
                "deleted"
            );

        }

    });


    canvas.addEventListener(
    "click",
    function(e){

        if(!textMode){
            return;
        }


        const rect =
        canvas.getBoundingClientRect();


        const scaleX =
        canvas.width /
        rect.width;


        const scaleY =
        canvas.height /
        rect.height;


        const x =
        (e.clientX - rect.left)
        * scaleX;


        const y =
        (e.clientY - rect.top)
        * scaleY;


        createTextInput(
            canvasWrap,
            x,
            y,
            pageNumber - 1,
            renderTexts
        );


        textMode =
        false;


        addTextButton.textContent =
        "➕ Add Text";

    });


    await renderPage();

}


/* =========================
   ADD TEXT
========================= */

function createTextInput(
    container,
    x,
    y,
    pageIndex,
    refresh
){

    const input =
    document.createElement("input");

    input.className =
    "text-input";

    input.type =
    "text";

    input.placeholder =
    "Type text...";


    const scaleX =
    container.clientWidth /
    document.querySelector(
        ".page canvas"
    ).width;


    const scaleY =
    container.clientHeight /
    document.querySelector(
        ".page canvas"
    ).height;


    input.style.left =
    (x * scaleX) + "px";


    input.style.top =
    (y * scaleY) + "px";


    container.appendChild(
        input
    );


    input.focus();


    function saveText(){

        const value =
        input.value.trim();


        if(value !== ""){

            addedTexts[
                pageIndex
            ].push({

                text:value,

                x:x,

                y:y,

                fontSize:16,

                fontFamily:"Arial",

                bold:false,

                italic:false,

                align:"left"

            });

        }


        input.remove();

        refresh();

    }


    input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            saveText();

        }


        if(e.key === "Escape"){

            input.remove();

        }

    });


    input.addEventListener(
    "blur",
    function(){

        if(input.value.trim() !== ""){

            saveText();

        }
        else{

            input.remove();

        }

    });

}


/* =========================
   DRAG TEXT
========================= */

function makeDraggable(
    element,
    item,
    canvas
){

    let dragging =
    false;

    let startX =
    0;

    let startY =
    0;

    let originalX =
    0;

    let originalY =
    0;


    element.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        e.stopPropagation();


        dragging =
        true;


        startX =
        e.clientX;

        startY =
        e.clientY;


        originalX =
        item.x;

        originalY =
        item.y;


        element.setPointerCapture(
            e.pointerId
        );

    });


    element.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }


        const rect =
        canvas.getBoundingClientRect();


        const scaleX =
        canvas.width /
        rect.width;


        const scaleY =
        canvas.height /
        rect.height;


        const moveX =
        (e.clientX - startX)
        * scaleX;


        const moveY =
        (e.clientY - startY)
        * scaleY;


        item.x =
        originalX + moveX;


        item.y =
        originalY + moveY;


        element.style.left =
        (
            item.x *
            (canvas.clientWidth /
            canvas.width)
        ) + "px";


        element.style.top =
        (
            item.y *
            (canvas.clientHeight /
            canvas.height)
        ) + "px";

    });


    element.addEventListener(
    "pointerup",
    function(){

        dragging =
        false;

    });


    element.addEventListener(
    "pointercancel",
    function(){

        dragging =
        false;

    });

}


/* =========================
   ADD TEXT BUTTON
========================= */

addTextButton.addEventListener(
"click",
function(){

    if(!originalPdfBytes){

        alert(
            "Please upload a PDF first."
        );

        return;

    }


    textMode =
    !textMode;


    if(textMode){

        addTextButton.textContent =
        "✏️ Click on PDF";

        statusBox.textContent =
        "PDF पर जहाँ text डालना है वहाँ click करें.";

    }
    else{

        addTextButton.textContent =
        "➕ Add Text";

        statusBox.textContent =
        "";

    }

});


/* =========================
   DOWNLOAD PDF
========================= */

downloadButton.addEventListener(
"click",
async function(){

    if(!originalPdfBytes){

        alert(
            "Please upload a PDF first."
        );

        return;

    }


    downloadButton.disabled =
    true;


    downloadButton.textContent =
    "⏳ Creating PDF...";


    statusBox.textContent =
    "Please wait...";


    try{

        /*
        Always create a fresh copy.
        */

        const pdfData =
        new Uint8Array(
            originalPdfBytes
        ).slice(0);


        const sourcePdf =
        await PDFLib.PDFDocument.load(
            pdfData
        );


        const newPdf =
        await PDFLib.PDFDocument.create();


        const helvetica =
        await newPdf.embedFont(
            PDFLib.StandardFonts.Helvetica
        );


        const times =
        await newPdf.embedFont(
            PDFLib.StandardFonts.TimesRoman
        );


        const courier =
        await newPdf.embedFont(
            PDFLib.StandardFonts.Courier
        );


        for(
            let i=0;
            i<sourcePdf.getPageCount();
            i++
        ){

            const settings =
            pageSettings[i];


            if(
                settings &&
                settings.deleted
            ){

                continue;

            }


            const copiedPages =
            await newPdf.copyPages(
                sourcePdf,
                [i]
            );


            const newPage =
            copiedPages[0];


            const pageWidth =
            newPage.getWidth();


            const pageHeight =
            newPage.getHeight();


            const texts =
            addedTexts[i] || [];


            texts.forEach(
            function(item){

                let font =
                helvetica;


                if(
                    item.fontFamily ===
                    "Times New Roman"
                ){

                    font =
                    times;

                }


                if(
                    item.fontFamily ===
                    "Courier New"
                ){

                    font =
                    courier;

                }


                let x =
                item.x;


                let y =
                pageHeight -
                item.y -
                item.fontSize;


                if(y < 0){
                    y = 0;
                }


                let textWidth =
                font.widthOfTextAtSize(
                    item.text,
                    item.fontSize
                );


                if(
                    item.align ===
                    "center"
                ){

                    x =
                    x -
                    (textWidth / 2);

                }


                if(
                    item.align ===
                    "right"
                ){

                    x =
                    x -
                    textWidth;

                }


                if(x < 0){
                    x = 0;
                }


                if(
                    x + textWidth >
                    pageWidth
                ){

                    x =
                    pageWidth -
                    textWidth;

                }


                newPage.drawText(
                    item.text,
                    {

                        x:x,

                        y:y,

                        size:item.fontSize,

                        font:font,

                        color:
                        PDFLib.rgb(
                            0,
                            0,
                            0
                        )

                    }
                );

            });


            if(
                settings &&
                settings.rotation
            ){

                newPage.setRotation(
                    PDFLib.degrees(
                        settings.rotation
                    )
                );

            }


            newPdf.addPage(
                newPage
            );

        }


        if(
            newPdf.getPageCount() === 0
        ){

            alert(
                "You cannot delete all pages."
            );

            return;

        }


        const pdfBytes =
        await newPdf.save();


        const blob =
        new Blob(
            [pdfBytes],
            {
                type:
                "application/pdf"
            }
        );


        const url =
        URL.createObjectURL(
            blob
        );


        const link =
        document.createElement("a");


        link.href =
        url;


        link.download =
        "edited-pdf.pdf";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
        );


        statusBox.textContent =
        "✅ PDF downloaded successfully.";

    }

    catch(error){

        console.error(
            "PDF ERROR:",
            error
        );


        alert(
            "Could not create edited PDF.\n\n" +
            error.message
        );


        statusBox.textContent =
        "";

    }


    downloadButton.disabled =
    false;


    downloadButton.textContent =
    "💾 Download Edited PDF";

});

</script>

</body>
</html>
