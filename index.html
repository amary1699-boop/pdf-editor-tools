<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor Tools Free</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    width:95%;
    max-width:1100px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #0d6efd;
    padding:35px 15px;
    text-align:center;
    border-radius:10px;
    background:#f8fbff;
}

input[type="file"]{
    display:none;
}

.upload-btn{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:13px 22px;
    border-radius:6px;
    cursor:pointer;
}

.file-name{
    margin-top:15px;
    font-weight:bold;
    word-break:break-word;
}

#preview{
    display:none;
    margin-top:30px;
}

.page{
    margin:30px auto;
    padding:15px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}

.page-number{
    font-weight:bold;
    margin-bottom:12px;
}

.canvas-wrap{
    position:relative;
    width:max-content;
    max-width:100%;
    margin:auto;
    overflow:visible;
}

.page canvas{
    display:block;
    max-width:100%;
    height:auto;
    border:1px solid #ddd;
}

.text-layer{
    position:absolute;
    left:0;
    top:0;
    right:0;
    bottom:0;
    overflow:hidden;
    line-height:1;
    pointer-events:auto;
    user-select:text;
}

.pdf-text{
    position:absolute;
    transform-origin:0 0;
    white-space:pre;
    cursor:text;
    color:transparent;
    background:transparent;
    border:1px solid transparent;
    padding:0;
    margin:0;
}

.pdf-text:hover{
    background:rgba(13,110,253,.08);
}

.pdf-text.selected{
    color:transparent;
    background:rgba(13,110,253,.10);
    border:1px dashed #0d6efd;
}

.editing-text{
    color:#000 !important;
    background:white !important;
    border:1px solid #0d6efd !important;
    outline:none;
    min-width:4px;
}

.floating-toolbar{
    position:absolute;
    z-index:99999;
    display:none;
    background:white;
    border:1px solid #ccc;
    border-radius:8px;
    padding:7px;
    box-shadow:0 5px 20px rgba(0,0,0,.20);
    align-items:center;
    gap:5px;
    flex-wrap:wrap;
    max-width:95vw;
}

.floating-toolbar select,
.floating-toolbar input,
.floating-toolbar button{
    height:32px;
    border:1px solid #ccc;
    border-radius:5px;
    background:white;
    padding:4px 7px;
    cursor:pointer;
}

.floating-toolbar button{
    font-weight:bold;
}

.floating-toolbar .danger{
    color:white;
    background:#dc3545;
    border-color:#dc3545;
}

.color-input{
    width:40px;
    padding:2px !important;
}

.added-text{
    position:absolute;
    z-index:20;
    cursor:move;
    white-space:nowrap;
    padding:2px 4px;
    border:1px dashed transparent;
}

.added-text.selected{
    border:1px dashed #0d6efd;
    background:rgba(13,110,253,.08);
}

.add-text-input{
    position:absolute;
    z-index:9999;
    min-width:180px;
    padding:8px;
    border:2px solid #0d6efd;
    border-radius:5px;
    outline:none;
    font-size:16px;
}

.page-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.page-buttons button{
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

.rotate-button{
    background:#0d6efd;
}

.delete-button{
    background:#dc3545;
}

.deleted{
    display:none;
}

.download-box{
    text-align:center;
    margin:30px 0 10px;
}

.action-button{
    border:none;
    color:white;
    padding:14px 25px;
    border-radius:7px;
    cursor:pointer;
    font-size:16px;
    font-weight:bold;
    margin:5px;
}

.add-button{
    background:#0d6efd;
}

.download-button{
    background:#198754;
}

.status{
    text-align:center;
    margin-top:15px;
    font-weight:bold;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    header h1{
        font-size:24px;
    }

    .page{
        padding:7px;
    }

    .page-buttons button{
        flex:1;
        padding:10px 8px;
    }

    .floating-toolbar{
        max-width:94vw;
        justify-content:center;
    }

    .floating-toolbar select{
        max-width:110px;
    }

}

</style>

</head>

<body>

<header>

<h1>PDF Editor Tools Free</h1>

<p>Edit PDF Online for Free</p>

</header>

<div class="container">

<div class="upload-box">

<h2>Upload Your PDF</h2>

<p>Select a PDF file from your device</p>

<label
for="pdfFile"
class="upload-btn">

Choose PDF

</label>

<input
type="file"
id="pdfFile"
accept="application/pdf">

<div
id="fileName"
class="file-name">
</div>

</div>


<div id="preview">

<h2>PDF Preview</h2>

<div id="pages"></div>

<div class="download-box">

<button
id="addTextButton"
class="action-button add-button">

➕ Add Text

</button>

<button
id="downloadButton"
class="action-button download-button">

💾 Download Edited PDF

</button>

</div>

<div id="status" class="status"></div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf_viewer.min.js"></script>

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const fileName =
document.getElementById("fileName");

const preview =
document.getElementById("preview");

const pagesContainer =
document.getElementById("pages");

const addTextButton =
document.getElementById("addTextButton");

const downloadButton =
document.getElementById("downloadButton");

const statusBox =
document.getElementById("status");


let originalPdfBytes = null;

let pageSettings = [];

let pagesData = [];

let addTextMode = false;

let selectedObject = null;


/* =========================================
   UPLOAD PDF
========================================= */

fileInput.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }

    if(file.type !== "application/pdf"){

        alert(
            "Please select a PDF file."
        );

        return;
    }


    fileName.textContent =
    "Selected: " + file.name;


    pagesContainer.innerHTML = "";

    pageSettings = [];

    pagesData = [];

    selectedObject = null;

    addTextMode = false;

    addTextButton.textContent =
    "➕ Add Text";


    preview.style.display =
    "block";


    statusBox.textContent =
    "Loading PDF...";


    const reader =
    new FileReader();


    reader.onload =
    async function(){

        try{

            originalPdfBytes =
            new Uint8Array(
                reader.result
            ).slice(0);


            const pdfData =
            new Uint8Array(
                originalPdfBytes
            ).slice(0);


            const pdf =
            await pdfjsLib
            .getDocument({
                data:pdfData
            })
            .promise;


            for(
                let i=1;
                i<=pdf.numPages;
                i++
            ){

                pageSettings.push({

                    rotation:0,

                    deleted:false

                });


                pagesData.push({

                    pageNumber:i,

                    pdfPage:null,

                    canvas:null,

                    textLayer:null,

                    textItems:[],

                    addedTexts:[],

                    viewport:null

                });

            }


            for(
                let i=1;
                i<=pdf.numPages;
                i++
            ){

                await createPage(
                    pdf,
                    i
                );

            }


            statusBox.textContent =
            "✅ PDF loaded. Existing text पर click करके edit करें.";

        }

        catch(error){

            console.error(error);

            alert(
                "PDF could not be loaded.\n\n" +
                error.message
            );

            statusBox.textContent =
            "";

        }

    };


    reader.readAsArrayBuffer(file);

});


/* =========================================
   CREATE PDF PAGE
========================================= */

async function createPage(
    pdf,
    pageNumber
){

    const index =
    pageNumber - 1;


    const data =
    pagesData[index];


    const page =
    await pdf.getPage(
        pageNumber
    );


    data.pdfPage =
    page;


    const pageBox =
    document.createElement("div");

    pageBox.className =
    "page";


    pageBox.dataset.pageIndex =
    index;


    const number =
    document.createElement("div");

    number.className =
    "page-number";

    number.textContent =
    "Page " + pageNumber;


    const canvasWrap =
    document.createElement("div");

    canvasWrap.className =
    "canvas-wrap";


    const canvas =
    document.createElement("canvas");


    const textLayer =
    document.createElement("div");

    textLayer.className =
    "text-layer";


    const toolbar =
    createToolbar(
        canvasWrap
    );


    canvasWrap.appendChild(
        canvas
    );

    canvasWrap.appendChild(
        textLayer
    );

    canvasWrap.appendChild(
        toolbar
    );


    data.canvas =
    canvas;

    data.textLayer =
    textLayer;


    const buttonBox =
    document.createElement("div");

    buttonBox.className =
    "page-buttons";


    const rotateButton =
    document.createElement("button");

    rotateButton.className =
    "rotate-button";

    rotateButton.textContent =
    "🔄 Rotate";


    const deleteButton =
    document.createElement("button");

    deleteButton.className =
    "delete-button";

    deleteButton.textContent =
    "🗑️ Delete";


    buttonBox.appendChild(
        rotateButton
    );

    buttonBox.appendChild(
        deleteButton
    );


    pageBox.appendChild(
        number
    );

    pageBox.appendChild(
        canvasWrap
    );

    pageBox.appendChild(
        buttonBox
    );


    pagesContainer.appendChild(
        pageBox
    );


    async function renderPage(){

        const rotation =
        pageSettings[index].rotation;


        const viewport =
        page.getViewport({

            scale:1.5,

            rotation:rotation

        });


        data.viewport =
        viewport;


        canvas.width =
        Math.round(
            viewport.width
        );


        canvas.height =
        Math.round(
            viewport.height
        );


        canvas.style.width =
        Math.round(
            viewport.width
        ) + "px";


        canvas.style.height =
        Math.round(
            viewport.height
        ) + "px";


        const context =
        canvas.getContext("2d");


        await page.render({

            canvasContext:
            context,

            viewport:
            viewport

        }).promise;


        await buildTextLayer();


        renderAddedTexts();

    }


    async function buildTextLayer(){

        textLayer.innerHTML =
        "";


        data.textItems =
        [];


        const textContent =
        await page.getTextContent();


        /*
        PDF.js text items are converted
        using the same viewport as canvas.
        This keeps the text position aligned
        with the PDF.
        */


        textContent.items.forEach(
        function(item){

            if(
                !item.str ||
                !item.str.trim()
            ){

                return;

            }


            const tx =
            pdfjsLib.Util.transform(
                viewportTransform(
                    viewportForText(
                        data.viewport
                    )
                ),
                item.transform
            );


            const fontSize =
            Math.sqrt(
                tx[2] * tx[2] +
                tx[3] * tx[3]
            );


            const angle =
            Math.atan2(
                tx[1],
                tx[0]
            );


            /*
            Approximate text height
            */

            const width =
            Math.max(
                1,
                Math.abs(
                    item.width *
                    data.viewport.scale
                )
            );


            const height =
            Math.max(
                1,
                fontSize * 1.2
            );


            const span =
            document.createElement("span");


            span.className =
            "pdf-text";


            span.textContent =
            item.str;


            span.dataset.index =
            data.textItems.length;


            span.style.left =
            tx[4] + "px";


            span.style.top =
            (
                tx[5] -
                fontSize
            ) + "px";


            span.style.fontSize =
            fontSize + "px";


            span.style.width =
            width + "px";


            span.style.height =
            height + "px";


            span.style.transform =
            "rotate(" +
            angle +
            "rad)";


            span.dataset.originalText =
            item.str;


            const pdfPoint =
            viewportToPdfPoint(
                data.viewport,
                tx[4],
                tx[5]
            );


            const textItem = {

                originalText:
                item.str,

                text:
                item.str,

                x:
                pdfPoint.x,

                y:
                pdfPoint.y,

                width:
                item.width,

                height:
                item.height || fontSize,

                fontSize:
                fontSize /
                data.viewport.scale,

                fontFamily:
                "Helvetica",

                bold:false,

                italic:false,

                underline:false,

                color:"#000000",

                align:"left",

                edited:false,

                deleted:false,

                span:span

            };


            data.textItems.push(
                textItem
            );


            span.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                selectExistingText(
                    index,
                    data.textItems[
                        Number(
                            span.dataset.index
                        )
                    ]
                );

            });


            span.addEventListener(
            "dblclick",
            function(e){

                e.stopPropagation();

                startEditingExistingText(
                    index,
                    data.textItems[
                        Number(
                            span.dataset.index
                        )
                    ]
                );

            });


            textLayer.appendChild(
                span
            );

        });

    }


    rotateButton.addEventListener(
    "click",
    async function(){

        pageSettings[index].rotation =
        (
            pageSettings[index].rotation +
            90
        ) % 360;


        await renderPage();

    });


    deleteButton.addEventListener(
    "click",
    function(){

        if(
            confirm(
                "Delete Page " +
                pageNumber +
                "?"
            )
        ){

            pageSettings[index].deleted =
            true;

            pageBox.classList.add(
                "deleted"
            );

        }

    });


    canvas.addEventListener(
    "click",
    function(e){

        if(!addTextMode){
            return;
        }


        e.stopPropagation();


        const rect =
        canvas.getBoundingClientRect();


        const x =
        e.clientX -
        rect.left;


        const y =
        e.clientY -
        rect.top;


        createNewText(
            index,
            x,
            y,
            canvasWrap
        );


        addTextMode =
        false;


        addTextButton.textContent =
        "➕ Add Text";

    });


    await renderPage();

}


/* =========================================
   VIEWPORT HELPERS
========================================= */

function viewportForText(viewport){

    return viewport;

}


function viewportTransform(viewport){

    return [

        1,
        0,
        0,
        1,
        0,
        0

    ];

}


function viewportToPdfPoint(
    viewport,
    x,
    y
){

    const point =
    viewport.convertToPdfPoint(
        x,
        y
    );


    return {

        x:point[0],

        y:point[1]

    };

}


/* =========================================
   TOOLBAR
========================================= */

function createToolbar(
    container
){

    const toolbar =
    document.createElement("div");


    toolbar.className =
    "floating-toolbar";


    toolbar.addEventListener(
    "click",
    function(e){

        e.stopPropagation();

    });


    return toolbar;

}


function showToolbar(
    pageIndex,
    item,
    span
){

    hideAllToolbars();


    const pageData =
    pagesData[pageIndex];


    const canvas =
    pageData.canvas;


    const toolbar =
    pagesContainer
    .children[pageIndex]
    .querySelector(
        ".floating-toolbar"
    );


    if(!toolbar){
        return;
    }


    toolbar.innerHTML =
    "";


    const fontSelect =
    document.createElement("select");


    [
        "Helvetica",
        "Times",
        "Courier"
    ].forEach(
    function(font){

        const option =
        document.createElement("option");

        option.value =
        font;

        option.textContent =
        font;

        if(
            font ===
            item.fontFamily
        ){

            option.selected =
            true;

        }

        fontSelect.appendChild(
            option
        );

    });


    const sizeInput =
    document.createElement("input");

    sizeInput.type =
    "number";

    sizeInput.min =
    "6";

    sizeInput.max =
    "100";

    sizeInput.value =
    Math.round(
        item.fontSize
    );

    sizeInput.style.width =
    "58px";


    const bold =
    document.createElement("button");

    bold.textContent =
    "B";


    const italic =
    document.createElement("button");

    italic.textContent =
    "I";


    const underline =
    document.createElement("button");

    underline.textContent =
    "U";


    const color =
    document.createElement("input");

    color.type =
    "color";

    color.className =
    "color-input";

    color.value =
    item.color || "#000000";


    const left =
    document.createElement("button");

    left.textContent =
    "⬅";


    const center =
    document.createElement("button");

    center.textContent =
    "↔";


    const right =
    document.createElement("button");

    right.textContent =
    "➡";


    const edit =
    document.createElement("button");

    edit.textContent =
    "✏️ Edit";


    const deleteButton =
    document.createElement("button");

    deleteButton.className =
    "danger";

    deleteButton.textContent =
    "🗑️";


    toolbar.appendChild(
        fontSelect
    );

    toolbar.appendChild(
        sizeInput
    );

    toolbar.appendChild(
        bold
    );

    toolbar.appendChild(
        italic
    );

    toolbar.appendChild(
        underline
    );

    toolbar.appendChild(
        color
    );

    toolbar.appendChild(
        left
    );

    toolbar.appendChild(
        center
    );

    toolbar.appendChild(
        right
    );

    toolbar.appendChild(
        edit
    );

    toolbar.appendChild(
        deleteButton
    );


    toolbar.style.display =
    "flex";


    /*
    Put toolbar near the selected text.
    */

    const spanRect =
    span.getBoundingClientRect();


    const containerRect =
    span.parentElement
    .parentElement
    .getBoundingClientRect();


    let toolbarLeft =
    spanRect.left -
    containerRect.left;


    let toolbarTop =
    spanRect.top -
    containerRect.top -
    45;


    if(toolbarTop < 5){

        toolbarTop =
        spanRect.bottom -
        containerRect.top +
        8;

    }


    if(
        toolbarLeft +
        toolbar.offsetWidth >
        containerRect.width
    ){

        toolbarLeft =
        Math.max(
            5,
            containerRect.width -
            toolbar.offsetWidth -
            5
        );

    }


    toolbar.style.left =
    toolbarLeft + "px";


    toolbar.style.top =
    toolbarTop + "px";


    fontSelect.addEventListener(
    "change",
    function(){

        item.fontFamily =
        this.value;

        applyVisualStyle(
            span,
            item
        );

    });


    sizeInput.addEventListener(
    "change",
    function(){

        item.fontSize =
        Number(this.value);

        applyVisualStyle(
            span,
            item
        );

    });


    bold.addEventListener(
    "click",
    function(){

        item.bold =
        !item.bold;

        applyVisualStyle(
            span,
            item
        );

    });


    italic.addEventListener(
    "click",
    function(){

        item.italic =
        !item.italic;

        applyVisualStyle(
            span,
            item
        );

    });


    underline.addEventListener(
    "click",
    function(){

        item.underline =
        !item.underline;

        applyVisualStyle(
            span,
            item
        );

    });


    color.addEventListener(
    "input",
    function(){

        item.color =
        this.value;

        applyVisualStyle(
            span,
            item
        );

    });


    left.addEventListener(
    "click",
    function(){

        item.align =
        "left";

    });


    center.addEventListener(
    "click",
    function(){

        item.align =
        "center";

    });


    right.addEventListener(
    "click",
    function(){

        item.align =
        "right";

    });


    edit.addEventListener(
    "click",
    function(){

        startEditingExistingText(
            pageIndex,
            item
        );

    });


    deleteButton.addEventListener(
    "click",
    function(){

        if(
            confirm(
                "Delete this text?"
            )
        ){

            item.deleted =
            true;

            span.style.display =
            "none";

            hideAllToolbars();

            selectedObject =
            null;

        }

    });

}


function applyVisualStyle(
    span,
    item
){

    span.style.fontFamily =
    item.fontFamily;


    span.style.fontSize =
    (
        item.fontSize *
        pagesData[
            selectedObject.pageIndex
        ].viewport.scale
    ) + "px";


    span.style.fontWeight =
    item.bold
    ? "bold"
    : "normal";


    span.style.fontStyle =
    item.italic
    ? "italic"
    : "normal";


    span.style.textDecoration =
    item.underline
    ? "underline"
    : "none";

}


function hideAllToolbars(){

    document
    .querySelectorAll(
        ".floating-toolbar"
    )
    .forEach(
    function(toolbar){

        toolbar.style.display =
        "none";

    });

}


/* =========================================
   SELECT EXISTING TEXT
========================================= */

function selectExistingText(
    pageIndex,
    item
){

    document
    .querySelectorAll(
        ".pdf-text.selected"
    )
    .forEach(
    function(el){

        el.classList.remove(
            "selected"
        );

    });


    if(
        item.deleted
    ){

        return;

    }


    item.span.classList.add(
        "selected"
    );


    selectedObject = {

        pageIndex:
        pageIndex,

        type:
        "existing",

        item:
        item

    };


    showToolbar(
        pageIndex,
        item,
        item.span
    );

}


/* =========================================
   EDIT EXISTING TEXT
========================================= */

function startEditingExistingText(
    pageIndex,
    item
){

    if(item.deleted){
        return;
    }


    const span =
    item.span;


    hideAllToolbars();


    span.classList.add(
        "editing-text"
    );


    span.contentEditable =
    "true";


    span.focus();


    const range =
    document.createRange();


    range.selectNodeContents(
        span
    );


    range.collapse(
        false
    );


    const selection =
    window.getSelection();


    selection.removeAllRanges();

    selection.addRange(
        range
    );


    let finished =
    false;


    function finish(){

        if(finished){
            return;
        }


        finished =
        true;


        const newText =
        span.textContent;


        if(
            newText.trim() === ""
        ){

            item.deleted =
            true;

            span.style.display =
            "none";

        }
        else{

            item.text =
            newText;

            item.edited =
            true;

        }


        span.contentEditable =
        "false";


        span.classList.remove(
            "editing-text"
        );


        document
        .removeEventListener(
            "mousedown",
            outside
        );


        selectExistingText(
            pageIndex,
            item
        );

    }


    function outside(e){

        if(
            !span.contains(e.target)
        ){

            finish();

        }

    }


    /*
    Enter is prevented so it never
    creates a second text object.
    */

    span.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            finish();

        }

        if(e.key === "Escape"){

            e.preventDefault();

            span.textContent =
            item.text;

            finish();

        }

    });


    setTimeout(
    function(){

        document.addEventListener(
            "mousedown",
            outside
        );

    },
    0
    );

}


/* =========================================
   ADD NEW TEXT
========================================= */

function createNewText(
    pageIndex,
    screenX,
    screenY,
    canvasWrap
){

    const pageData =
    pagesData[pageIndex];


    const canvas =
    pageData.canvas;


    const input =
    document.createElement("input");


    input.className =
    "add-text-input";


    input.placeholder =
    "Type text...";


    input.style.left =
    screenX + "px";


    input.style.top =
    screenY + "px";


    canvasWrap.appendChild(
        input
    );


    input.focus();


    let saved =
    false;


    function save(){

        if(saved){
            return;
        }


        saved =
        true;


        const value =
        input.value.trim();


        if(value !== ""){

            const pdfPoint =
            viewportToPdfPoint(
                pageData.viewport,
                screenX,
                screenY +
                16
            );


            pageData.addedTexts.push({

                text:value,

                x:pdfPoint.x,

                y:pdfPoint.y,

                fontSize:16,

                fontFamily:"Helvetica",

                bold:false,

                italic:false,

                underline:false,

                color:"#000000",

                align:"left"

            });

        }


        input.remove();


        renderAddedTexts();

    }


    input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            e.stopPropagation();

            save();

        }


        if(e.key === "Escape"){

            e.preventDefault();

            saved =
            true;

            input.remove();

        }

    });


    /*
    Blur only saves once.
    */

    input.addEventListener(
    "blur",
    function(){

        setTimeout(
        function(){

            if(
                document.body.contains(
                    input
                )
            ){

                save();

            }

        },
        100
        );

    });

}


/* =========================================
   RENDER NEW TEXT
========================================= */

function renderAddedTexts(){

    pagesData.forEach(
    function(data,pageIndex){

        if(!data.canvas){
            return;
        }


        const wrap =
        data.canvas.parentElement;


        wrap.querySelectorAll(
            ".added-text"
        ).forEach(
        function(el){

            el.remove();

        });


        data.addedTexts.forEach(
        function(item,index){

            const div =
            document.createElement("div");


            div.className =
            "added-text";


            div.textContent =
            item.text;


            const point =
            data.viewport
            .convertToViewportPoint(
                item.x,
                item.y
            );


            div.style.left =
            point[0] + "px";


            div.style.top =
            (
                point[1] -
                item.fontSize
            ) + "px";


            div.style.fontSize =
            (
                item.fontSize *
                data.viewport.scale
            ) + "px";


            div.style.fontFamily =
            item.fontFamily;


            div.style.fontWeight =
            item.bold
            ? "bold"
            : "normal";


            div.style.fontStyle =
            item.italic
            ? "italic"
            : "normal";


            div.style.textDecoration =
            item.underline
            ? "underline"
            : "none";


            div.style.color =
            item.color;


            div.addEventListener(
            "click",
            function(e){

                e.stopPropagation();

                selectAddedText(
                    pageIndex,
                    index,
                    div
                );

            });


            div.addEventListener(
            "dblclick",
            function(e){

                e.stopPropagation();

                const newValue =
                prompt(
                    "Edit text:",
                    item.text
                );


                if(
                    newValue !== null
                ){

                    item.text =
                    newValue;

                    renderAddedTexts();

                }

            });


            makeAddedTextDraggable(
                div,
                item,
                data
            );


            wrap.appendChild(
                div
            );

        });

    });

}


/* =========================================
   SELECT NEW TEXT
========================================= */

function selectAddedText(
    pageIndex,
    textIndex,
    element
){

    document
    .querySelectorAll(
        ".added-text.selected"
    )
    .forEach(
    function(el){

        el.classList.remove(
            "selected"
        );

    });


    element.classList.add(
        "selected"
    );


    selectedObject = {

        pageIndex:
        pageIndex,

        type:
        "added",

        index:
        textIndex

    };


    /*
    Reuse toolbar by creating a
    temporary reference.
    */

    const data =
    pagesData[pageIndex];


    showAddedToolbar(
        pageIndex,
        textIndex,
        element
    );

}


/* =========================================
   TOOLBAR FOR NEW TEXT
========================================= */

function showAddedToolbar(
    pageIndex,
    textIndex,
    element
){

    hideAllToolbars();


    const pageBox =
    pagesContainer
    .children[pageIndex];


    const toolbar =
    pageBox.querySelector(
        ".floating-toolbar"
    );


    const item =
    pagesData[
        pageIndex
    ].addedTexts[
        textIndex
    ];


    toolbar.innerHTML =
    "";


    const font =
    document.createElement("select");


    [
        "Helvetica",
        "Times",
        "Courier"
    ].forEach(
    function(f){

        const option =
        document.createElement("option");

        option.value =
        f;

        option.textContent =
        f;

        if(
            f ===
            item.fontFamily
        ){

            option.selected =
            true;

        }

        font.appendChild(
            option
        );

    });


    const size =
    document.createElement("input");

    size.type =
    "number";

    size.value =
    item.fontSize;

    size.min =
    "6";

    size.max =
    "100";

    size.style.width =
    "55px";


    const bold =
    document.createElement("button");

    bold.textContent =
    "B";


    const italic =
    document.createElement("button");

    italic.textContent =
    "I";


    const underline =
    document.createElement("button");

    underline.textContent =
    "U";


    const color =
    document.createElement("input");

    color.type =
    "color";

    color.className =
    "color-input";

    color.value =
    item.color;


    const del =
    document.createElement("button");

    del.className =
    "danger";

    del.textContent =
    "🗑️";


    [
        font,
        size,
        bold,
        italic,
        underline,
        color,
        del
    ].forEach(
    function(el){

        toolbar.appendChild(
            el
        );

    });


    toolbar.style.display =
    "flex";


    const spanRect =
    element.getBoundingClientRect();


    const containerRect =
    element.parentElement
    .getBoundingClientRect();


    toolbar.style.left =
    Math.max(
        5,
        spanRect.left -
        containerRect.left
    ) + "px";


    toolbar.style.top =
    Math.max(
        5,
        spanRect.top -
        containerRect.top -
        45
    ) + "px";


    font.onchange =
    function(){

        item.fontFamily =
        this.value;

        renderAddedTexts();

        selectAddedText(
            pageIndex,
            textIndex,
            pagesData[
                pageIndex
            ].canvas.parentElement
            .querySelectorAll(
                ".added-text"
            )[textIndex]
        );

    };


    size.onchange =
    function(){

        item.fontSize =
        Number(this.value);

        renderAddedTexts();

    };


    bold.onclick =
    function(){

        item.bold =
        !item.bold;

        renderAddedTexts();

    };


    italic.onclick =
    function(){

        item.italic =
        !item.italic;

        renderAddedTexts();

    };


    underline.onclick =
    function(){

        item.underline =
        !item.underline;

        renderAddedTexts();

    };


    color.oninput =
    function(){

        item.color =
        this.value;

        renderAddedTexts();

    };


    del.onclick =
    function(){

        pagesData[
            pageIndex
        ].addedTexts.splice(
            textIndex,
            1
        );


        selectedObject =
        null;

        hideAllToolbars();

        renderAddedTexts();

    };

}


/* =========================================
   DRAG NEW TEXT
========================================= */

function makeAddedTextDraggable(
    element,
    item,
    data
){

    let dragging =
    false;


    let startX =
    0;

    let startY =
    0;


    let originalX =
    item.x;

    let originalY =
    item.y;


    element.addEventListener(
    "pointerdown",
    function(e){

        e.preventDefault();

        e.stopPropagation();


        dragging =
        true;


        startX =
        e.clientX;

        startY =
        e.clientY;


        originalX =
        item.x;

        originalY =
        item.y;


        element.setPointerCapture(
            e.pointerId
        );

    });


    element.addEventListener(
    "pointermove",
    function(e){

        if(!dragging){
            return;
        }


        const dx =
        e.clientX -
        startX;


        const dy =
        e.clientY -
        startY;


        item.x =
        originalX +
        (
            dx /
            data.viewport.scale
        );


        item.y =
        originalY -
        (
            dy /
            data.viewport.scale
        );


        const point =
        data.viewport
        .convertToViewportPoint(
            item.x,
            item.y
        );


        element.style.left =
        point[0] + "px";


        element.style.top =
        (
            point[1] -
            item.fontSize
        ) + "px";

    });


    element.addEventListener(
    "pointerup",
    function(){

        dragging =
        false;

    });

}

/* =========================================
   DOWNLOAD PDF
========================================= */

downloadButton.addEventListener(
"click",
async function(){

    if(!originalPdfBytes){

        alert(
            "Please upload a PDF first."
        );

        return;

    }


    downloadButton.disabled =
    true;


    downloadButton.textContent =
    "⏳ Creating PDF...";


    statusBox.textContent =
    "Creating edited PDF...";


    try{

        const pdfBytes =
        new Uint8Array(
            originalPdfBytes
        ).slice(0);


        const sourcePdf =
        await PDFLib.PDFDocument.load(
            pdfBytes
        );


        const newPdf =
        await PDFLib.PDFDocument.create();


        const fonts = {

            Helvetica:
            await newPdf.embedFont(
                PDFLib.StandardFonts.Helvetica
            ),

            Times:
            await newPdf.embedFont(
                PDFLib.StandardFonts.TimesRoman
            ),

            Courier:
            await newPdf.embedFont(
                PDFLib.StandardFonts.Courier
            )

        };


        for(
            let i=0;
            i<sourcePdf.getPageCount();
            i++
        ){

            if(
                pageSettings[i] &&
                pageSettings[i].deleted
            ){

                continue;

            }


            const copied =
            await newPdf.copyPages(
                sourcePdf,
                [i]
            );


            const newPage =
            copied[0];


            /*
            Existing edited text
            */

            const data =
            pagesData[i];


            for(
                const item
                of data.textItems
            ){

                if(
                    !item.edited &&
                    !item.deleted
                ){

                    continue;

                }


                /*
                White rectangle covers
                original text.
                */

                const coverWidth =
                Math.max(
                    item.width + 4,
                    10
                );


                const coverHeight =
                Math.max(
                    item.height + 5,
                    item.fontSize + 5
                );


                newPage.drawRectangle({

                    x:
                    item.x - 2,

                    y:
                    item.y -
                    item.fontSize,

                    width:
                    coverWidth,

                    height:
                    coverHeight,

                    color:
                    PDFLib.rgb(
                        1,
                        1,
                        1
                    )

                });


                if(
                    item.deleted
                ){

                    continue;

                }


                const font =
                fonts[
                    item.fontFamily
                ] ||
                fonts.Helvetica;


                const rgb =
                hexToRgb(
                    item.color ||
                    "#000000"
                );


                newPage.drawText(
                    item.text,
                    {

                        x:
                        item.x,

                        y:
                        item.y -
                        item.fontSize,

                        size:
                        item.fontSize,

                        font:
                        font,

                        color:
                        PDFLib.rgb(
                            rgb.r,
                            rgb.g,
                            rgb.b
                        )

                    }
                );

            }


            /*
            Newly added text
            */

            for(
                const item
                of data.addedTexts
            ){

                const font =
                fonts[
                    item.fontFamily
                ] ||
                fonts.Helvetica;


                const rgb =
                hexToRgb(
                    item.color ||
                    "#000000"
                );


                let x =
                item.x;


                const textWidth =
                font.widthOfTextAtSize(
                    item.text,
                    item.fontSize
                );


                if(
                    item.align ===
                    "center"
                ){

                    x -=
                    textWidth / 2;

                }


                if(
                    item.align ===
                    "right"
                ){

                    x -=
                    textWidth;

                }


                newPage.drawText(
                    item.text,
                    {

                        x:x,

                        y:
                        item.y -
                        item.fontSize,

                        size:
                        item.fontSize,

                        font:
                        font,

                        color:
                        PDFLib.rgb(
                            rgb.r,
                            rgb.g,
                            rgb.b
                        )

                    }
                );

            }


            if(
                pageSettings[i] &&
                pageSettings[i].rotation
            ){

                newPage.setRotation(
                    PDFLib.degrees(
                        pageSettings[i].rotation
                    )
                );

            }


            newPdf.addPage(
                newPage
            );

        }


        if(
            newPdf.getPageCount() === 0
        ){

            alert(
                "You cannot delete all pages."
            );

            return;

        }


        const result =
        await newPdf.save();


        const blob =
        new Blob(
            [result],
            {
                type:
                "application/pdf"
            }
        );


        const url =
        URL.createObjectURL(
            blob
        );


        const link =
        document.createElement("a");


        link.href =
        url;


        link.download =
        "edited-pdf.pdf";


        document.body.appendChild(
            link
        );


        link.click();


        link.remove();


        setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        1000
        );


        statusBox.textContent =
        "✅ Edited PDF downloaded successfully.";

    }

    catch(error){

        console.error(
            "PDF ERROR:",
            error
        );


        alert(
            "Could not create edited PDF.\n\n" +
            error.message
        );


        statusBox.textContent =
        "";

    }


    downloadButton.disabled =
    false;


    downloadButton.textContent =
    "💾 Download Edited PDF";

});


/* =========================================
   COLOR CONVERTER
========================================= */

function hexToRgb(hex){

    hex =
    hex.replace(
        "#",
        ""
    );


    if(hex.length === 3){

        hex =
        hex
        .split("")
        .map(
        function(x){

            return x + x;

        })
        .join("");

    }


    const number =
    parseInt(
        hex,
        16
    );


    return {

        r:
        ((number >> 16) & 255)
        / 255,

        g:
        ((number >> 8) & 255)
        / 255,

        b:
        (number & 255)
        / 255

    };

}
