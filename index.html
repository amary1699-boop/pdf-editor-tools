<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor Tools Free</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    width:95%;
    max-width:1000px;

    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);

    border:2px dashed #0d6efd;

.page{

    border:1px solid #ddd;

.page-title{
    font-weight:bold;
    margin-bottom:10px;
}

.page canvas{
    width:100%;

    height:auto;
    border:1px solid #ddd;
}

.page-controls{
    margin-top:12px;

.page-controls button{
    border:0;

    background:#0d6efd;
}

    display:none;

@media(max-width:600px){

    .container{
        padding:15px;
    }

    header h1{
        font-size:24px;

        padding:10px;

</style>

</head>

<body>

<header>

<h1>PDF Editor Tools Free</h1>

<p>Edit PDF Online for Free</p>

</header>


<div class="container">

<div class="upload-box">

<h2>Upload Your PDF</h2>

<p>Select a PDF file from your device</p>

<label for="pdfFile" class="upload-btn">
Choose PDF
</label>

<input type="file"
       id="pdfFile"
       accept="application/pdf">

<div class="file-name" id="fileName"></div>

</div>


<div id="preview">

<h2>PDF Preview</h2>

<div id="pages"></div>

</div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

const pdfFile =
document.getElementById("pdfFile");

const fileName =
document.getElementById("fileName");

const preview =
document.getElementById("preview");

const pagesContainer =
document.getElementById("pages");


pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


let pageData = [];


pdfFile.addEventListener("change", function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    if(file.type !== "application/pdf"){

        alert("Please select a PDF file.");

        return;
    }

    fileName.textContent =
    "Selected: " + file.name;

    pagesContainer.innerHTML =
    "<p>Loading PDF...</p>";

    preview.style.display = "block";


    const reader = new FileReader();


    reader.onload = function(){

        const typedarray =
        new Uint8Array(this.result);


        pdfjsLib.getDocument(typedarray)
        .promise
        .then(function(pdf){

            pagesContainer.innerHTML = "";

            pageData = [];


            for(
                let pageNumber = 1;
                pageNumber <= pdf.numPages;
                pageNumber++
            ){

                renderPage(
                    pdf,
                    pageNumber
                );

            }

        })
        .catch(function(error){

            console.error(error);

            alert(
                "PDF could not be loaded."
            );

        });

    };


    reader.readAsArrayBuffer(file);

});


function renderPage(pdf,pageNumber){

    pdf.getPage(pageNumber)
    .then(function(page){

        const pageDiv =
        document.createElement("div");

        pageDiv.className =
        "page";


        const title =
        document.createElement("div");

        title.className =
        "page-title";

        title.textContent =
        "Page " + pageNumber;


        const canvas =
        document.createElement("canvas");


        const controls =
        document.createElement("div");

        controls.className =
        "page-controls";


        const rotateButton =
        document.createElement("button");

        rotateButton.className =
        "rotate-btn";

        rotateButton.textContent =
        "🔄 Rotate";


        const deleteButton =
        document.createElement("button");

        deleteButton.className =
        "delete-btn";

        deleteButton.textContent =
        "🗑️ Delete";


        controls.appendChild(
            rotateButton
        );

        controls.appendChild(
            deleteButton
        );


        pageDiv.appendChild(title);

        pageDiv.appendChild(canvas);

        pageDiv.appendChild(controls);

        pagesContainer.appendChild(
            pageDiv
        );


        const data = {

            page: page,

            canvas: canvas,

            rotation: 0,

            deleted: false

        };


        pageData.push(data);


        renderCanvas(data);


        rotateButton.onclick =
        function(){

            data.rotation =
            (data.rotation + 90) % 360;

            renderCanvas(data);

        };


        deleteButton.onclick =
        function(){

            if(
                confirm(
                    "Delete this page?"
                )
            ){

                data.deleted = true;

                pageDiv.classList.add(
                    "deleted"
                );

            }

        };

    });

}


function renderCanvas(data){

    const rotation =
    data.rotation;

    const viewport =
    data.page.getViewport({

        scale:1.5,

        rotation:rotation

    });


    data.canvas.width =
    viewport.width;

    data.canvas.height =
    viewport.height;


    const context =
    data.canvas.getContext("2d");


    context.clearRect(
        0,
        0,
        data.canvas.width,
        data.canvas.height
    );


    data.page.render({

        canvasContext:context,

        viewport:viewport

    });

}

</script>

</body>
</html>
