<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor Tools Free</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    text-align:center;
    padding:25px 15px;
}

header h1{
    margin:0 0 8px;
}

.container{
    width:95%;
    max-width:1000px;
    margin:25px auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 3px 15px rgba(0,0,0,.1);
}

.upload-box{
    border:2px dashed #0d6efd;
    padding:35px 15px;
    text-align:center;
    border-radius:10px;
    background:#f8fbff;
}

input[type="file"]{
    display:none;
}

.upload-btn{
    display:inline-block;
    background:#0d6efd;
    color:white;
    padding:13px 22px;
    border-radius:6px;
    cursor:pointer;
}

.file-name{
    margin-top:15px;
    font-weight:bold;
}

#preview{
    display:none;
    margin-top:30px;
}

.page{
    margin:25px auto;
    padding:15px;
    text-align:center;
    border:1px solid #ddd;
    border-radius:10px;
    background:white;
}

.page-number{
    font-weight:bold;
    margin-bottom:12px;
}

.page canvas{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    margin:auto;
    border:1px solid #ddd;
}

.page-buttons{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:15px;
}

.page-buttons button{
    border:none;
    color:white;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-size:15px;
}

.rotate-button{
    background:#0d6efd;
}

.delete-button{
    background:#dc3545;
}

.deleted{
    display:none;
}

.download-box{
    text-align:center;
    margin:30px 0 10px;
}

.download-button{
    border:none;
    background:#198754;
    color:white;
    padding:14px 30px;
    border-radius:7px;
    cursor:pointer;
    font-size:17px;
    font-weight:bold;
}

.download-button:hover{
    background:#157347;
}

@media(max-width:600px){

    .container{
        padding:15px;
    }

    header h1{
        font-size:24px;
    }

    .page{
        padding:10px;
    }

    .page-buttons{
        flex-direction:row;
    }

    .page-buttons button{
        flex:1;
    }

}

</style>

</head>

<body>

<header>

<h1>PDF Editor Tools Free</h1>

<p>Edit PDF Online for Free</p>

</header>


<div class="container">


<div class="upload-box">

<h2>Upload Your PDF</h2>

<p>Select a PDF file from your device</p>

<label
for="pdfFile"
class="upload-btn">

Choose PDF

</label>

<input
type="file"
id="pdfFile"
accept="application/pdf">

<div
id="fileName"
class="file-name">
</div>

</div>


<div id="preview">

<h2>PDF Preview</h2>

<div id="pages"></div>


<div class="download-box">

<button
id="downloadButton"
class="download-button">

💾 Download Edited PDF

</button>

</div>

</div>


</div>


<!-- PDF.JS -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>


<!-- PDF-LIB -->

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>


<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const fileInput =
document.getElementById("pdfFile");

const fileName =
document.getElementById("fileName");

const preview =
document.getElementById("preview");

const pagesContainer =
document.getElementById("pages");

const downloadButton =
document.getElementById("downloadButton");


let originalPdfBytes = null;

let pageSettings = [];


fileInput.addEventListener(
"change",
function(){

    const file =
    this.files[0];

    if(!file){
        return;
    }


    if(file.type !== "application/pdf"){

        alert(
            "Please select a PDF file."
        );

        return;
    }


    fileName.textContent =
    "Selected: " + file.name;


    pagesContainer.innerHTML = "";

    pageSettings = [];


    preview.style.display =
    "block";


    const reader =
    new FileReader();


    reader.onload =
    function(){

        originalPdfBytes =
        reader.result;


        const data =
        new Uint8Array(
            originalPdfBytes
        );


        pdfjsLib
        .getDocument(data)
        .promise
        .then(function(pdf){


            console.log(
                "Total Pages: " +
                pdf.numPages
            );


            pagesContainer.innerHTML =
            "";


            for(
                let i=1;
                i<=pdf.numPages;
                i++
            ){

                pageSettings.push({

                    rotation:0,

                    deleted:false

                });


                createPage(
                    pdf,
                    i
                );

            }


        })
        .catch(function(error){

            console.error(error);

            alert(
                "PDF could not be loaded."
            );

        });

    };


    reader.readAsArrayBuffer(file);

});


function createPage(
    pdf,
    pageNumber
){

    pdf.getPage(pageNumber)
    .then(function(page){


        const pageBox =
        document.createElement("div");

        pageBox.className =
        "page";


        const number =
        document.createElement("div");

        number.className =
        "page-number";

        number.textContent =
        "Page " + pageNumber;


        const canvas =
        document.createElement("canvas");


        const buttonBox =
        document.createElement("div");

        buttonBox.className =
        "page-buttons";


        const rotateButton =
        document.createElement("button");

        rotateButton.className =
        "rotate-button";

        rotateButton.textContent =
        "🔄 Rotate";


        const deleteButton =
        document.createElement("button");

        deleteButton.className =
        "delete-button";

        deleteButton.textContent =
        "🗑️ Delete";


        buttonBox.appendChild(
            rotateButton
        );

        buttonBox.appendChild(
            deleteButton
        );


        pageBox.appendChild(
            number
        );

        pageBox.appendChild(
            canvas
        );

        pageBox.appendChild(
            buttonBox
        );


        pagesContainer.appendChild(
            pageBox
        );


        function renderPage(){

            const rotation =
            pageSettings[
                pageNumber - 1
            ].rotation;


            const viewport =
            page.getViewport({

                scale:1.5,

                rotation:rotation

            });


            canvas.width =
            viewport.width;

            canvas.height =
            viewport.height;


            const context =
            canvas.getContext(
                "2d"
            );


            page.render({

                canvasContext:
                context,

                viewport:
                viewport

            });

        }


        renderPage();


        rotateButton.addEventListener(
        "click",
        function(){

            const settings =
            pageSettings[
                pageNumber - 1
            ];


            settings.rotation =
            (settings.rotation + 90)
            % 360;


            renderPage();

        });


        deleteButton.addEventListener(
        "click",
        function(){

            const settings =
            pageSettings[
                pageNumber - 1
            ];


            if(
                confirm(
                    "Delete Page " +
                    pageNumber +
                    "?"
                )
            ){

                settings.deleted =
                true;


                pageBox.classList.add(
                    "deleted"
                );

            }

        });

    });

}


downloadButton.addEventListener(
"click",
async function(){

    if(!originalPdfBytes){

        alert(
            "Please upload a PDF first."
        );

        return;
    }


    downloadButton.textContent =
    "⏳ Creating PDF...";


    try{


        const sourcePdf =
        await PDFLib.PDFDocument.load(
            originalPdfBytes
        );


        const newPdf =
        await PDFLib.PDFDocument.create();


        for(
            let i=0;
            i<sourcePdf.getPageCount();
            i++
        ){

            const settings =
            pageSettings[i];


            if(
                settings &&
                settings.deleted
            ){

                continue;

            }


            const sourcePage =
            sourcePdf.getPage(i);


            const copiedPages =
            await newPdf.copyPages(
                sourcePdf,
                [i]
            );


            const newPage =
            copiedPages[0];


            if(
                settings &&
                settings.rotation
            ){

                newPage.setRotation(
                    PDFLib.degrees(
                        settings.rotation
                    )
                );

            }


            newPdf.addPage(
                newPage
            );

        }


        if(
            newPdf.getPageCount() === 0
        ){

            alert(
                "You cannot delete all pages."
            );

            downloadButton.textContent =
            "💾 Download Edited PDF";

            return;

        }


        const pdfBytes =
        await newPdf.save();


        const blob =
        new Blob(
            [pdfBytes],
            {
                type:"application/pdf"
            }
        );


        const url =
        URL.createObjectURL(blob);


        const link =
        document.createElement("a");


        link.href =
        url;

        link.download =
        "edited-pdf.pdf";


        document.body.appendChild(
            link
        );


        link.click();


        document.body.removeChild(
            link
        );


        URL.revokeObjectURL(
            url
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Could not create edited PDF."
        );

    }


    downloadButton.textContent =
    "💾 Download Edited PDF";

});

</script>

</body>

</html>
