<header>

</header>

<div class="container">

    <div class="hero">

        <h1>Create PDF Forms Online</h1>

        <p>

    </div>


    <!-- UPLOAD -->

    <div class="card">

    <div class="card" id="editorCard" style="display:none;">

        <h2>2. Add Form Fields</h2>

        <div class="toolbar">

            </button>

        <!-- BOTTOM -->

                type="button"
                class="create-btn"
                id="createPdfBtn"
            >

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================
   VARIABLES
========================= */

let pdfBytes = null;
let pdfDocument = null;

let totalPages = 0;
let activePage = 1;

let selectedFieldType = "text";

let selectedField = null;

let fields = [];

let fieldCounter = 1;

let outputUrl = null;

let originalFileName = "document.pdf";

let isAddingField = false;


/* =========================
   ELEMENTS
========================= */

const pdfInput =
document.getElementById("pdfInput");

const fileName =
document.getElementById("fileName");

const editorCard =
document.getElementById("editorCard");

const previewArea =
document.getElementById("previewArea");

const pageInfo =
document.getElementById("pageInfo");

const prevPage =
document.getElementById("prevPage");

const nextPage =
document.getElementById("nextPage");

const fieldName =
document.getElementById("fieldName");

const fieldValue =
document.getElementById("fieldValue");

const applySettings =
document.getElementById("applySettings");

const status =
document.getElementById("status");

const textBtn =
document.getElementById("textBtn");

const checkboxBtn =
document.getElementById("checkboxBtn");

const radioBtn =
document.getElementById("radioBtn");

const dropdownBtn =
document.getElementById("dropdownBtn");

const duplicateBtn =
document.getElementById("duplicateBtn");

const deleteBtn =
document.getElementById("deleteBtn");

const clearSelectionBtn =
document.getElementById("clearSelectionBtn");

const createPdfBtn =
document.getElementById("createPdfBtn");

const resetBtn =
document.getElementById("resetBtn");

const result =
document.getElementById("result");


/* =========================
   FIELD TYPE BUTTONS
========================= */

function setFieldType(type){

    selectedFieldType = type;

    textBtn.classList.remove("active");
    checkboxBtn.classList.remove("active");
    radioBtn.classList.remove("active");
    dropdownBtn.classList.remove("active");

    if(type === "text"){
        textBtn.classList.add("active");
    }

    if(type === "checkbox"){
        checkboxBtn.classList.add("active");
    }

    if(type === "radio"){
        radioBtn.classList.add("active");
    }

    if(type === "dropdown"){
        dropdownBtn.classList.add("active");
    }

    isAddingField = true;

    status.textContent =
        "Now click anywhere on the PDF to add the " +
        type +
        " field.";

}


textBtn.addEventListener("click",function(){

    setFieldType("text");

});


checkboxBtn.addEventListener("click",function(){

    setFieldType("checkbox");

});


radioBtn.addEventListener("click",function(){

    setFieldType("radio");

});


dropdownBtn.addEventListener("click",function(){

    setFieldType("dropdown");

});


/* =========================
   UPLOAD PDF
========================= */

pdfInput.addEventListener("change",async function(){

    const file = this.files[0];

    if(!file){
        return;
    }

    try{

        originalFileName = file.name;

        fileName.textContent =
            "Selected: " + file.name;

        const arrayBuffer =
            await file.arrayBuffer();

        pdfBytes =
            new Uint8Array(arrayBuffer);

        pdfDocument =
            await pdfjsLib.getDocument({
                data:pdfBytes
            }).promise;

        totalPages =
            pdfDocument.numPages;

        activePage = 1;

        fields = [];

        selectedField = null;

        fieldCounter = 1;

        editorCard.style.display = "block";

        result.innerHTML = "";

        updatePageInfo();

        await renderPage();

        status.textContent =
            "PDF loaded. Select a field type and click on the PDF.";

    }
    catch(error){

        console.error(error);

        alert("Unable to open PDF.");

    }

});


/* =========================
   PAGE INFO
========================= */

function updatePageInfo(){

    pageInfo.textContent =
        "Page " +
        activePage +
        " / " +
        totalPages;

    prevPage.disabled =
        activePage <= 1;

    nextPage.disabled =
        activePage >= totalPages;

}


/* =========================
   PREVIOUS PAGE
========================= */

prevPage.addEventListener("click",async function(){

    if(activePage <= 1){
        return;
    }

    activePage--;

    selectedField = null;

    updatePageInfo();

    await renderPage();

});


/* =========================
   NEXT PAGE
========================= */

nextPage.addEventListener("click",async function(){

    if(activePage >= totalPages){
        return;
    }

    activePage++;

    selectedField = null;

    updatePageInfo();

    await renderPage();

});


/* =========================
   RENDER PAGE
========================= */

async function renderPage(){

    previewArea.innerHTML = "";

    const page =
        await pdfDocument.getPage(activePage);

    const viewport =
        page.getViewport({
            scale:1.5
        });

    const pageContainer =
        document.createElement("div");

    pageContainer.className =
        "page-container";

    pageContainer.style.width =
        viewport.width + "px";

    pageContainer.style.height =
        viewport.height + "px";

    pageContainer.dataset.page =
        activePage;

    const canvas =
        document.createElement("canvas");

    const context =
        canvas.getContext("2d");

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    pageContainer.appendChild(canvas);

    previewArea.appendChild(pageContainer);

    await page.render({
        canvasContext:context,
        viewport:viewport
    }).promise;


    /* CLICK TO ADD FIELD */

    pageContainer.addEventListener("click",function(event){

        if(!isAddingField){
            return;
        }

        if(
            event.target !== pageContainer &&
            event.target !== canvas
        ){
            return;
        }

        const rect =
            pageContainer.getBoundingClientRect();

        const x =
            event.clientX -
            rect.left;

        const y =
            event.clientY -
            rect.top;

        addField(
            selectedFieldType,
            x,
            y,
            pageContainer
        );

        isAddingField = false;

        status.textContent =
            "Field added. You can drag or resize it.";

    });


    /* RENDER EXISTING FIELDS */

    fields
        .filter(function(field){

            return field.page === activePage;

        })
        .forEach(function(field){

            createFieldElement(
                field,
                pageContainer
            );

        });

}


/* =========================
   UNIQUE NAME
========================= */

function getUniqueFieldName(baseName){

    let name =
        baseName ||
        ("field_" + fieldCounter);

    let original =
        name;

    let number = 1;

    while(
        fields.some(function(field){

            return field.name === name;

        })
    ){

        name =
            original +
            "_" +
            number;

        number++;

    }

    return name;

}


/* =========================
   ADD FIELD
========================= */

function addField(
    type,
    x,
    y,
    pageContainer
){

    let name =
        fieldName.value.trim();

    let value =
        fieldValue.value.trim();


    if(!name){

        name =
            "field_" +
            fieldCounter;

    }

    name =
        getUniqueFieldName(name);


    let width = 180;
    let height = 40;


    if(type === "checkbox"){

        width = 150;
        height = 35;

    }


    if(type === "radio"){

        width = 150;
        height = 35;

    }


    if(type === "dropdown"){

        width = 180;
        height = 40;

    }


    /* keep inside page */

    if(
        x + width >
        pageContainer.clientWidth
    ){

        x =
            pageContainer.clientWidth -
            width -
            10;

    }


    if(
        y + height >
        pageContainer.clientHeight
    ){

        y =
            pageContainer.clientHeight -
            height -
            10;

    }


    x = Math.max(0,x);

    y = Math.max(0,y);


    const field = {

        id:
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8),

        type:type,

        name:name,

        value:value,

        page:activePage,

        x:x,

        y:y,

        width:width,

        height:height,

        options:[
            "Option 1",
            "Option 2",
            "Option 3"
        ]

    };


    fields.push(field);

    fieldCounter++;

    selectedField = field;

    createFieldElement(
        field,
        pageContainer
    );

    fieldName.value =
        field.name;

    fieldValue.value =
        field.value;

}


/* =========================
   CREATE FIELD ELEMENT
========================= */

function createFieldElement(
    field,
    pageContainer
){

    const element =
        document.createElement("div");

    element.className =
        "form-field";

    element.dataset.id =
        field.id;

    element.style.left =
        field.x + "px";

    element.style.top =
        field.y + "px";

    element.style.width =
        field.width + "px";

    element.style.height =
        field.height + "px";


    /* TEXT */

    if(field.type === "text"){

        const value =
            document.createElement("div");

        value.className =
            "field-value";

        value.textContent =
            field.value || field.name;

        element.appendChild(value);

    }


    /* CHECKBOX */

    if(field.type === "checkbox"){

        const box =
            document.createElement("div");

        box.className =
            "checkbox-preview";

        const checkbox =
            document.createElement("div");

        checkbox.className =
            "checkbox-box";

        const checked =
            field.value.toLowerCase() === "true" ||
            field.value.toLowerCase() === "yes" ||
            field.value.toLowerCase() === "checked";

        if(checked){

            checkbox.classList.add("checked");

        }

        const label =
            document.createElement("span");

        label.textContent =
            field.name;

        box.appendChild(checkbox);

        box.appendChild(label);

        element.appendChild(box);

    }


    /* RADIO */

    if(field.type === "radio"){

        const box =
            document.createElement("div");

        box.className =
            "radio-preview";

        const circle =
            document.createElement("div");

        circle.className =
            "radio-circle";

        const label =
            document.createElement("span");

        label.textContent =
            field.name;

        box.appendChild(circle);

        box.appendChild(label);

        element.appendChild(box);

    }


    /* DROPDOWN */

    if(field.type === "dropdown"){

        const value =
            document.createElement("div");

        value.className =
            "field-value";

        value.textContent =
            field.value ||
            field.options[0];

        element.appendChild(value);

    }


    /* RESIZE */

    const resize =
        document.createElement("div");

    resize.className =
        "resize-handle";

    element.appendChild(resize);


    /* SELECT */

    element.addEventListener("mousedown",function(event){

        if(event.target === resize){
            return;
        }

        event.stopPropagation();

        selectField(field,element);

    });


    /* DRAG */

    element.addEventListener("mousedown",function(event){

        if(event.target === resize){
            return;
        }

        event.preventDefault();

        event.stopPropagation();

        selectField(field,element);

        const startX =
            event.clientX;

        const startY =
            event.clientY;

        const originalX =
            field.x;

        const originalY =
            field.y;


        function move(e){

            let newX =
                originalX +
                (e.clientX - startX);

            let newY =
                originalY +
                (e.clientY - startY);


            newX =
                Math.max(
                    0,
                    Math.min(
                        newX,
                        pageContainer.clientWidth -
                        field.width
                    )
                );


            newY =
                Math.max(
                    0,
                    Math.min(
                        newY,
                        pageContainer.clientHeight -
                        field.height
                    )
                );


            field.x =
                newX;

            field.y =
                newY;

            element.style.left =
                newX + "px";

            element.style.top =
                newY + "px";

        }


        function stop(){

            document.removeEventListener(
                "mousemove",
                move
            );

            document.removeEventListener(
                "mouseup",
                stop
            );

        }


        document.addEventListener(
            "mousemove",
            move
        );

        document.addEventListener(
            "mouseup",
            stop
        );

    });


    /* RESIZE */

    resize.addEventListener("mousedown",function(event){

        event.preventDefault();

        event.stopPropagation();

        selectField(field,element);

        const startX =
            event.clientX;

        const startY =
            event.clientY;

        const originalWidth =
            field.width;

        const originalHeight =
            field.height;


        function resizeMove(e){

            let newWidth =
                originalWidth +
                (e.clientX - startX);

            let newHeight =
                originalHeight +
                (e.clientY - startY);


            newWidth =
                Math.max(
                    50,
                    Math.min(
                        newWidth,
                        pageContainer.clientWidth -
                        field.x
                    )
                );


            newHeight =
                Math.max(
                    25,
                    Math.min(
                        newHeight,
                        pageContainer.clientHeight -
                        field.y
                    )
                );


            field.width =
                newWidth;

            field.height =
                newHeight;

            element.style.width =
                newWidth + "px";

            element.style.height =
                newHeight + "px";

        }


        function resizeStop(){

            document.removeEventListener(
                "mousemove",
                resizeMove
            );

            document.removeEventListener(
                "mouseup",
                resizeStop
            );

        }


        document.addEventListener(
            "mousemove",
            resizeMove
        );

        document.addEventListener(
            "mouseup",
            resizeStop
        );

    });


    pageContainer.appendChild(element);

}


/* =========================
   SELECT FIELD
========================= */

function selectField(field,element){

    document
        .querySelectorAll(".form-field")
        .forEach(function(item){

            item.classList.remove("selected");

        });

    element.classList.add("selected");

    selectedField =
        field;

    fieldName.value =
        field.name;

    fieldValue.value =
        field.value;

}


/* =========================
   APPLY SETTINGS
========================= */

applySettings.addEventListener("click",function(){

    if(!selectedField){

        alert(
            "Please select a field first."
        );

        return;

    }


    let newName =
        fieldName.value.trim();

    let newValue =
        fieldValue.value.trim();


    if(!newName){

        newName =
            selectedField.name;

    }


    /* Don't allow duplicate names */

    const duplicate =
        fields.some(function(field){

            return (
                field !== selectedField &&
                field.name === newName
            );

        });


    if(duplicate){

        newName =
            getUniqueFieldName(newName);

    }


    selectedField.name =
        newName;

    selectedField.value =
        newValue;


    renderPage();

});


/* =========================
   ENTER KEY
========================= */

[fieldName,fieldValue].forEach(function(input){

    input.addEventListener(
        "keydown",
        function(event){

            if(event.key === "Enter"){

                event.preventDefault();

                event.stopPropagation();

                applySettings.click();

            }

        }
    );

});


/* =========================
   DUPLICATE
========================= */

duplicateBtn.addEventListener("click",function(){

    if(!selectedField){

        alert(
            "Please select a field first."
        );

        return;

    }


    const copy =
        JSON.parse(
            JSON.stringify(selectedField)
        );


    copy.id =
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .substring(2,8);


    if(copy.type !== "radio"){

        copy.name =
            getUniqueFieldName(
                copy.name
            );

    }


    copy.x += 20;

    copy.y += 20;


    if(
        copy.x + copy.width >
        800
    ){

        copy.x = 20;

    }


    fields.push(copy);

    selectedField =
        copy;

    renderPage();

});


/* =========================
   DELETE
========================= */

deleteBtn.addEventListener("click",function(){

    if(!selectedField){

        alert(
            "Please select a field first."
        );

        return;

    }


    fields =
        fields.filter(function(field){

            return field.id !==
                selectedField.id;

        });


    selectedField =
        null;

    fieldName.value = "";

    fieldValue.value = "";

    renderPage();

});


/* =========================
   CLEAR SELECTION
========================= */

clearSelectionBtn.addEventListener(
    "click",
    function(){

        selectedField = null;

        fieldName.value = "";

        fieldValue.value = "";

        document
            .querySelectorAll(".form-field")
            .forEach(function(item){

                item.classList.remove(
                    "selected"
                );

            });

    }
);


/* =========================
   CREATE PDF
========================= */

createPdfBtn.addEventListener(
    "click",
    async function(){

        if(!pdfBytes){

            alert(
                "Please upload a PDF first."
            );

            return;

        }


        if(fields.length === 0){

            alert(
                "Please add at least one field."
            );

            return;

        }


        try{

            status.textContent =
                "Creating fillable PDF...";


            const {
                PDFDocument
            } = PDFLib;


            const pdfDoc =
                await PDFDocument.load(
                    pdfBytes
                );


            const form =
                pdfDoc.getForm();


            const pages =
                pdfDoc.getPages();


            /*
             * Important:
             * preview scale = 1.5
             *
             * PDF coordinates are converted
             * from preview coordinates.
             */

            const PREVIEW_SCALE = 1.5;


            const radioGroups = {};


            for(
                const field of fields
            ){

                const page =
                    pages[field.page - 1];


                if(!page){
                    continue;
                }


                const pageWidth =
                    page.getWidth();

                const pageHeight =
                    page.getHeight();


                const previewWidth =
                    pageWidth *
                    PREVIEW_SCALE;

                const previewHeight =
                    pageHeight *
                    PREVIEW_SCALE;


                const scaleX =
                    pageWidth /
                    previewWidth;


                const scaleY =
                    pageHeight /
                    previewHeight;


                const x =
                    field.x *
                    scaleX;


                const y =
                    pageHeight -
                    (
                        field.y +
                        field.height
                    ) *
                    scaleY;


                const width =
                    field.width *
                    scaleX;


                const height =
                    field.height *
                    scaleY;


                /* =====================
                   TEXT FIELD
                ===================== */

                if(field.type === "text"){

                    const textField =
                        form.createTextField(
                            field.name
                        );


                    if(field.value){

                        textField.setText(
                            field.value
                        );

                    }


                    /*
                     * IMPORTANT:
                     *
                     * borderWidth: 0
                     *
                     * This removes the visible
                     * field box/border from
                     * the downloaded PDF.
                     *
                     * The field remains fillable.
                     */

                    textField.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height,

                            borderWidth:0
                        }
                    );

                }


                /* =====================
                   CHECKBOX
                ===================== */

                else if(
                    field.type === "checkbox"
                ){

                    const checkbox =
                        form.createCheckBox(
                            field.name
                        );


                    checkbox.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height,

                            borderWidth:1
                        }
                    );


                    const checked =
                        field.value
                            .toLowerCase() ===
                            "true" ||

                        field.value
                            .toLowerCase() ===
                            "yes" ||

                        field.value
                            .toLowerCase() ===
                            "checked";


                    if(checked){

                        checkbox.check();

                    }

                }


                /* =====================
                   RADIO BUTTON
                ===================== */

                else if(
                    field.type === "radio"
                ){

                    const groupName =
                        field.name ||
                        "radio_group";


                    let radioGroup =
                        radioGroups[groupName];


                    if(!radioGroup){

                        radioGroup =
                            form.createRadioGroup(
                                groupName
                            );

                        radioGroups[groupName] =
                            radioGroup;

                    }


                    const optionValue =
                        field.value ||
                        "Option_" +
                        field.id;


                    radioGroup.addOptionToPage(
                        optionValue,
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height
                        }
                    );

                }


                /* =====================
                   DROPDOWN
                ===================== */

                else if(
                    field.type === "dropdown"
                ){

                    const dropdown =
                        form.createDropdown(
                            field.name
                        );


                    dropdown.setOptions(
                        field.options
                    );


                    let selected =
                        field.value;


                    if(
                        !field.options.includes(
                            selected
                        )
                    ){

                        selected =
                            field.options[0];

                    }


                    if(selected){

                        dropdown.select(
                            selected
                        );

                    }


                    dropdown.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height
                        }
                    );

                }

            }


            /*
             * Update appearance
             */

            form.updateFieldAppearances();


            const finalBytes =
                await pdfDoc.save();


            const blob =
                new Blob(
                    [finalBytes],
                    {
                        type:
                        "application/pdf"
                    }
                );


            if(outputUrl){

                URL.revokeObjectURL(
                    outputUrl
                );

            }


            outputUrl =
                URL.createObjectURL(
                    blob
                );


            let baseName =
                originalFileName
                    .replace(
                        /\.pdf$/i,
                        ""
                    );


            const downloadName =
                baseName +
                "-fillable.pdf";


            result.innerHTML =

                '<a class="download-btn" ' +
                'href="' +
                outputUrl +
                '" ' +
                'download="' +
                downloadName +
                '">' +
                'Download Fillable PDF' +
                '</a>';


            status.textContent =
                "Fillable PDF created successfully.";


        }
        catch(error){

            console.error(error);

            alert(
                "PDF creation failed.\n\n" +
                error.message
            );

            status.textContent =
                "PDF creation failed.";

        }

    }
);
