<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Forms Online - Free PDF Form Creator</title>

<meta name="description"
content="Create fillable PDF forms online. Add text fields, checkboxes, radio buttons and dropdown fields to PDF documents.">

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f6f7fb;
    color:#222;
}

header{
    background:#fff;
    border-bottom:1px solid #ddd;
    padding:15px 20px;
    position:sticky;
    top:0;
    z-index:1000;
}

.header-inner{
    max-width:1200px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    color:#e53232;
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
}

.home-btn{
    background:#e53232;
    color:#fff;
    text-decoration:none;
    padding:9px 18px;
    border-radius:7px;
    font-weight:bold;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 15px 60px;
}

.hero{
    text-align:center;
    margin-bottom:25px;
}

.hero h1{
    margin:0 0 10px;
    font-size:34px;
}

.hero p{
    margin:0;
    color:#666;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.07);
}

.card h2{
    margin-top:0;
}

.upload-area{
    border:2px dashed #e53232;
    border-radius:12px;
    padding:35px 20px;
    text-align:center;
    background:#fffafa;
}

.upload-area input{
    display:none;
}

.upload-btn{
    display:inline-block;
    background:#e53232;
    color:#fff;
    padding:12px 22px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.file-name{
    margin-top:12px;
    color:#555;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:15px;
}

.toolbar button{
    border:1px solid #ddd;
    background:#fff;
    padding:10px 14px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.toolbar button:hover{
    border-color:#e53232;
    color:#e53232;
}

.toolbar button.active{
    background:#e53232;
    color:#fff;
    border-color:#e53232;
}

.settings{
    display:grid;
    grid-template-columns:1fr 1fr auto;
    gap:10px;
    margin-bottom:12px;
}

.settings input{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:6px;
    outline:none;
}

.settings input:focus{
    border-color:#e53232;
}

.apply-btn{
    background:#e53232;
    color:#fff;
    border:0;
    padding:10px 20px;
    border-radius:6px;
    cursor:pointer;
    font-weight:bold;
}

.status{
    text-align:center;
    padding:8px;
    color:#555;
    font-size:14px;
    min-height:32px;
}

.page-navigation{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:15px 0;
}

.page-navigation button{
    background:#fff;
    border:1px solid #ddd;
    padding:8px 14px;
    border-radius:6px;
    cursor:pointer;
}

.page-navigation button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.page-info{
    font-weight:bold;
}

.preview-wrapper{
    background:#e9e9e9;
    border-radius:10px;
    padding:25px;
    overflow:auto;
    min-height:400px;
}

.page-container{
    position:relative;
    background:#fff;
    margin:0 auto 25px;
    box-shadow:0 2px 12px rgba(0,0,0,.2);
}

.page-container canvas{
    display:block;
}

.form-field{
    position:absolute;
    border:2px solid #e53232;
    background:rgba(255,255,255,.70);
    min-width:40px;
    min-height:25px;
    cursor:move;
    user-select:none;
    z-index:10;
}

.form-field.selected{
    border-color:#0066ff;
}

.field-value{
    position:absolute;
    left:5px;
    right:5px;
    top:2px;
    bottom:2px;
    display:flex;
    align-items:center;
    color:#222;
    font-size:13px;
    overflow:hidden;
    pointer-events:none;
}

.checkbox-preview,
.radio-preview{
    height:100%;
    display:flex;
    align-items:center;
    gap:7px;
    padding:2px 5px;
    pointer-events:none;
}

.checkbox-box{
    width:17px;
    height:17px;
    border:2px solid #222;
    background:#fff;
    flex:none;
}

.checkbox-box.checked{
    position:relative;
}

.checkbox-box.checked::after{
    content:"✓";
    position:absolute;
    left:1px;
    top:-6px;
    font-size:17px;
    font-weight:bold;
}

.radio-circle{
    width:17px;
    height:17px;
    border:2px solid #222;
    border-radius:50%;
    background:#fff;
    flex:none;
}

.resize-handle{
    position:absolute;
    width:10px;
    height:10px;
    right:-5px;
    bottom:-5px;
    background:#0066ff;
    border-radius:2px;
    cursor:nwse-resize;
}

.field-actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin-top:15px;
}

.field-actions button{
    background:#fff;
    border:1px solid #ddd;
    padding:9px 16px;
    border-radius:7px;
    cursor:pointer;
}

.field-actions button:hover{
    border-color:#e53232;
    color:#e53232;
}

.bottom-actions{
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:12px;
    margin-top:20px;
}

.create-btn{
    background:#e53232;
    color:#fff;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.reset-btn{
    background:#555;
    color:#fff;
    border:0;
    padding:12px 25px;
    border-radius:7px;
    cursor:pointer;
    font-weight:bold;
}

.result{
    text-align:center;
    margin-top:20px;
}

.download-btn{
    display:inline-block;
    background:#198754;
    color:#fff;
    text-decoration:none;
    padding:12px 25px;
    border-radius:7px;
    font-weight:bold;
}

.error-box{
    background:#fff0f0;
    border:1px solid #e53232;
    color:#b00000;
    padding:12px;
    border-radius:7px;
    margin-top:15px;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
}

@media(max-width:700px){

    .hero h1{
        font-size:27px;
    }

    .settings{
        grid-template-columns:1fr;
    }

    .preview-wrapper{
        padding:10px;
    }

    .toolbar button{
        flex:1;
    }

}

</style>
</head>

<body>

<header>

    <div class="header-inner">

        <a href="index.html" class="logo">
            PDF Editor Tools
        </a>

        <a href="index.html" class="home-btn">
            Home
        </a>

    </div>

</header>


<div class="container">

    <div class="hero">

        <h1>Create PDF Forms Online</h1>

        <p>
            Add fillable text fields, checkboxes, radio buttons and dropdowns to your PDF.
        </p>

    </div>


    <!-- UPLOAD -->

    <div class="card">

        <h2>1. Upload PDF</h2>

        <div class="upload-area">

            <label for="pdfInput" class="upload-btn">
                Choose PDF
            </label>

            <input
                type="file"
                id="pdfInput"
                accept="application/pdf"
            >

            <div id="fileName" class="file-name">
                No PDF selected
            </div>

        </div>

    </div>


    <!-- EDITOR -->

    <div
        class="card"
        id="editorCard"
        style="display:none;"
    >

        <h2>2. Add Form Fields</h2>


        <!-- FIELD BUTTONS -->

        <div class="toolbar">

            <button
                type="button"
                id="textBtn"
            >
                Text Field
            </button>

            <button
                type="button"
                id="checkboxBtn"
            >
                Checkbox
            </button>

            <button
                type="button"
                id="radioBtn"
            >
                Radio Button
            </button>

            <button
                type="button"
                id="dropdownBtn"
            >
                Dropdown
            </button>

        </div>


        <!-- SETTINGS -->

        <div class="settings">

            <input
                type="text"
                id="fieldName"
                placeholder="Field Name"
                autocomplete="off"
            >

            <input
                type="text"
                id="fieldValue"
                placeholder="Default Value"
                autocomplete="off"
            >

            <button
                type="button"
                id="applySettings"
                class="apply-btn"
            >
                Apply
            </button>

        </div>


        <div
            id="status"
            class="status"
        >
            Select a field type and click on the PDF.
        </div>


        <!-- PAGE NAVIGATION -->

        <div class="page-navigation">

            <button
                type="button"
                id="prevPage"
            >
                ← Previous
            </button>

            <span
                id="pageInfo"
                class="page-info"
            >
                Page 1 / 1
            </span>

            <button
                type="button"
                id="nextPage"
            >
                Next →
            </button>

        </div>


        <!-- PREVIEW -->

        <div
            id="previewArea"
            class="preview-wrapper"
        ></div>


        <!-- FIELD ACTIONS -->

        <div class="field-actions">

            <button
                type="button"
                id="duplicateBtn"
            >
                Duplicate
            </button>

            <button
                type="button"
                id="deleteBtn"
            >
                Delete
            </button>

            <button
                type="button"
                id="clearSelectionBtn"
            >
                Clear Selection
            </button>

        </div>


        <!-- BOTTOM ACTIONS -->

        <div class="bottom-actions">

            <button
                type="button"
                id="createPdfBtn"
                class="create-btn"
            >
                Create Fillable PDF
            </button>

            <button
                type="button"
                id="resetBtn"
                class="reset-btn"
            >
                Reset
            </button>

        </div>


        <div
            id="result"
            class="result"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   PDF.JS
===================================================== */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =====================================================
   VARIABLES
===================================================== */

let pdfBytes = null;
let pdfDocument = null;

let totalPages = 0;
let activePage = 1;

let selectedFieldType = "text";

let selectedField = null;

let fields = [];

let fieldCounter = 1;

let outputUrl = null;

let originalFileName = "document.pdf";

let isAddingField = false;


/* =====================================================
   ELEMENTS
===================================================== */

const pdfInput =
document.getElementById("pdfInput");

const fileName =
document.getElementById("fileName");

const editorCard =
document.getElementById("editorCard");

const previewArea =
document.getElementById("previewArea");

const pageInfo =
document.getElementById("pageInfo");

const prevPage =
document.getElementById("prevPage");

const nextPage =
document.getElementById("nextPage");

const fieldName =
document.getElementById("fieldName");

const fieldValue =
document.getElementById("fieldValue");

const applySettings =
document.getElementById("applySettings");

const status =
document.getElementById("status");

const textBtn =
document.getElementById("textBtn");

const checkboxBtn =
document.getElementById("checkboxBtn");

const radioBtn =
document.getElementById("radioBtn");

const dropdownBtn =
document.getElementById("dropdownBtn");

const duplicateBtn =
document.getElementById("duplicateBtn");

const deleteBtn =
document.getElementById("deleteBtn");

const clearSelectionBtn =
document.getElementById("clearSelectionBtn");

const createPdfBtn =
document.getElementById("createPdfBtn");

const resetBtn =
document.getElementById("resetBtn");

const result =
document.getElementById("result");


/* =====================================================
   FIELD TYPE
===================================================== */

function setFieldType(type){

    selectedFieldType = type;

    textBtn.classList.remove("active");
    checkboxBtn.classList.remove("active");
    radioBtn.classList.remove("active");
    dropdownBtn.classList.remove("active");

    if(type === "text"){
        textBtn.classList.add("active");
    }

    if(type === "checkbox"){
        checkboxBtn.classList.add("active");
    }

    if(type === "radio"){
        radioBtn.classList.add("active");
    }

    if(type === "dropdown"){
        dropdownBtn.classList.add("active");
    }

    isAddingField = true;

    status.textContent =
        "Click anywhere on the PDF to add the " +
        type +
        " field.";

}


textBtn.addEventListener(
    "click",
    function(){
        setFieldType("text");
    }
);


checkboxBtn.addEventListener(
    "click",
    function(){
        setFieldType("checkbox");
    }
);


radioBtn.addEventListener(
    "click",
    function(){
        setFieldType("radio");
    }
);


dropdownBtn.addEventListener(
    "click",
    function(){
        setFieldType("dropdown");
    }
);


/* =====================================================
   UPLOAD
===================================================== */

pdfInput.addEventListener(
    "change",
    async function(){

        const file =
            this.files[0];

        if(!file){
            return;
        }

        try{

            originalFileName =
                file.name;

            fileName.textContent =
                "Selected: " + file.name;

            const buffer =
                await file.arrayBuffer();

            pdfBytes =
                new Uint8Array(buffer);

            pdfDocument =
                await pdfjsLib
                    .getDocument({
                        data:pdfBytes
                    })
                    .promise;

            totalPages =
                pdfDocument.numPages;

            activePage = 1;

            fields = [];

            selectedField = null;

            fieldCounter = 1;

            editorCard.style.display =
                "block";

            result.innerHTML = "";

            updatePageInfo();

            await renderPage();

            status.textContent =
                "PDF loaded successfully.";

        }
        catch(error){

            console.error(error);

            alert(
                "PDF could not be opened:\n\n" +
                error.message
            );

        }

    }
);


/* =====================================================
   PAGE INFO
===================================================== */

function updatePageInfo(){

    pageInfo.textContent =
        "Page " +
        activePage +
        " / " +
        totalPages;

    prevPage.disabled =
        activePage <= 1;

    nextPage.disabled =
        activePage >= totalPages;

}


/* =====================================================
   PREVIOUS PAGE
===================================================== */

prevPage.addEventListener(
    "click",
    async function(){

        if(activePage <= 1){
            return;
        }

        activePage--;

        selectedField = null;

        updatePageInfo();

        await renderPage();

    }
);


/* =====================================================
   NEXT PAGE
===================================================== */

nextPage.addEventListener(
    "click",
    async function(){

        if(activePage >= totalPages){
            return;
        }

        activePage++;

        selectedField = null;

        updatePageInfo();

        await renderPage();

    }
);


/* =====================================================
   RENDER PAGE
===================================================== */

async function renderPage(){

    previewArea.innerHTML = "";

    const page =
        await pdfDocument.getPage(
            activePage
        );

    const SCALE = 1.5;

    const viewport =
        page.getViewport({
            scale:SCALE
        });

    const pageContainer =
        document.createElement("div");

    pageContainer.className =
        "page-container";

    pageContainer.style.width =
        viewport.width + "px";

    pageContainer.style.height =
        viewport.height + "px";

    pageContainer.dataset.page =
        activePage;


    const canvas =
        document.createElement("canvas");

    canvas.width =
        viewport.width;

    canvas.height =
        viewport.height;

    canvas.style.width =
        viewport.width + "px";

    canvas.style.height =
        viewport.height + "px";


    const context =
        canvas.getContext("2d");


    pageContainer.appendChild(
        canvas
    );

    previewArea.appendChild(
        pageContainer
    );


    await page.render({

        canvasContext:context,

        viewport:viewport

    }).promise;


    /*
     * ADD FIELD BY CLICK
     */

    pageContainer.addEventListener(
        "click",
        function(event){

            if(!isAddingField){
                return;
            }

            if(
                event.target !==
                pageContainer &&
                event.target !==
                canvas
            ){
                return;
            }


            const rect =
                pageContainer
                    .getBoundingClientRect();


            const x =
                event.clientX -
                rect.left;


            const y =
                event.clientY -
                rect.top;


            addField(
                selectedFieldType,
                x,
                y,
                pageContainer
            );


            isAddingField = false;

            status.textContent =
                "Field added successfully.";

        }
    );


    /*
     * RENDER EXISTING FIELDS
     */

    fields
        .filter(function(field){

            return field.page === activePage;

        })
        .forEach(function(field){

            createFieldElement(
                field,
                pageContainer
            );

        });

}


/* =====================================================
   UNIQUE FIELD NAME
===================================================== */

function getUniqueFieldName(
    baseName
){

    let cleanName =
        String(
            baseName || ""
        )
        .trim();


    if(!cleanName){

        cleanName =
            "field_" +
            fieldCounter;

    }


    /*
     * PDF field names should not
     * contain empty spaces only.
     */

    cleanName =
        cleanName
            .replace(/\s+/g,"_");


    let finalName =
        cleanName;

    let number = 1;


    while(
        fields.some(function(field){

            return field.name ===
                finalName;

        })
    ){

        finalName =
            cleanName +
            "_" +
            number;

        number++;

    }


    return finalName;

}


/* =====================================================
   ADD FIELD
===================================================== */

function addField(
    type,
    x,
    y,
    pageContainer
){

    let name =
        fieldName.value.trim();

    let value =
        fieldValue.value.trim();


    name =
        getUniqueFieldName(name);


    let width = 180;
    let height = 40;


    if(type === "checkbox"){

        width = 160;
        height = 38;

    }


    if(type === "radio"){

        width = 160;
        height = 38;

    }


    if(type === "dropdown"){

        width = 180;
        height = 40;

    }


    /*
     * Keep inside page
     */

    x =
        Math.max(
            0,
            Math.min(
                x,
                pageContainer.clientWidth -
                width -
                5
            )
        );


    y =
        Math.max(
            0,
            Math.min(
                y,
                pageContainer.clientHeight -
                height -
                5
            )
        );


    const field = {

        id:
            "field_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8),

        type:type,

        name:name,

        value:value,

        page:activePage,

        x:x,

        y:y,

        width:width,

        height:height,

        options:[
            "Option 1",
            "Option 2",
            "Option 3"
        ]

    };


    fields.push(field);

    fieldCounter++;

    selectedField =
        field;


    createFieldElement(
        field,
        pageContainer
    );


    fieldName.value =
        field.name;

    fieldValue.value =
        field.value;

}


/* =====================================================
   CREATE FIELD PREVIEW
===================================================== */

function createFieldElement(
    field,
    pageContainer
){

    const element =
        document.createElement("div");

    element.className =
        "form-field";

    element.dataset.id =
        field.id;


    element.style.left =
        field.x + "px";

    element.style.top =
        field.y + "px";

    element.style.width =
        field.width + "px";

    element.style.height =
        field.height + "px";


    /*
     * TEXT
     */

    if(field.type === "text"){

        const value =
            document.createElement("div");

        value.className =
            "field-value";

        value.textContent =
            field.value ||
            field.name;

        element.appendChild(
            value
        );

    }


    /*
     * CHECKBOX
     */

    if(field.type === "checkbox"){

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "checkbox-preview";


        const box =
            document.createElement("div");

        box.className =
            "checkbox-box";


        const currentValue =
            String(
                field.value || ""
            )
            .toLowerCase();


        if(
            currentValue === "true" ||
            currentValue === "yes" ||
            currentValue === "checked"
        ){

            box.classList.add(
                "checked"
            );

        }


        const label =
            document.createElement("span");

        label.textContent =
            field.name;


        wrapper.appendChild(box);

        wrapper.appendChild(label);

        element.appendChild(wrapper);

    }


    /*
     * RADIO
     */

    if(field.type === "radio"){

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "radio-preview";


        const circle =
            document.createElement("div");

        circle.className =
            "radio-circle";


        const label =
            document.createElement("span");

        label.textContent =
            field.name;


        wrapper.appendChild(circle);

        wrapper.appendChild(label);

        element.appendChild(wrapper);

    }


    /*
     * DROPDOWN
     */

    if(field.type === "dropdown"){

        const value =
            document.createElement("div");

        value.className =
            "field-value";

        value.textContent =
            field.value ||
            field.options[0];

        element.appendChild(
            value
        );

    }


    /*
     * RESIZE HANDLE
     */

    const resizeHandle =
        document.createElement("div");

    resizeHandle.className =
        "resize-handle";

    element.appendChild(
        resizeHandle
    );


    /*
     * SELECT
     */

    element.addEventListener(
        "mousedown",
        function(event){

            if(
                event.target ===
                resizeHandle
            ){
                return;
            }

            event.stopPropagation();

            selectField(
                field,
                element
            );

        }
    );


    /*
     * DRAG
     */

    element.addEventListener(
        "mousedown",
        function(event){

            if(
                event.target ===
                resizeHandle
            ){
                return;
            }

            event.preventDefault();

            event.stopPropagation();


            selectField(
                field,
                element
            );


            const startX =
                event.clientX;

            const startY =
                event.clientY;

            const originalX =
                field.x;

            const originalY =
                field.y;


            function move(e){

                let newX =
                    originalX +
                    (
                        e.clientX -
                        startX
                    );


                let newY =
                    originalY +
                    (
                        e.clientY -
                        startY
                    );


                newX =
                    Math.max(
                        0,
                        Math.min(
                            newX,
                            pageContainer.clientWidth -
                            field.width
                        )
                    );


                newY =
                    Math.max(
                        0,
                        Math.min(
                            newY,
                            pageContainer.clientHeight -
                            field.height
                        )
                    );


                field.x =
                    newX;

                field.y =
                    newY;


                element.style.left =
                    newX + "px";

                element.style.top =
                    newY + "px";

            }


            function stop(){

                document.removeEventListener(
                    "mousemove",
                    move
                );

                document.removeEventListener(
                    "mouseup",
                    stop
                );

            }


            document.addEventListener(
                "mousemove",
                move
            );

            document.addEventListener(
                "mouseup",
                stop
            );

        }
    );


    /*
     * RESIZE
     */

    resizeHandle.addEventListener(
        "mousedown",
        function(event){

            event.preventDefault();

            event.stopPropagation();


            selectField(
                field,
                element
            );


            const startX =
                event.clientX;

            const startY =
                event.clientY;

            const originalWidth =
                field.width;

            const originalHeight =
                field.height;


            function resizeMove(e){

                let newWidth =
                    originalWidth +
                    (
                        e.clientX -
                        startX
                    );


                let newHeight =
                    originalHeight +
                    (
                        e.clientY -
                        startY
                    );


                newWidth =
                    Math.max(
                        50,
                        Math.min(
                            newWidth,
                            pageContainer.clientWidth -
                            field.x
                        )
                    );


                newHeight =
                    Math.max(
                        25,
                        Math.min(
                            newHeight,
                            pageContainer.clientHeight -
                            field.y
                        )
                    );


                field.width =
                    newWidth;

                field.height =
                    newHeight;


                element.style.width =
                    newWidth + "px";

                element.style.height =
                    newHeight + "px";

            }


            function resizeStop(){

                document.removeEventListener(
                    "mousemove",
                    resizeMove
                );

                document.removeEventListener(
                    "mouseup",
                    resizeStop
                );

            }


            document.addEventListener(
                "mousemove",
                resizeMove
            );

            document.addEventListener(
                "mouseup",
                resizeStop
            );

        }
    );


    pageContainer.appendChild(
        element
    );

}


/* =====================================================
   SELECT FIELD
===================================================== */

function selectField(
    field,
    element
){

    document
        .querySelectorAll(".form-field")
        .forEach(function(item){

            item.classList.remove(
                "selected"
            );

        });


    element.classList.add(
        "selected"
    );


    selectedField =
        field;


    fieldName.value =
        field.name;

    fieldValue.value =
        field.value;

}


/* =====================================================
   APPLY SETTINGS
===================================================== */

applySettings.addEventListener(
    "click",
    function(){

        if(!selectedField){

            alert(
                "Please select a field first."
            );

            return;

        }


        let newName =
            fieldName.value.trim();

        let newValue =
            fieldValue.value.trim();


        if(!newName){

            newName =
                selectedField.name;

        }


        /*
         * Make name unique
         */

        let conflict =
            fields.some(function(field){

                return (
                    field !== selectedField &&
                    field.name === newName
                );

            });


        if(conflict){

            newName =
                getUniqueFieldName(
                    newName
                );

        }


        selectedField.name =
            newName;

        selectedField.value =
            newValue;


        renderPage();

    }
);


/* =====================================================
   ENTER KEY
===================================================== */

[fieldName,fieldValue].forEach(
    function(input){

        input.addEventListener(
            "keydown",
            function(event){

                if(
                    event.key ===
                    "Enter"
                ){

                    event.preventDefault();

                    event.stopPropagation();

                    applySettings.click();

                }

            }
        );

    }
);


/* =====================================================
   DUPLICATE
===================================================== */

duplicateBtn.addEventListener(
    "click",
    function(){

        if(!selectedField){

            alert(
                "Please select a field first."
            );

            return;

        }


        const copy =
            JSON.parse(
                JSON.stringify(
                    selectedField
                )
            );


        copy.id =
            "field_" +
            Date.now() +
            "_" +
            Math.random()
                .toString(36)
                .substring(2,8);


        copy.name =
            getUniqueFieldName(
                copy.name
            );


        copy.x += 20;

        copy.y += 20;


        fields.push(copy);

        selectedField =
            copy;


        renderPage();

    }
);


/* =====================================================
   DELETE
===================================================== */

deleteBtn.addEventListener(
    "click",
    function(){

        if(!selectedField){

            alert(
                "Please select a field first."
            );

            return;

        }


        fields =
            fields.filter(
                function(field){

                    return (
                        field.id !==
                        selectedField.id
                    );

                }
            );


        selectedField = null;

        fieldName.value = "";

        fieldValue.value = "";


        renderPage();

    }
);


/* =====================================================
   CLEAR SELECTION
===================================================== */

clearSelectionBtn.addEventListener(
    "click",
    function(){

        selectedField = null;

        fieldName.value = "";

        fieldValue.value = "";


        document
            .querySelectorAll(
                ".form-field"
            )
            .forEach(
                function(item){

                    item.classList.remove(
                        "selected"
                    );

                }
            );

    }
);


/* =====================================================
   CREATE FILLABLE PDF
===================================================== */

createPdfBtn.addEventListener(
    "click",
    async function(){

        if(!pdfBytes){

            alert(
                "Please upload a PDF first."
            );

            return;

        }


        if(fields.length === 0){

            alert(
                "Please add at least one field."
            );

            return;

        }


        try{

            createPdfBtn.disabled =
                true;

            status.textContent =
                "Creating fillable PDF...";


            /*
             * PDF-LIB
             */

            const PDFLibObject =
                PDFLib;


            const PDFDocument =
                PDFLibObject.PDFDocument;


            const pdfDoc =
                await PDFDocument.load(
                    pdfBytes
                );


            const form =
                pdfDoc.getForm();


            const pages =
                pdfDoc.getPages();


            /*
             * Existing field names
             */

            const existingNames =
                new Set();


            form.getFields()
                .forEach(
                    function(existingField){

                        try{

                            existingNames.add(
                                existingField.getName()
                            );

                        }
                        catch(e){

                            /* ignore */

                        }

                    }
                );


            /*
             * Preview scale
             */

            const PREVIEW_SCALE =
                1.5;


            /*
             * Keep track of names
             * created in this export.
             */

            const usedNames =
                new Set(
                    existingNames
                );


            /*
             * RADIO GROUPS
             */

            const radioGroups =
                {};


            /*
             * Process every field
             */

            for(
                let i = 0;
                i < fields.length;
                i++
            ){

                const field =
                    fields[i];


                const page =
                    pages[
                        field.page - 1
                    ];


                if(!page){

                    continue;

                }


                /*
                 * Generate a safe unique
                 * PDF field name.
                 */

                let pdfFieldName =
                    String(
                        field.name ||
                        "field_" +
                        (i + 1)
                    )
                    .trim()
                    .replace(
                        /\s+/g,
                        "_"
                    );


                if(!pdfFieldName){

                    pdfFieldName =
                        "field_" +
                        (i + 1);

                }


                const originalName =
                    pdfFieldName;


                let nameNumber = 1;


                while(
                    usedNames.has(
                        pdfFieldName
                    )
                ){

                    pdfFieldName =
                        originalName +
                        "_" +
                        nameNumber;

                    nameNumber++;

                }


                usedNames.add(
                    pdfFieldName
                );


                /*
                 * PDF dimensions
                 */

                const pageWidth =
                    page.getWidth();

                const pageHeight =
                    page.getHeight();


                /*
                 * Convert preview
                 * coordinates to PDF
                 * coordinates.
                 */

                const x =
                    field.x /
                    PREVIEW_SCALE;


                const y =
                    pageHeight -
                    (
                        field.y +
                        field.height
                    ) /
                    PREVIEW_SCALE;


                const width =
                    field.width /
                    PREVIEW_SCALE;


                const height =
                    field.height /
                    PREVIEW_SCALE;


                /* =================================
                   TEXT FIELD
                ================================= */

                if(
                    field.type ===
                    "text"
                ){

                    const textField =
                        form.createTextField(
                            pdfFieldName
                        );


                    /*
                     * Default value
                     */

                    if(
                        field.value &&
                        field.value.length > 0
                    ){

                        textField.setText(
                            String(
                                field.value
                            )
                        );

                    }


                    /*
                     * IMPORTANT
                     *
                     * borderWidth: 0
                     *
                     * The field remains
                     * fillable but the
                     * visible box is removed.
                     */

                    textField.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height,
                            borderWidth:0
                        }
                    );

                }


                /* =================================
                   CHECKBOX
                ================================= */

                else if(
                    field.type ===
                    "checkbox"
                ){

                    const checkbox =
                        form.createCheckBox(
                            pdfFieldName
                        );


                    checkbox.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height,
                            borderWidth:1
                        }
                    );


                    const checkboxValue =
                        String(
                            field.value ||
                            ""
                        )
                        .toLowerCase();


                    if(
                        checkboxValue ===
                        "true" ||

                        checkboxValue ===
                        "yes" ||

                        checkboxValue ===
                        "checked"
                    ){

                        checkbox.check();

                    }

                }


                /* =================================
                   RADIO BUTTON
                ================================= */

                else if(
                    field.type ===
                    "radio"
                ){

                    /*
                     * Every radio field
                     * gets its own unique
                     * group unless same
                     * name is intentionally
                     * used.
                     */

                    let group =
                        radioGroups[
                            pdfFieldName
                        ];


                    if(!group){

                        group =
                            form.createRadioGroup(
                                pdfFieldName
                            );

                        radioGroups[
                            pdfFieldName
                        ] = group;

                    }


                    const optionValue =
                        "option_" +
                        field.id;


                    group.addOptionToPage(
                        optionValue,
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height
                        }
                    );

                }


                /* =================================
                   DROPDOWN
                ================================= */

                else if(
                    field.type ===
                    "dropdown"
                ){

                    const dropdown =
                        form.createDropdown(
                            pdfFieldName
                        );


                    const options =
                        Array.isArray(
                            field.options
                        ) &&
                        field.options.length
                        ? field.options
                        : [
                            "Option 1",
                            "Option 2",
                            "Option 3"
                        ];


                    dropdown.setOptions(
                        options
                    );


                    let selectedValue =
                        field.value;


                    if(
                        !options.includes(
                            selectedValue
                        )
                    ){

                        selectedValue =
                            options[0];

                    }


                    if(selectedValue){

                        dropdown.select(
                            selectedValue
                        );

                    }


                    dropdown.addToPage(
                        page,
                        {
                            x:x,
                            y:y,
                            width:width,
                            height:height
                        }
                    );

                }

            }


            /*
             * Update all field appearances
             */

            form.updateFieldAppearances();


            /*
             * Save PDF
             */

            const finalBytes =
                await pdfDoc.save();


            /*
             * Create download URL
             */

            const blob =
                new Blob(
                    [finalBytes],
                    {
                        type:
                        "application/pdf"
                    }
                );


            if(outputUrl){

                URL.revokeObjectURL(
                    outputUrl
                );

            }


            outputUrl =
                URL.createObjectURL(
                    blob
                );


            /*
             * File name
             */

            let baseName =
                originalFileName
                    .replace(
                        /\.pdf$/i,
                        ""
                    );


            if(!baseName){

                baseName =
                    "document";

            }


            const downloadName =
                baseName +
                "-fillable.pdf";


            result.innerHTML =
                '<a ' +
                'class="download-btn" ' +
                'href="' +
                outputUrl +
                '" ' +
                'download="' +
                downloadName +
                '">' +
                'Download Fillable PDF' +
                '</a>';


            status.textContent =
                "Fillable PDF created successfully.";


        }
        catch(error){

            console.error(
                "PDF CREATION ERROR:",
                error
            );


            const message =
                error &&
                error.message
                ? error.message
                : String(error);


            result.innerHTML =
                '<div class="error-box">' +
                '<strong>PDF creation failed</strong>' +
                '\n\n' +
                message +
                '</div>';


            status.textContent =
                "PDF creation failed.";


        }
        finally{

            createPdfBtn.disabled =
                false;

        }

    }
);


/* =====================================================
   RESET
===================================================== */

resetBtn.addEventListener(
    "click",
    function(){

        if(outputUrl){

            URL.revokeObjectURL(
                outputUrl
            );

            outputUrl = null;

        }


        pdfBytes = null;

        pdfDocument = null;

        totalPages = 0;

        activePage = 1;

        selectedFieldType =
            "text";

        selectedField = null;

        fields = [];

        fieldCounter = 1;

        isAddingField = false;


        pdfInput.value = "";

        fileName.textContent =
            "No PDF selected";

        fieldName.value = "";

        fieldValue.value = "";

        previewArea.innerHTML = "";

        result.innerHTML = "";

        editorCard.style.display =
            "none";


        status.textContent =
            "Select a field type and click on the PDF.";


        textBtn.classList.remove(
            "active"
        );

        checkboxBtn.classList.remove(
            "active"
        );

        radioBtn.classList.remove(
            "active"
        );

        dropdownBtn.classList.remove(
            "active"
        );


        pageInfo.textContent =
            "Page 1 / 1";

    }
);

</script>
