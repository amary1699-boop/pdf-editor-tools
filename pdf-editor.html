<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free PDF Editor - Edit PDF Online</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#222;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header-inner{
  max-width:1180px;
  margin:auto;
  min-height:68px;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:20px;
  font-weight:700;
  color:#222;
  text-decoration:none;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  background:#e53232;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
  font-weight:800;
}

.home-btn{
  text-decoration:none;
  color:#333;
  font-weight:600;
  padding:9px 14px;
  border-radius:8px;
  border:1px solid #ddd;
  background:#fff;
}

.home-btn:hover{
  background:#f5f5f5;
}

/* ================= HERO ================= */

.hero{
  max-width:1180px;
  margin:20px auto 0;
  padding:25px 20px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff,#fff5f5);
  border:1px solid #f0dddd;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#666;
}

/* ================= TOOLBAR ================= */

.editor-wrapper{
  max-width:1180px;
  margin:18px auto 50px;
  padding:0 15px;
}

.toolbar{
  position:sticky;
  top:68px;
  z-index:900;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.tool-btn{
  border:1px solid #ddd;
  background:#fff;
  color:#222;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.tool-btn:hover{
  background:#f5f5f5;
}

.tool-btn.primary{
  background:#e53232;
  border-color:#e53232;
  color:#fff;
}

.tool-btn.primary:hover{
  background:#c92727;
}

.tool-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.file-area{
  background:#fff;
  border:2px dashed #ddd;
  border-radius:14px;
  padding:25px;
  text-align:center;
  margin-bottom:18px;
}

.file-area.drag{
  border-color:#e53232;
  background:#fff7f7;
}

.file-label{
  display:inline-block;
  background:#e53232;
  color:#fff;
  padding:11px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

#pdfFile{
  display:none;
}

.file-name{
  margin-top:10px;
  color:#666;
  font-size:14px;
}

/* ================= PDF AREA ================= */

.pdf-container{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:25px;
}

.pdf-page{
  position:relative;
  width:100%;
  max-width:850px;
  background:#fff;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
  overflow:hidden;
}

.pdf-canvas{
  display:block;
  width:100%;
  height:auto;
}

.existing-layer,
.object-layer{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.existing-layer{
  pointer-events:none;
}

.existing-text{
  position:absolute;
  margin:0;
  padding:0;
  white-space:pre;
  overflow:hidden;
  color:transparent;
  background:transparent;
  cursor:text;
  pointer-events:auto;
  line-height:1;
  user-select:none;
}

.existing-text:hover{
  background:rgba(229,50,50,.10);
  outline:1px solid rgba(229,50,50,.35);
}

.existing-text.selected{
  background:rgba(229,50,50,.14);
  outline:2px solid #e53232;
}

.object-layer{
  pointer-events:none;
}

.editor-object{
  position:absolute;
  pointer-events:auto;
  user-select:none;
  cursor:move;
}

.text-object{
  min-width:30px;
  min-height:20px;
  padding:2px 4px;
  white-space:pre;
  background:rgba(255,255,255,.01);
}

.text-object.selected,
.image-object.selected,
.qr-object.selected{
  outline:2px solid #e53232;
}

.image-object img,
.qr-object img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}

.resize-handle{
  position:absolute;
  width:12px;
  height:12px;
  right:-6px;
  bottom:-6px;
  background:#e53232;
  border:2px solid #fff;
  border-radius:50%;
  cursor:nwse-resize;
}

.page-number{
  position:absolute;
  bottom:5px;
  left:8px;
  font-size:11px;
  color:#777;
  pointer-events:none;
}

/* ================= EMPTY ================= */

.empty-message{
  width:100%;
  max-width:850px;
  min-height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  color:#777;
  padding:30px;
}

/* ================= STATUS ================= */

.status{
  margin:12px 0;
  text-align:center;
  color:#666;
  font-size:14px;
  min-height:20px;
}

/* ================= MODAL ================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-box h3{
  margin-top:0;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.cancel-btn{
  background:#eee;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.ok-btn{
  background:#e53232;
  color:#fff;
  border:0;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;

/* ================= MOBILE ================= */

@media(max-width:900px){

  .hero{

  .hero h1{

  }

@media(max-width:600px){

    min-height:60px;

  }

  .logo{

  .logo-icon{
    width:32px;

  }

  .home-btn{

  }

  .hero{
    padding:18px 15px;

  }

  .hero h1{
    font-size:21px;
  }

  .hero p{
    font-size:13px;
  }

  .editor-wrapper{
    padding:0 8px;
  }

  .toolbar{
    top:58px;
    padding:8px;
    gap:6px;
  }

  .tool-btn{
    padding:8px 9px;
    font-size:12px;
  }

  .file-area{
    padding:20px 12px;
  }

}

/* ================= PRINT ================= */

@media print{

  .header,
  .hero,
  .toolbar,
  .file-area,
  .status{
    display:none!important;
  }

}

</style>

<!-- ================= JAVASCRIPT ================= -->

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const {
  PDFDocument,
  rgb,
  StandardFonts
} = PDFLib;


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let pdfBytes = null;
let pdfDocument = null;

let currentFile = null;

let pages = [];

let existingTexts = [];

let addedObjects = [];

let selectedObject = null;

let history = [];
let historyIndex = -1;

let objectCounter = 1;

let pendingTextMode = false;
let pendingQRMode = false;

let replaceImageMode = false;
let replaceQRMode = false;

const BASE_SCALE = 2;


/* =========================================================
   ELEMENTS
========================================================= */

const pdfFile =
document.getElementById("pdfFile");

const dropArea =
document.getElementById("dropArea");

const fileName =
document.getElementById("fileName");

const pdfContainer =
document.getElementById("pdfContainer");

const status =
document.getElementById("status");

const textModal =
document.getElementById("textModal");

const qrModal =
document.getElementById("qrModal");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

  status.textContent = message;

}


/* =========================================================
   FILE SELECT
========================================================= */

pdfFile.addEventListener("change",function(e){

  const file = e.target.files[0];

  if(file){
    loadPDF(file);
  }

});


/* =========================================================
   DRAG PDF
========================================================= */

dropArea.addEventListener("dragover",function(e){

  e.preventDefault();

  dropArea.classList.add("drag");

});


dropArea.addEventListener("dragleave",function(){

  dropArea.classList.remove("drag");

});


dropArea.addEventListener("drop",function(e){

  e.preventDefault();

  dropArea.classList.remove("drag");

  const file = e.dataTransfer.files[0];

  if(
    file &&
    file.type === "application/pdf"
  ){
    loadPDF(file);
  }

});


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(file){

  try{

    setStatus("Loading PDF...");

    currentFile = file;

    fileName.textContent =
      file.name;

    pdfBytes =
      await file.arrayBuffer();

    pdfDocument =
      await pdfjsLib.getDocument({
        data:pdfBytes
      }).promise;

    pages = [];

    existingTexts = [];

    addedObjects = [];

    selectedObject = null;

    history = [];

    historyIndex = -1;

    pdfContainer.innerHTML = "";

    for(
      let pageNumber = 1;
      pageNumber <= pdfDocument.numPages;
      pageNumber++
    ){

      await renderPage(pageNumber);

    }

    saveHistory();

    setStatus(
      pdfDocument.numPages +
      " page(s) loaded."
    );

  }
  catch(error){

    console.error(error);

    setStatus(
      "Unable to load PDF."
    );

    alert(
      "PDF load nahi ho saka. Please valid PDF file select karein."
    );

  }

}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(pageNumber){

  const page =
    await pdfDocument.getPage(
      pageNumber
    );

  /*
    IMPORTANT:
    PDF ka actual size scale=1 se milega.
    Isko hi page dimensions ke liye use karenge.
  */

  const baseViewport =
    page.getViewport({
      scale:1
    });

  /*
    Preview ke liye high quality scale.
  */

  const viewport =
    page.getViewport({
      scale:BASE_SCALE
    });


  const pageDiv =
    document.createElement("div");

  pageDiv.className =
    "pdf-page";

  pageDiv.dataset.page =
    pageNumber;

  /*
    REAL PDF DIMENSIONS
  */

  pageDiv.dataset.pdfWidth =
    baseViewport.width;

  pageDiv.dataset.pdfHeight =
    baseViewport.height;

  pageDiv.style.aspectRatio =
    baseViewport.width +
    "/" +
    baseViewport.height;


  const canvas =
    document.createElement("canvas");

  canvas.className =
    "pdf-canvas";

  const context =
    canvas.getContext("2d");


  const outputScale =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    Math.floor(
      viewport.width *
      outputScale
    );

  canvas.height =
    Math.floor(
      viewport.height *
      outputScale
    );


  pageDiv.appendChild(canvas);


  const pageNumberEl =
    document.createElement("div");

  pageNumberEl.className =
    "page-number";

  pageNumberEl.textContent =
    "Page " + pageNumber;

  pageDiv.appendChild(
    pageNumberEl
  );


  const existingLayer =
    document.createElement("div");

  existingLayer.className =
    "existing-layer";

  pageDiv.appendChild(
    existingLayer
  );


  const objectLayer =
    document.createElement("div");

  objectLayer.className =
    "object-layer";

  pageDiv.appendChild(
    objectLayer
  );


  pdfContainer.appendChild(
    pageDiv
  );


  await page.render({

    canvasContext:
      context,

    viewport:
      viewport,

    transform:
      outputScale !== 1
        ? [
            outputScale,
            0,
            0,
            outputScale,
            0,
            0
          ]
        : null

  }).promise;


  await extractExistingText(
    page,
    pageDiv,
    existingLayer,
    viewport,
    pageNumber
  );


  renderObjectsForPage(
    pageDiv,
    objectLayer,
    pageNumber
  );

}


/* =========================================================
   EXISTING PDF TEXT
========================================================= */

async function extractExistingText(
  page,
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  const textContent =
    await page.getTextContent();


  /*
    Display scale:
    viewport = BASE_SCALE
    pageDiv = actual screen width
  */

  const cssScale =
    pageDiv.clientWidth /
    viewport.width;


  textContent.items.forEach(
    function(item,index){

      if(!item.str){
        return;
      }


      const transform =
        pdfjsLib.Util.transform(
          viewport.transform,
          item.transform
        );


      const fontHeight =
        Math.sqrt(
          transform[2] *
          transform[2] +
          transform[3] *
          transform[3]
        );


      /*
        Save original PDF text information.
      */

      const textObject = {

        id:
          "existing_" +
          pageNumber +
          "_" +
          index,

        page:
          pageNumber,

        text:
          item.str,

        originalText:
          item.str,

        x:
          item.transform[4],

        y:
          item.transform[5],

        width:
          item.width,

        height:
          fontHeight /
          BASE_SCALE,

        fontSize:
          fontHeight /
          BASE_SCALE,

        deleted:false,

        edited:false

      };


      existingTexts.push(
        textObject
      );


      /*
        Existing text overlay.
        IMPORTANT:
        Coordinates are converted to CSS
        exactly ONCE.
      */

      const span =
        document.createElement("div");

      span.className =
        "existing-text";

      span.dataset.existingId =
        textObject.id;

      span.textContent =
        textObject.text;


      span.style.left =
        (
          transform[4] *
          cssScale
        ) + "px";


      span.style.top =
        (
          (transform[5] -
          fontHeight) *
          cssScale
        ) + "px";


      span.style.width =
        Math.max(
          4,
          item.width *
          BASE_SCALE *
          cssScale
        ) + "px";


      span.style.height =
        Math.max(
          8,
          fontHeight *
          1.3 *
          cssScale
        ) + "px";


      span.style.fontSize =
        Math.max(
          6,
          fontHeight *
          cssScale
        ) + "px";


      /*
        VERY IMPORTANT:
        No second transform scale.
      */

      span.style.transform =
        "none";


      span.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          selectExistingText(
            textObject
          );

        }
      );


      span.addEventListener(
        "dblclick",
        function(e){

          e.stopPropagation();

          editExistingText(
            textObject
          );

        }
      );


      layer.appendChild(span);

    }
  );

}


/* =========================================================
   SELECT EXISTING TEXT
========================================================= */

function selectExistingText(obj){

  selectedObject = {

    type:
      "existingText",

    id:
      obj.id

  };


  refreshSelection();

}


/* =========================================================
   EDIT EXISTING TEXT
========================================================= */

function editExistingText(obj){

  const newText =
    prompt(
      "Edit text:",
      obj.text
    );


  if(newText === null){
    return;
  }


  if(newText === ""){

    if(
      confirm(
        "Text delete karna hai?"
      )
    ){

      obj.deleted = true;

      obj.edited = true;

      refreshPageLayers();

      saveHistory();

    }

    return;

  }


  obj.text =
    newText;

  obj.edited =
    true;

  refreshPageLayers();

  saveHistory();

}


/* =========================================================
   REFRESH PAGE LAYERS
========================================================= */

async function refreshPageLayers(){

  if(!pdfDocument){
    return;
  }


  document
    .querySelectorAll(".existing-layer")
    .forEach(
      layer => layer.innerHTML = ""
    );


  document
    .querySelectorAll(".object-layer")
    .forEach(
      layer => layer.innerHTML = ""
    );


  /*
    Existing text ko dobara draw karna.
  */

  for(
    const pageDiv of
    document.querySelectorAll(".pdf-page")
  ){

    const pageNumber =
      Number(
        pageDiv.dataset.page
      );


    const existingLayer =
      pageDiv.querySelector(
        ".existing-layer"
      );


    const objectLayer =
      pageDiv.querySelector(
        ".object-layer"
      );


    const page =
      await pdfDocument.getPage(
        pageNumber
      );


    const viewport =
      page.getViewport({
        scale:BASE_SCALE
      });


    renderExistingTextsOnly(
      pageDiv,
      existingLayer,
      viewport,
      pageNumber
    );


    renderObjectsForPage(
      pageDiv,
      objectLayer,
      pageNumber
    );

  }


  refreshSelection();

}


/* =========================================================
   RENDER EXISTING TEXTS
========================================================= */

function renderExistingTextsOnly(
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  const cssScale =
    pageDiv.clientWidth /
    viewport.width;


  existingTexts
    .filter(
      item =>
        item.page === pageNumber &&
        !item.deleted
    )
    .forEach(
      function(item){

        /*
          Approximate transform based on
          original PDF text coordinates.
        */

        const x =
          item.x *
          BASE_SCALE *
          cssScale;


        const fontSize =
          item.fontSize *
          BASE_SCALE *
          cssScale;


        /*
          PDF Y coordinate bottom-up.
          PDF.js preview is top-down.
        */

        const pageHeight =
          viewport.height;


        const y =
          pageHeight -
          (
            item.y *
            BASE_SCALE
          ) -
          fontSize;


        const span =
          document.createElement(
            "div"
          );


        span.className =
          "existing-text";


        span.dataset.existingId =
          item.id;


        span.textContent =
          item.text;


        span.style.left =
          x + "px";


        span.style.top =
          (
            y *
            cssScale
          ) + "px";


        span.style.width =
          Math.max(
            4,
            item.width *
            BASE_SCALE *
            cssScale
          ) + "px";


        span.style.height =
          Math.max(
            8,
            fontSize *
            1.3
          ) + "px";


        span.style.fontSize =
          Math.max(
            6,
            fontSize
          ) + "px";


        span.style.transform =
          "none";


        span.addEventListener(
          "click",
          function(e){

            e.stopPropagation();

            selectExistingText(
              item
            );

          }
        );


        span.addEventListener(
          "dblclick",
          function(e){

            e.stopPropagation();

            editExistingText(
              item
            );

          }
        );


        layer.appendChild(
          span
        );

      }
    );

}

/* =========================================================
   RENDER SINGLE OBJECT
========================================================= */

function renderSingleObject(
  obj,
  pageDiv,
  layer
){

  const width =
    pageDiv.clientWidth;


  const height =
    pageDiv.clientHeight;


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "editor-object";


  element.dataset.id =
    obj.id;


  element.style.left =
    (
      obj.xRatio *
      width
    ) + "px";


  element.style.top =
    (
      obj.yRatio *
      height
    ) + "px";


  element.style.width =
    (
      obj.widthRatio *
      width
    ) + "px";


  element.style.height =
    (
      obj.heightRatio *
      height
    ) + "px";


  if(obj.type === "text"){

    element.classList.add(
      "text-object"
    );


    element.textContent =
      obj.text;


    element.style.fontSize =
      (
        obj.fontSize *
        (
          width /
          Number(
            pageDiv.dataset.pdfWidth
          )
        )
      ) + "px";


    element.style.fontFamily =
      getCssFont(
        obj.fontFamily
      );

    element.style.color =
      "#000";

    element.style.fontWeight =
      "normal";

  }


  if(
    obj.type === "image" ||
    obj.type === "qr"
  ){

    element.classList.add(
      obj.type ===
      "image"
        ? "image-object"
        : "qr-object"
    );


    const img =
      document.createElement(
        "img"
      );


    img.src =
      obj.src;


    element.appendChild(
      img
    );

  }


  const handle =
    document.createElement(
      "div"
    );

  handle.className =
    "resize-handle";

  element.appendChild(
    handle
  );


  layer.appendChild(
    element
  );


  enableDrag(
    element,
    obj,
    pageDiv
  );


  enableResize(
    handle,
    element,
    obj,
    pageDiv
  );


  element.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      selectObject(obj);

    }
  );

}


/* =========================================================
   FONT
========================================================= */

function getCssFont(font){

  if(font === "Times-Roman"){
    return "Times New Roman";
  }

  if(font === "Courier"){
    return "Courier New";
  }

  return "Arial";

}

/* =========================================================
   REFRESH SELECTION
========================================================= */

function refreshSelection(){

  document
    .querySelectorAll(
      ".editor-object"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  document
    .querySelectorAll(
      ".existing-text"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  if(!selectedObject){
    return;
  }


  if(
    selectedObject.type ===
    "existingText"
  ){

    const el =
      document.querySelector(
        '[data-existing-id="' +
        selectedObject.id +
        '"]'
      );


    if(el){

      el.classList.add(
        "selected"
      );

    }

    return;

  }


  const el =
    document.querySelector(
      '[data-id="' +
      selectedObject.id +
      '"]'
    );


  if(el){

    el.classList.add(
      "selected"
    );

  }

}


/* =========================================================
   DRAG
========================================================= */

function enableDrag(
  element,
  obj,
  pageDiv
){

  let dragging = false;

  let startX = 0;
  let startY = 0;

  let originalX = 0;
  let originalY = 0;


  element.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "resize-handle"
        )
      ){
        return;
      }


      e.preventDefault();

      dragging = true;

      startX =
        e.clientX;

      startY =
        e.clientY;

      originalX =
        obj.xRatio;

      originalY =
        obj.yRatio;


      element.setPointerCapture(
        e.pointerId
      );

    }
  );


  element.addEventListener(
    "pointermove",
    function(e){

      if(!dragging){
        return;
      }


      const dx =
        e.clientX -
        startX;


      const dy =
        e.clientY -
        startY;


      obj.xRatio =
        originalX +
        dx /
        pageDiv.clientWidth;


      obj.yRatio =
        originalY +
        dy /
        pageDiv.clientHeight;


      obj.xRatio =
        Math.max(
          0,
          Math.min(
            1 -
            obj.widthRatio,
            obj.xRatio
          )
        );


      obj.yRatio =
        Math.max(
          0,
          Math.min(
            1 -
            obj.heightRatio,
            obj.yRatio
          )
        );


      element.style.left =
        (
          obj.xRatio *
          pageDiv.clientWidth
        ) + "px";


      element.style.top =
        (
          obj.yRatio *
          pageDiv.clientHeight
        ) + "px";

    }
  );


  element.addEventListener(
    "pointerup",
    function(){

      if(dragging){

        dragging = false;

        saveHistory();

      }

    }
  );

}


/* =========================================================
   RESIZE
========================================================= */

function enableResize(
  handle,
  element,
  obj,
  pageDiv
){

  let resizing = false;

  let startX = 0;
  let startY = 0;

  let originalWidth = 0;
  let originalHeight = 0;


  handle.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      resizing = true;

      startX =
        e.clientX;

      startY =
        e.clientY;

      originalWidth =
        obj.widthRatio;

      originalHeight =
        obj.heightRatio;


      handle.setPointerCapture(
        e.pointerId
      );

    }
  );


  handle.addEventListener(
    "pointermove",
    function(e){

      if(!resizing){
        return;
      }


      const dx =
        e.clientX -
        startX;


      const dy =
        e.clientY -
        startY;


      obj.widthRatio =
        Math.max(
          .02,
          originalWidth +
          dx /
          pageDiv.clientWidth
        );


      obj.heightRatio =
        Math.max(
          .02,
          originalHeight +
          dy /
          pageDiv.clientHeight
        );


      obj.widthRatio =
        Math.min(
          obj.widthRatio,
          1 -
          obj.xRatio
        );


      obj.heightRatio =
        Math.min(
          obj.heightRatio,
          1 -
          obj.yRatio
        );


      element.style.width =
        (
          obj.widthRatio *
          pageDiv.clientWidth
        ) + "px";


      element.style.height =
        (
          obj.heightRatio *
          pageDiv.clientHeight
        ) + "px";

    }
  );


  handle.addEventListener(
    "pointerup",
    function(){

      if(resizing){

        resizing = false;

        saveHistory();

      }

    }
  );

}

/* =========================================================
   HISTORY
========================================================= */

function createState(){

  return JSON.stringify({

    existingTexts:
      existingTexts,

    addedObjects:
      addedObjects

  });

}


function restoreState(state){

  const data =
    JSON.parse(state);


  existingTexts =
    data.existingTexts || [];


  addedObjects =
    data.addedObjects || [];


  selectedObject =
    null;


  refreshPageLayers();

}


function saveHistory(){

  const state =
    createState();


  history =
    history.slice(
      0,
      historyIndex + 1
    );


  history.push(
    state
  );


  historyIndex =
    history.length - 1;


  if(history.length > 30){

    history.shift();

    historyIndex--;

  }

}


document
.getElementById("undoBtn")
.addEventListener(
  "click",
  function(){

    if(
      historyIndex <= 0
    ){
      return;
    }


    historyIndex--;

    restoreState(
      history[historyIndex]
    );

  }
);


document
.getElementById("redoBtn")
.addEventListener(
  "click",
  function(){

    if(
      historyIndex >=
      history.length - 1
    ){
      return;
    }


    historyIndex++;

    restoreState(
      history[historyIndex]
    );

  }
);


/* =========================================================
   DOWNLOAD PDF
========================================================= */

document
.getElementById("downloadBtn")
.addEventListener(
  "click",
  async function(){

    if(!pdfBytes){

      alert(
        "Pehle PDF upload karein."
      );

      return;

    }


    try{

      setStatus(
        "Creating PDF..."
      );


      const pdfDoc =
        await PDFDocument.load(
          pdfBytes
        );


      const pages =
        pdfDoc.getPages();


      /*
        Existing text edits
      */

      for(
        const item of
        existingTexts
      ){

        if(
          !item.edited
        ){
          continue;
        }


        const page =
          pages[
            item.page - 1
          ];


        if(!page){
          continue;
        }


        const pageWidth =
          page.getWidth();


        const pageHeight =
          page.getHeight();


        const x =
          item.x;


        const fontSize =
          item.fontSize;


        const coverWidth =
          Math.max(
            item.width,
            item.text.length *
            fontSize *
            .45
          );


        const coverHeight =
          fontSize *
          1.35;


        /*
          White cover.
        */

        page.drawRectangle({

          x:
            x,

          y:
            pageHeight -
            item.y -
            coverHeight,

          width:
            coverWidth,

          height:
            coverHeight,

          color:
            rgb(
              1,
              1,
              1
            )

        });


        /*
          Deleted text:
          only cover remains.
        */

        if(
          item.deleted
        ){
          continue;
        }


        let font;


        if(
          item.fontFamily ===
          "Times-Roman"
        ){

          font =
            await pdfDoc.embedFont(
              StandardFonts.TimesRoman
            );

        }
        else if(
          item.fontFamily ===
          "Courier"
        ){

          font =
            await pdfDoc.embedFont(
              StandardFonts.Courier
            );

        }
        else{

          font =
            await pdfDoc.embedFont(
              StandardFonts.Helvetica
            );

        }


        page.drawText(
          item.text,
          {

            x:
              x,

            y:
              pageHeight -
              item.y -
              fontSize,

            size:
              fontSize,

            font:
              font,

            color:
              rgb(
                0,
                0,
                0
              )

          }
        );

      }


      /*
        Added objects
      */

      for(
        const obj of
        addedObjects
      ){

        const page =
          pages[
            obj.page - 1
          ];


        if(!page){
          continue;
        }


        const pageWidth =
          page.getWidth();


        const pageHeight =
          page.getHeight();


        const x =
          obj.xRatio *
          pageWidth;


        const width =
          obj.widthRatio *
          pageWidth;


        const height =
          obj.heightRatio *
          pageHeight;


        /*
          Convert top-left
          coordinate to PDF
          bottom-left coordinate.
        */

        const y =
          pageHeight -
          (
            obj.yRatio *
            pageHeight
          ) -
          height;


        if(
          obj.type ===
          "text"
        ){

          let font;


          if(
            obj.fontFamily ===
            "Times-Roman"
          ){

            font =
              await pdfDoc.embedFont(
                StandardFonts.TimesRoman
              );

          }
          else if(
            obj.fontFamily ===
            "Courier"
          ){

            font =
              await pdfDoc.embedFont(
                StandardFonts.Courier
              );

          }
          else{

            font =
              await pdfDoc.embedFont(
                StandardFonts.Helvetica
              );

          }


          page.drawText(
            obj.text,
            {

              x:
                x,

              y:
                y +
                height -
                obj.fontSize,

              size:
                obj.fontSize,

              font:
                font,

              color:
                rgb(
                  0,
                  0,
                  0
                )

            }
          );

        }


        if(
          obj.type ===
          "image" ||
          obj.type ===
          "qr"
        ){

          const imageBytes =
            dataURLToUint8Array(
              obj.src
            );


          let image;


          if(
            obj.src.includes(
              "image/jpeg"
            )
          ){

            image =
              await pdfDoc.embedJpg(
                imageBytes
              );

          }
          else{

            image =
              await pdfDoc.embedPng(
                imageBytes
              );

          }


          page.drawImage(
            image,
            {

              x:
                x,

              y:
                y,

              width:
                width,

              height:
                height

            }
          );

        }

      }


      const output =
        await pdfDoc.save();


      const blob =
        new Blob(
          [output],
          {
            type:
              "application/pdf"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        currentFile
          ? currentFile.name.replace(
              /\.pdf$/i,
              ""
            ) +
            "-edited.pdf"
          : "edited-pdf.pdf";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        function(){

          URL.revokeObjectURL(
            url
          );

        },
        1000
      );


      setStatus(
        "PDF downloaded successfully."
      );

    }
    catch(error){

      console.error(error);

      setStatus(
        "PDF download failed."
      );


      alert(
        "PDF download karte waqt error aaya."
      );

    }

  }
);


/* =========================================================
   DATA URL
========================================================= */

function dataURLToUint8Array(
  dataURL
){

  const base64 =
    dataURL.split(",")[1];


  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for(
    let i = 0;
    i < binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);

  }


  return bytes;

}

   WINDOW RESIZE
========================================================= */

window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        function(){

          if(pdfDocument){

            renderAllObjects();

            refreshPageLayers();

          }

        },
        250
      );

  }
);

setStatus(
