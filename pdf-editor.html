/* =========================================================
   HISTORY
========================================================= */

function createState(){

  return JSON.stringify({

    existingTexts:
      existingTexts,

    existingImages:
      existingImages,

    addedObjects:
      addedObjects

  });

}


function restoreState(
  state
){

  try{

    const data=
      JSON.parse(
        state
      );


    existingTexts=
      data.existingTexts || [];


    existingImages=
      data.existingImages || [];


    addedObjects=
      data.addedObjects || [];


    selectedObject=null;


    refreshPageLayers();

  }
  catch(error){

    console.error(
      error
    );

  }

}


function saveHistory(){

  const state=
    createState();


  if(
    historyIndex>=0 &&
    history[historyIndex]===
    state
  ){

    return;

  }


  history=
    history.slice(
      0,
      historyIndex+1
    );


  history.push(
    state
  );


  historyIndex=
    history.length-1;


  if(history.length>30){

    history.shift();

    historyIndex--;

  }

}


/* =========================================================
   UNDO
========================================================= */

document
.getElementById("undoBtn")
.addEventListener(
  "click",
  function(){

    if(historyIndex<=0){
      return;
    }


    historyIndex--;


    restoreState(
      history[historyIndex]
    );

  }
);


/* =========================================================
   REDO
========================================================= */

document
.getElementById("redoBtn")
.addEventListener(
  "click",
  function(){

    if(
      historyIndex>=
      history.length-1
    ){

      return;

    }


    historyIndex++;


    restoreState(
      history[historyIndex]
    );

  }
);


/* =========================================================
   PDF FONT CACHE
========================================================= */

async function getPdfFont(
  pdfDoc,
  fontFamily,
  text,
  fontCache
){

  const effectiveFont=
    getEffectiveFont(
      fontFamily,
      text
    );


  const cacheKey=
    effectiveFont;


  if(fontCache[cacheKey]){

    return fontCache[
      cacheKey
    ];

  }


  /*
    Hindi / Devanagari
  */

  if(
    effectiveFont===
    "NotoSansDevanagari"
  ){

    if(
      !window.fontkit
    ){

      throw new Error(
        "Fontkit library load nahi hui."
      );

    }


    pdfDoc.registerFontkit(
      window.fontkit
    );


    const fontBytes=
      await getNotoFontBytes();


    const embedded=
      await pdfDoc.embedFont(
        fontBytes,
        {
          subset:false
        }
      );


    fontCache[cacheKey]=
      embedded;


    return embedded;

  }


  let standardFont=
    StandardFonts.Helvetica;


  if(
    effectiveFont===
    "Times-Roman"
  ){

    standardFont=
      StandardFonts.TimesRoman;

  }
  else if(
    effectiveFont===
    "Courier"
  ){

    standardFont=
      StandardFonts.Courier;

  }


  const embedded=
    await pdfDoc.embedFont(
      standardFont
    );


  fontCache[cacheKey]=
    embedded;


  return embedded;

}


/* =========================================================
   DOWNLOAD
========================================================= */

document
.getElementById("downloadBtn")
.addEventListener(
  "click",
  async function(){

    if(!pdfBytes){

      alert(
        "Pehle PDF upload karein."
      );

      return;

    }


    try{

      setStatus(
        "Creating PDF..."
      );


      const pdfDoc=
        await PDFDocument.load(
          new Uint8Array(
            pdfBytes.slice(0)
          )
        );


      const pdfPages=
        pdfDoc.getPages();


      const fontCache={};


      /* =====================================================
         STEP 1
         EXISTING TEXT EDIT / DELETE
      ===================================================== */

      for(
        const item of existingTexts
      ){

        if(!item.edited){
          continue;
        }


        const page=
          pdfPages[
            item.page-1
          ];


        if(!page){
          continue;
        }


        const fontSize=
          Math.max(
            1,
            item.fontSize
          );


        const x=
          item.x;


        const baselineY=
          item.y;


        const textWidth=
          estimatePdfTextWidth(
            item.text,
            fontSize
          );


        const coverWidth=
          Math.max(
            item.width,
            textWidth
          )+
          fontSize*.45;


        const coverHeight=
          fontSize*
          1.45;


        const coverY=
          baselineY-
          fontSize*.35;


        page.drawRectangle({

          x:Math.max(
            0,
            x-
            fontSize*.12
          ),

          y:Math.max(
            0,
            coverY
          ),

          width:
            coverWidth,

          height:
            coverHeight,

          color:
            rgb(1,1,1)

        });


        if(item.deleted){
          continue;
        }


        const font=
          await getPdfFont(
            pdfDoc,
            item.fontFamily ||
            detectExistingFont(
              item.fontName
            ),
            item.text,
            fontCache
          );


        page.drawText(
          item.text,
          {

            x:x,

            y:baselineY,

            size:fontSize,

            font:font,

            color:
              rgb(0,0,0),

            lineHeight:
              fontSize*1.2

          }
        );

      }


      /* =====================================================
         STEP 2
         EXISTING IMAGE DELETE / REPLACE
      ===================================================== */

      const deletedImageAreas=[];


      for(
        const item of existingImages
      ){

        if(
          !item.deleted &&
          !item.replacementSrc &&
          !item.replaced
        ){

          continue;

        }


        const page=
          pdfPages[
            item.page-1
          ];


        if(!page){
          continue;
        }


        const pageWidth=
          page.getWidth();


        const pageHeight=
          page.getHeight();


        const pdfX=
          item.x/
          BASE_SCALE;


        const pdfWidth=
          item.width/
          BASE_SCALE;


        const pdfHeight=
          item.height/
          BASE_SCALE;


        const pdfY=
          pageHeight-
          item.y/
          BASE_SCALE-
          pdfHeight;


        /*
          Save deleted image area.
          Later we redraw ALL existing text
          overlapping this area.
        */

        if(item.deleted){

          deletedImageAreas.push({

            page:
              item.page,

            x:
              pdfX,

            y:
              pdfY,

            width:
              pdfWidth,

            height:
              pdfHeight

          });

        }


        /*
          White cover.
        */

        const safeX=
          Math.max(
            0,
            Math.min(
              pdfX,
              pageWidth
            )
          );


        const safeY=
          Math.max(
            0,
            Math.min(
              pdfY,
              pageHeight
            )
          );


        const safeWidth=
          Math.min(
            pdfWidth,
            Math.max(
              0,
              pageWidth-
              safeX
            )
          );


        const safeHeight=
          Math.min(
            pdfHeight,
            Math.max(
              0,
              pageHeight-
              safeY
            )
          );


        if(
          safeWidth>0 &&
          safeHeight>0
        ){

          page.drawRectangle({

            x:safeX,

            y:safeY,

            width:safeWidth,

            height:safeHeight,

            color:
              rgb(1,1,1)

          });

        }


        /*
          Replacement image
        */

        if(
          item.deleted ||
          !item.replacementSrc
        ){

          continue;

        }


        const imageBytes=
          dataURLToUint8Array(
            item.replacementSrc
          );


        let image;


        const lowerSrc=
          item.replacementSrc
          .toLowerCase();


        if(
          lowerSrc.startsWith(
            "data:image/jpeg"
          ) ||
          lowerSrc.startsWith(
            "data:image/jpg"
          )
        ){

          image=
            await pdfDoc.embedJpg(
              imageBytes
            );

        }
        else{

          image=
            await pdfDoc.embedPng(
              imageBytes
            );

        }


        page.drawImage(
          image,
          {

            x:pdfX,

            y:pdfY,

            width:pdfWidth,

            height:pdfHeight

          }
        );

      }


      /* =====================================================
         STEP 3
         CRITICAL WATERMARK FIX
         
         REDRAW EVERY EXISTING TEXT
         THAT WAS UNDER A DELETED IMAGE.
         
         NOT ONLY EDITED TEXT.
      ===================================================== */

      const redrawnTextIds=
        new Set();


      /*
        First mark all edited texts already redrawn
        in STEP 1.
      */

      existingTexts.forEach(
        function(item){

          if(
            item.edited &&
            !item.deleted
          ){

            redrawnTextIds.add(
              item.id
            );

          }

        }
      );


      for(
        const area of deletedImageAreas
      ){

        const page=
          pdfPages[
            area.page-1
          ];


        if(!page){
          continue;
        }


        for(
          const item of existingTexts
        ){

          if(
            item.page!==area.page ||
            item.deleted
          ){

            continue;

          }


          /*
            If this edited text was already redrawn
            in STEP 1, don't draw it twice.
          */

          if(
            redrawnTextIds.has(
              item.id
            )
          ){

            /*
              It may still need redraw if the
              deleted image covered the exact
              previous text. But STEP 1 already
              placed it after the image cover only
              if image STEP 2 came later.
              
              Therefore we redraw it here as well
              ONLY when it overlaps the deleted image.
            */

          }


          const textX=
            item.x;


          const textY=
            item.y;


          const textWidth=
            Math.max(
              item.width,
              estimatePdfTextWidth(
                item.text,
                item.fontSize
              )
            );


          const textHeight=
            item.fontSize*
            1.35;


          /*
            PDF coordinates:
            x,y is baseline-ish.
          */

          const overlap=
            rectanglesOverlap(

              textX,

              textY-
              textHeight*.35,

              textWidth,

              textHeight,

              area.x,

              area.y,

              area.width,

              area.height

            );


          if(!overlap){
            continue;
          }


          const font=
            await getPdfFont(
              pdfDoc,
              item.fontFamily ||
              detectExistingFont(
                item.fontName
              ),
              item.text,
              fontCache
            );


          /*
            Draw after image white cover.
            This is the actual watermark fix.
          */

          page.drawText(
            item.text,
            {

              x:item.x,

              y:item.y,

              size:
                Math.max(
                  1,
                  item.fontSize
                ),

              font:font,

              color:
                rgb(0,0,0),

              lineHeight:
                item.fontSize*
                1.2

            }
          );

        }

      }


      /* =====================================================
         STEP 4
         ADDED OBJECTS
      ===================================================== */

      for(
        const obj of addedObjects
      ){

        const page=
          pdfPages[
            obj.page-1
          ];


        if(!page){
          continue;
        }


        const pageWidth=
          page.getWidth();


        const pageHeight=
          page.getHeight();


        const x=
          clamp(
            obj.xRatio,
            0,
            1
          )*
          pageWidth;


        const width=
          clamp(
            obj.widthRatio,
            .001,
            1
          )*
          pageWidth;


        const height=
          clamp(
            obj.heightRatio,
            .001,
            1
          )*
          pageHeight;


        const top=
          clamp(
            obj.yRatio,
            0,
            1
          )*
          pageHeight;


        const y=
          pageHeight-
          top-
          height;


        if(
          obj.type==="text"
        ){

          const font=
            await getPdfFont(
              pdfDoc,
              obj.fontFamily,
              obj.text,
              fontCache
            );


          /*
            Match preview baseline more closely.
          */

          const textY=
            y+
            height-
            obj.fontSize*
            1.05;


          page.drawText(
            obj.text,
            {

              x:x,

              y:textY,

              size:
                obj.fontSize,

              font:font,

              color:
                rgb(0,0,0),

              lineHeight:
                obj.fontSize*
                1.2

            }
          );

        }


        if(
          obj.type==="image" ||
          obj.type==="qr"
        ){

          const imageBytes=
            dataURLToUint8Array(
              obj.src
            );


          let image;


          const lowerSrc=
            obj.src.toLowerCase();


          if(
            lowerSrc.startsWith(
              "data:image/jpeg"
            ) ||
            lowerSrc.startsWith(
              "data:image/jpg"
            )
          ){

            image=
              await pdfDoc.embedJpg(
                imageBytes
              );

          }
          else{

            image=
              await pdfDoc.embedPng(
                imageBytes
              );

          }


          page.drawImage(
            image,
            {

              x:x,

              y:y,

              width:width,

              height:height

            }
          );

        }

      }


      /* =====================================================
         SAVE
      ===================================================== */

      setStatus(
        "Saving PDF..."
      );


      const output=
        await pdfDoc.save();


      const blob=
        new Blob(
          [output],
          {
            type:
              "application/pdf"
          }
        );


      const url=
        URL.createObjectURL(
          blob
        );


      const a=
        document.createElement(
          "a"
        );


      a.href=url;


      a.download=
        currentFile
          ? currentFile.name.replace(
              /\.pdf$/i,
              ""
            )+
            "-edited.pdf"
          : "edited-pdf.pdf";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        function(){

          URL.revokeObjectURL(
            url
          );

        },
        1500
      );


      setStatus(
        "PDF downloaded successfully."
      );

    }
    catch(error){

      console.error(
        "PDF DOWNLOAD ERROR:",
        error
      );


      setStatus(
        "PDF download failed."
      );


      if(
        String(
          error.message || ""
        )
        .toLowerCase()
        .includes(
          "font"
        )
      ){

        alert(
          "Hindi/Unicode font load nahi ho saka. Internet connection check karke dobara Download karein."
        );

      }
      else{

        alert(
          "PDF download karte waqt error aaya. Console check karein."
        );

      }

    }

  }
);


/* =========================================================
   EXISTING FONT DETECTION
========================================================= */

function detectExistingFont(
  fontName
){

  const name=
    String(
      fontName || ""
    )
    .toLowerCase();


  if(
    name.includes("devanagari") ||
    name.includes("noto") ||
    name.includes("mangal") ||
    name.includes("kokila") ||
    name.includes("unicode")
  ){

    return "NotoSansDevanagari";

  }


  if(
    name.includes("times") ||
    name.includes("serif")
  ){

    return "Times-Roman";

  }


  if(
    name.includes("courier") ||
    name.includes("mono")
  ){

    return "Courier";

  }


  return "Helvetica";

}


/* =========================================================
   ESTIMATE PDF TEXT WIDTH
========================================================= */

function estimatePdfTextWidth(
  text,
  fontSize
){

  let width=0;


  for(
    const ch of Array.from(
      String(text || "")
    )
  ){

    if(
      /[\u0900-\u097F]/.test(ch)
    ){

      width+=
        fontSize*
        .72;

    }
    else if(
      /[A-Z]/.test(ch)
    ){

      width+=
        fontSize*
        .62;

    }
    else if(
      /[a-z]/.test(ch)
    ){

      width+=
        fontSize*
        .52;

    }
    else if(
      /\s/.test(ch)
    ){

      width+=
        fontSize*
        .28;

    }
    else{

      width+=
        fontSize*
        .50;

    }

  }


  return Math.max(
    fontSize*.5,
    width
  );

}


/* =========================================================
   RECTANGLE OVERLAP
========================================================= */

function rectanglesOverlap(
  ax,
  ay,
  aw,
  ah,
  bx,
  by,
  bw,
  bh
){

  return(

    ax<
      bx+bw &&

    ax+aw>
      bx &&

    ay<
      by+bh &&

    ay+ah>
      by

  );

}


/* =========================================================
   DATA URL
========================================================= */

function dataURLToUint8Array(
  dataURL
){

  const parts=
    dataURL.split(",");


  if(
    parts.length<2
  ){

    throw new Error(
      "Invalid image data."
    );

  }


  const binary=
    atob(
      parts[1]
    );


  const bytes=
    new Uint8Array(
      binary.length
    );


  for(
    let i=0;
    i<binary.length;
    i++
  ){

    bytes[i]=
      binary.charCodeAt(i);

  }


  return bytes;

}


/* =========================================================
   CLAMP
========================================================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

let resizeTimer=null;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer=
      setTimeout(
        async function(){

          if(!pdfDocument){
            return;
          }


          await refreshPageLayers();

        },
        250
      );

  }
);


/* =========================================================
   KEYBOARD DELETE
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    const tag=
      document.activeElement
        ? document.activeElement.tagName
        : "";


    if(
      tag==="INPUT" ||
      tag==="SELECT" ||
      tag==="TEXTAREA"
    ){

      return;

    }


    if(
      e.key==="Delete"
    ){

      if(selectedObject){

        document
        .getElementById(
          "deleteBtn"
        )
        .click();

      }

    }

  }
);


/* =========================================================
   ESCAPE
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key!=="Escape"
    ){
      return;
    }


    textModal.classList.remove(
      "show"
    );


    qrModal.classList.remove(
      "show"
    );


    replaceQRMode=false;


    resetTextModal();

  }
);


/* =========================================================
   CTRL + ENTER
   SAVE TEXT
========================================================= */

textInput.addEventListener(
  "keydown",
  function(e){

    if(
      e.ctrlKey &&
      e.key==="Enter"
    ){

      e.preventDefault();

      textOk.click();

    }

  }
);


/* =========================================================
   INITIAL
========================================================= */

setStatus(
  "Ready. Select a PDF to begin."
);
