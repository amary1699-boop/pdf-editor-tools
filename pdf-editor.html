<script>

/* =========================
   PDF.JS WORKER
========================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


/* =========================
   GLOBAL STATE
========================= */

let pdfDocument = null;
let uploadedFile = null;

let addedObjects = [];
let existingTexts = [];

let selectedObject = null;

let imageMode = "add";

let history = [];
let historyIndex = -1;

const BASE_SCALE = 2;


/* =========================
   DOM
========================= */

const pdfFile = document.getElementById("pdfFile");
const imageFile = document.getElementById("imageFile");

const pdfContainer = document.getElementById("pdf-container");
const emptyMessage = document.getElementById("emptyMessage");
const loading = document.getElementById("loading");
const statusEl = document.getElementById("status");

const addTextBtn = document.getElementById("addTextBtn");
const addImageBtn = document.getElementById("addImageBtn");
const replaceImageBtn = document.getElementById("replaceImageBtn");

const addQrBtn = document.getElementById("addQrBtn");
const replaceQrBtn = document.getElementById("replaceQrBtn");

const deleteBtn = document.getElementById("deleteBtn");

const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");

const clearBtn = document.getElementById("clearBtn");
const downloadBtn = document.getElementById("downloadBtn");

const textTools = document.getElementById("textTools");

const fontFamily = document.getElementById("fontFamily");
const fontSize = document.getElementById("fontSize");

const boldBtn = document.getElementById("boldBtn");
const italicBtn = document.getElementById("italicBtn");

const textColor = document.getElementById("textColor");
const editTextBtn = document.getElementById("editTextBtn");


/* =========================
   STATUS
========================= */

function setStatus(text){
  statusEl.textContent = text;
}


/* =========================
   CLONE
========================= */

function cloneData(data){
  return JSON.parse(JSON.stringify(data));
}


/* =========================
   HISTORY
========================= */

function createState(){

  return {
    addedObjects: cloneData(addedObjects),
    existingTexts: cloneData(existingTexts)
  };

}


function saveHistory(){

  const state = createState();

  history =
    history.slice(
      0,
      historyIndex + 1
    );

  history.push(state);

  historyIndex++;

  updateHistoryButtons();

}


function updateHistoryButtons(){

  undoBtn.disabled =
    historyIndex <= 0;

  redoBtn.disabled =
    historyIndex >= history.length - 1;

}


async function restoreHistory(){

  const state =
    history[historyIndex];

  if(!state)
    return;

  addedObjects =
    cloneData(
      state.addedObjects
    );

  existingTexts =
    cloneData(
      state.existingTexts
    );

  selectedObject = null;

  await renderPDF();

  updateSelectionUI();

  refreshSelection();

}


undoBtn.onclick =
async function(){

  if(historyIndex <= 0)
    return;

  historyIndex--;

  await restoreHistory();

  setStatus("Undo complete.");

};


redoBtn.onclick =
async function(){

  if(
    historyIndex >=
    history.length - 1
  )
    return;

  historyIndex++;

  await restoreHistory();

  setStatus("Redo complete.");

};


/* =========================
   LOAD PDF
========================= */

pdfFile.addEventListener(
  "change",
  async function(){

    const file =
      this.files &&
      this.files[0];

    if(!file)
      return;

    const isPDF =
      file.type === "application/pdf" ||
      /\.pdf$/i.test(file.name);

    if(!isPDF){

      alert("Please select a PDF file.");

      this.value = "";

      return;

    }

    uploadedFile = file;

    addedObjects = [];
    existingTexts = [];

    selectedObject = null;

    history = [];
    historyIndex = -1;

    emptyMessage.style.display =
      "none";

    loading.style.display =
      "block";

    setStatus("Loading PDF...");

    try{

      const buffer =
        await file.arrayBuffer();

      pdfDocument =
        await pdfjsLib
        .getDocument({
          data: buffer
        })
        .promise;

      await extractExistingText();

      await renderPDF();

      saveHistory();

      enableButtons();

      setStatus(
        pdfDocument.numPages +
        " page(s) loaded."
      );

    }catch(error){

      console.error(error);

      pdfDocument = null;
      uploadedFile = null;

      pdfContainer.innerHTML = "";

      emptyMessage.style.display =
        "flex";

      alert(
        "PDF load नहीं हो पाया। कृपया दूसरा PDF try करें।"
      );

      setStatus(
        "PDF loading failed."
      );

    }finally{

      loading.style.display =
        "none";

    }

  }
);


/* =========================
   ENABLE BUTTONS
========================= */

function enableButtons(){

  addTextBtn.disabled = false;
  addImageBtn.disabled = false;
  addQrBtn.disabled = false;

  clearBtn.disabled = false;
  downloadBtn.disabled = false;

}


/* =========================
   EXTRACT EXISTING TEXT
========================= */

async function extractExistingText(){

  existingTexts = [];

  for(
    let pageNumber = 1;
    pageNumber <= pdfDocument.numPages;
    pageNumber++
  ){

    const page =
      await pdfDocument.getPage(
        pageNumber
      );

    const content =
      await page.getTextContent();

    content.items.forEach(
      function(item){

        if(
          !item.str ||
          !item.str.trim()
        )
          return;

        const transform =
          item.transform;

        /*
         IMPORTANT:
         PDF.js transform contains
         the actual PDF coordinates.
        */

        const fontSizeValue =
          Math.sqrt(
            transform[2] *
            transform[2] +
            transform[3] *
            transform[3]
          );

        existingTexts.push({

          id:
            "existing-" +
            pageNumber +
            "-" +
            existingTexts.length,

          page:
            pageNumber,

          originalText:
            item.str,

          text:
            item.str,

          x:
            transform[4],

          y:
            transform[5],

          width:
            item.width ||
            fontSizeValue,

          height:
            Math.max(
              fontSizeValue,
              8
            ),

          fontSize:
            fontSizeValue || 10,

          transform:
            transform.slice(),

          deleted:
            false,

          edited:
            false

        });

      }
    );

  }

}


/* =========================
   RENDER PDF
========================= */

async function renderPDF(){

  if(!pdfDocument)
    return;

  pdfContainer.innerHTML = "";

  for(
    let pageNumber = 1;
    pageNumber <= pdfDocument.numPages;
    pageNumber++
  ){

    await renderPage(pageNumber);

  }

}


/* =========================
   RENDER PAGE
========================= */

async function renderPage(pageNumber){

  const page =
    await pdfDocument.getPage(
      pageNumber
    );

  /*
   IMPORTANT FIX:
   Keep original PDF dimensions
   separately from high-resolution
   preview dimensions.
  */

  const pdfViewport =
    page.getViewport({
      scale: 1
    });

  const viewport =
    page.getViewport({
      scale: BASE_SCALE
    });

  const outputScale =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  const pageDiv =
    document.createElement("div");

  pageDiv.className =
    "pdf-page";

  pageDiv.dataset.page =
    pageNumber;

  /*
   Store ORIGINAL PDF dimensions.
   This is important for text sizing.
  */

  pageDiv.dataset.pdfWidth =
    pdfViewport.width;

  pageDiv.dataset.pdfHeight =
    pdfViewport.height;

  pageDiv.style.aspectRatio =
    pdfViewport.width +
    "/" +
    pdfViewport.height;

  const canvas =
    document.createElement("canvas");

  const context =
    canvas.getContext("2d");

  canvas.width =
    Math.floor(
      viewport.width *
      outputScale
    );

  canvas.height =
    Math.floor(
      viewport.height *
      outputScale
    );

  pageDiv.appendChild(canvas);

  const pageNumberEl =
    document.createElement("div");

  pageNumberEl.className =
    "page-number";

  pageNumberEl.textContent =
    "Page " +
    pageNumber;

  pageDiv.appendChild(
    pageNumberEl
  );

  const existingLayer =
    document.createElement("div");

  existingLayer.className =
    "existing-layer";

  pageDiv.appendChild(
    existingLayer
  );

  const objectLayer =
    document.createElement("div");

  objectLayer.className =
    "object-layer";

  pageDiv.appendChild(
    objectLayer
  );

  pdfContainer.appendChild(
    pageDiv
  );

  await page.render({

    canvasContext:
      context,

    viewport:
      viewport,

    transform:
      outputScale !== 1
      ?
      [
        outputScale,
        0,
        0,
        outputScale,
        0,
        0
      ]
      :
      null

  }).promise;

  renderExistingText(
    pageDiv,
    existingLayer,
    viewport,
    pageNumber
  );

  renderObjectsForPage(
    pageDiv,
    objectLayer,
    pageNumber
  );

}


/* =========================
   EXISTING TEXT DISPLAY
   IMPORTANT POSITION FIX
========================= */

function renderExistingText(
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  const pageTexts =
    existingTexts.filter(
      item =>
        item.page === pageNumber
    );

  /*
   viewport = BASE_SCALE PDF pixels

   cssScale = actual displayed page /
              high resolution PDF canvas

   DO NOT use CSS transform here.
   That was causing double scaling.
  */

  const cssScale =
    pageDiv.clientWidth /
    viewport.width;

  pageTexts.forEach(
    function(item){

      if(item.deleted)
        return;

      const span =
        document.createElement("div");

      span.className =
        "existing-text";

      span.dataset.existingId =
        item.id;

      span.textContent =
        item.text;

      /*
       Convert PDF.js transform to
       viewport coordinates.
      */

      const tx =
        pdfjsLib.Util.transform(
          viewport.transform,
          item.transform
        );

      const fontHeight =
        Math.sqrt(
          tx[2] * tx[2] +
          tx[3] * tx[3]
        );

      /*
       ============================
       IMPORTANT FIX
       ============================

       Previously:

       left = tx[4]
       top = tx[5] - fontHeight
       transform = scale(cssScale)

       This caused incorrect position.

       Now we directly convert
       viewport pixels to CSS pixels.
      */

      span.style.left =
        (
          tx[4] *
          cssScale
        ) +
        "px";

      span.style.top =
        (
          (
            tx[5] -
            fontHeight
          ) *
          cssScale
        ) +
        "px";

      span.style.width =
        Math.max(
          4,
          item.width *
          BASE_SCALE *
          cssScale
        ) +
        "px";

      span.style.height =
        Math.max(
          8,
          fontHeight *
          1.3 *
          cssScale
        ) +
        "px";

      span.style.fontSize =
        Math.max(
          6,
          fontHeight *
          cssScale
        ) +
        "px";

      /*
       NO transform here.
       This is the main fix.
      */

      span.style.transform =
        "none";

      if(
        selectedObject &&
        selectedObject.type ===
        "existingText" &&
        selectedObject.id ===
        item.id
      ){

        span.classList.add(
          "selected"
        );

      }

      span.addEventListener(
        "click",
        function(e){

          e.stopPropagation();

          selectedObject = {

            type:
              "existingText",

            id:
              item.id

          };

          updateSelectionUI();

          refreshSelection();

        }
      );

      span.addEventListener(
        "dblclick",
        function(e){

          e.stopPropagation();

          editExistingText(item);

        }
      );

      layer.appendChild(span);

    }
  );

}


/* =========================
   OBJECT RENDER
========================= */

function renderObjectsForPage(
  pageDiv,
  layer,
  pageNumber
){

  addedObjects
    .filter(
      obj =>
        obj.page === pageNumber
    )
    .forEach(
      function(obj){

        createObjectElement(
          obj,
          pageDiv,
          layer
        );

      }
    );

}


function renderObjects(){

  document
    .querySelectorAll(".object-layer")
    .forEach(
      layer =>
        layer.innerHTML = ""
    );

  addedObjects.forEach(
    function(obj){

      const pageDiv =
        document.querySelector(
          '.pdf-page[data-page="' +
          obj.page +
          '"]'
        );

      if(!pageDiv)
        return;

      const layer =
        pageDiv.querySelector(
          ".object-layer"
        );

      if(layer){

        createObjectElement(
          obj,
          pageDiv,
          layer
        );

      }

    }
  );

}


/* =========================
   CREATE OBJECT
========================= */

function createObjectElement(
  obj,
  pageDiv,
  layer
){

  const el =
    document.createElement("div");

  el.className =
    "pdf-object";

  el.dataset.id =
    obj.id;

  el.dataset.type =
    obj.type;

  const pageWidth =
    pageDiv.clientWidth;

  const pageHeight =
    pageDiv.clientHeight;

  el.style.left =
    (
      obj.xRatio *
      pageWidth
    ) +
    "px";

  el.style.top =
    (
      obj.yRatio *
      pageHeight
    ) +
    "px";

  el.style.width =
    (
      obj.widthRatio *
      pageWidth
    ) +
    "px";

  el.style.height =
    (
      obj.heightRatio *
      pageHeight
    ) +
    "px";

  if(
    selectedObject &&
    selectedObject.type === obj.type &&
    selectedObject.id === obj.id
  ){

    el.classList.add("selected");

  }


  /* =====================
     TEXT
  ===================== */

  if(obj.type === "text"){

    const text =
      document.createElement("div");

    text.className =
      "pdf-text";

    text.textContent =
      obj.text;

    applyTextStyle(
      text,
      obj,
      pageDiv
    );

    el.appendChild(text);

  }


  /* =====================
     IMAGE
  ===================== */

  if(obj.type === "image"){

    const img =
      document.createElement("img");

    img.className =
      "pdf-image";

    img.src =
      obj.src;

    img.draggable =
      false;

    el.appendChild(img);

  }


  /* =====================
     QR
  ===================== */

  if(obj.type === "qr"){

    const qrBox =
      document.createElement("div");

    qrBox.className =
      "pdf-qr";

    el.appendChild(qrBox);

    generateQR(
      qrBox,
      obj.data
    );

  }


  /* =====================
     RESIZE HANDLE
  ===================== */

  const handle =
    document.createElement("div");

  handle.className =
    "resize-handle";

  el.appendChild(handle);


  /* =====================
     DRAG
  ===================== */

  el.addEventListener(
    "pointerdown",
    function(e){

      if(e.target === handle)
        return;

      e.preventDefault();

      e.stopPropagation();

      selectAddedObject(obj);

      startDragging(
        e,
        obj,
        el,
        pageDiv
      );

    }
  );


  /* =====================
     RESIZE
  ===================== */

  handle.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      selectAddedObject(obj);

      startResizing(
        e,
        obj,
        el,
        pageDiv
      );

    }
  );

  layer.appendChild(el);

}


/* =========================
   TEXT STYLE
========================= */

function applyTextStyle(
  element,
  obj,
  pageDiv
){

  element.style.fontFamily =
    obj.fontFamily;

  const pagePdfWidth =
    Number(
      pageDiv.dataset.pdfWidth
    );

  const cssScale =
    pageDiv.clientWidth /
    pagePdfWidth;

  let cssFontSize;

  if(
    Number.isFinite(
      Number(obj.fontSizePdf)
    )
  ){

    cssFontSize =
      Number(obj.fontSizePdf) *
      cssScale;

  }else{

    cssFontSize =
      Number(obj.fontSize) || 20;

  }

  element.style.fontSize =
    Math.max(
      6,
      cssFontSize
    ) +
    "px";

  element.style.color =
    obj.color;

  element.style.fontWeight =
    obj.bold
    ?
    "700"
    :
    "400";

  element.style.fontStyle =
    obj.italic
    ?
    "italic"
    :
    "normal";

}


/* =========================
   SELECTION
========================= */

function selectAddedObject(obj){

  selectedObject = {

    type:
      obj.type,

    id:
      obj.id

  };

  updateSelectionUI();

  refreshSelection();

}


function refreshSelection(){

  document
    .querySelectorAll(".pdf-object")
    .forEach(
      function(el){

        const selected =
          selectedObject &&
          selectedObject.type ===
          el.dataset.type &&
          selectedObject.id ===
          el.dataset.id;

        el.classList.toggle(
          "selected",
          !!selected
        );

      }
    );

  document
    .querySelectorAll(".existing-text")
    .forEach(
      function(el){

        const selected =
          selectedObject &&
          selectedObject.type ===
          "existingText" &&
          selectedObject.id ===
          el.dataset.existingId;

        el.classList.toggle(
          "selected",
          !!selected
        );

      }
    );

}


function getSelectedAdded(){

  if(!selectedObject)
    return null;

  return addedObjects.find(
    obj =>
      obj.id === selectedObject.id &&
      obj.type === selectedObject.type
  );

}


function getSelectedExisting(){

  if(
    !selectedObject ||
    selectedObject.type !==
    "existingText"
  )
    return null;

  return existingTexts.find(
    item =>
      item.id === selectedObject.id
  );

}


/* =========================
   SELECTION UI
========================= */

function updateSelectionUI(){

  const obj =
    getSelectedAdded();

  const existing =
    getSelectedExisting();

  deleteBtn.disabled =
    !obj && !existing;

  replaceImageBtn.disabled =
    !obj ||
    obj.type !== "image";

  replaceQrBtn.disabled =
    !obj ||
    obj.type !== "qr";

  textTools.style.display =
    (
      obj &&
      obj.type === "text"
    ) ||
    !!existing
    ?
    "flex"
    :
    "none";


  if(obj && obj.type === "text"){

    fontFamily.value =
      obj.fontFamily;

    fontSize.value =
      Math.round(
        obj.fontSize ||
        20
      );

    textColor.value =
      obj.color;

    boldBtn.classList.toggle(
      "active",
      !!obj.bold
    );

    italicBtn.classList.toggle(
      "active",
      !!obj.italic
    );

  }


  if(existing){

    boldBtn.classList.remove(
      "active"
    );

    italicBtn.classList.remove(
      "active"
    );

    fontSize.value =
      Math.round(
        existing.fontSize
      );

    textColor.value =
      "#000000";

  }

}


/* =========================
   EXISTING TEXT EDIT
========================= */

function editExistingText(item){

  const newText =
    prompt(
      "Edit existing PDF text:",
      item.text
    );

  if(newText === null)
    return;

  item.text =
    newText;

  item.edited =
    true;

  selectedObject = {

    type:
      "existingText",

    id:
      item.id

  };

  saveHistory();

  renderPDF()
    .then(
      function(){

        updateSelectionUI();

        refreshSelection();

      }
    );

  setStatus(
    "Existing text edited."
  );

}


editTextBtn.onclick =
function(){

  const obj =
    getSelectedAdded();

  const existing =
    getSelectedExisting();


  if(
    obj &&
    obj.type === "text"
  ){

    const newText =
      prompt(
        "Edit text:",
        obj.text
      );

    if(newText === null)
      return;

    obj.text =
      newText;

    saveHistory();

    renderObjects();

    updateSelectionUI();

    refreshSelection();

    setStatus(
      "Text updated."
    );

    return;

  }


  if(existing){

    editExistingText(existing);

  }

};


/* =========================
   DELETE
========================= */

deleteBtn.onclick =
async function(){

  if(!selectedObject)
    return;

  const existing =
    getSelectedExisting();

  if(existing){

    existing.deleted =
      true;

    saveHistory();

    setStatus(
      "Existing text deleted."
    );

  }else{

    const index =
      addedObjects.findIndex(
        obj =>
          obj.id ===
          selectedObject.id
      );

    if(index >= 0){

      addedObjects.splice(
        index,
        1
      );

      saveHistory();

      setStatus(
        "Object deleted."
      );

    }

  }

  selectedObject = null;

  await renderPDF();

  updateSelectionUI();

  refreshSelection();

};


/* =========================
   ADD TEXT
========================= */

addTextBtn.onclick =
async function(){

  const text =
    prompt(
      "Enter text:"
    );

  if(
    text === null ||
    !text.trim()
  )
    return;

  /*
   New text is currently added
   on page 1.
  */

  const page =
    document.querySelector(
      '.pdf-page[data-page="1"]'
    );

  if(!page)
    return;

  const pdfWidth =
    Number(
      page.dataset.pdfWidth
    );

  const enteredSize =
    20;

  /*
   CSS pixels -> PDF points
  */

  const cssScale =
    page.clientWidth /
    pdfWidth;

  const fontSizePdf =
    enteredSize /
    cssScale;


  const obj = {

    id:
      "text-" +
      Date.now() +
      "-" +
      Math.random()
      .toString(36)
      .slice(2),

    type:
      "text",

    page:
      1,

    text:
      text,

    xRatio:
      0.10,

    yRatio:
      0.10,

    widthRatio:
      0.50,

    heightRatio:
      0.08,

    fontSize:
      enteredSize,

    fontSizePdf:
      fontSizePdf,

    fontFamily:
      "Arial",

    bold:
      false,

    italic:
      false,

    color:
      "#000000"

  };


  addedObjects.push(obj);

  selectedObject = {

    type:
      "text",

    id:
      obj.id

  };

  saveHistory();

  renderObjects();

  updateSelectionUI();

  refreshSelection();

  setStatus(
    "New text added."
  );

};


/* =========================
   IMAGE ADD
========================= */

addImageBtn.onclick =
function(){

  imageMode =
    "add";

  imageFile.value =
    "";

  imageFile.click();

};


/* =========================
   IMAGE REPLACE
========================= */

replaceImageBtn.onclick =
function(){

  const obj =
    getSelectedAdded();

  if(
    !obj ||
    obj.type !== "image"
  )
    return;

  imageMode =
    "replace";

  imageFile.value =
    "";

  imageFile.click();

};


/* =========================
   IMAGE FILE
========================= */

imageFile.addEventListener(
  "change",
  function(){

    const file =
      this.files &&
      this.files[0];

    if(!file)
      return;

    const valid =
      /\.(png|jpe?g|webp)$/i.test(
        file.name
      );

    if(!valid){

      alert(
        "Please select PNG, JPG, JPEG or WEBP."
      );

      this.value = "";

      return;

    }


    const reader =
      new FileReader();


    reader.onload =
    function(){

      const src =
        reader.result;


      /* ===================
         REPLACE IMAGE
      =================== */

      if(imageMode === "replace"){

        const obj =
          getSelectedAdded();

        if(!obj)
          return;

        obj.src =
          src;

        obj.mime =
          file.type ||
          "image/png";

        saveHistory();

        renderObjects();

        updateSelectionUI();

        refreshSelection();

        setStatus(
          "Image replaced."
        );

        return;

      }


      /* ===================
         ADD IMAGE
      =================== */

      const img =
        new Image();


      img.onload =
      function(){

        const page =
          document.querySelector(
            '.pdf-page[data-page="1"]'
          );

        if(!page)
          return;


        const pdfWidth =
          Number(
            page.dataset.pdfWidth
          );

        const pdfHeight =
          Number(
            page.dataset.pdfHeight
          );


        /*
         Calculate image size using
         REAL image aspect ratio.
        */

        let widthPdf =
          pdfWidth * 0.30;

        let heightPdf =
          widthPdf *
          (
            img.naturalHeight /
            img.naturalWidth
          );


        /*
         Keep image inside page.
        */

        const maxHeight =
          pdfHeight * 0.45;

        if(heightPdf > maxHeight){

          heightPdf =
            maxHeight;

          widthPdf =
            heightPdf *
            (
              img.naturalWidth /
              img.naturalHeight
            );

        }


        const obj = {

          id:
            "image-" +
            Date.now() +
            "-" +
            Math.random()
            .toString(36)
            .slice(2),

          type:
            "image",

          page:
            1,

          src:
            src,

          mime:
            file.type ||
            "image/png",

          xRatio:
            0.10,

          yRatio:
            0.15,

          widthRatio:
            widthPdf /
            pdfWidth,

          heightRatio:
            heightPdf /
            pdfHeight

        };


        addedObjects.push(obj);

        selectedObject = {

          type:
            "image",

          id:
            obj.id

        };


        saveHistory();

        renderObjects();

        updateSelectionUI();

        refreshSelection();

        setStatus(
          "Image added."
        );

      };


      img.src =
        src;

    };


    reader.readAsDataURL(file);

  }
);

/* =========================
   DRAG
========================= */

function startDragging(
  e,
  obj,
  el,
  pageDiv
){

  e.preventDefault();

  const startX =
    e.clientX;

  const startY =
    e.clientY;

  const originalX =
    obj.xRatio;

  const originalY =
    obj.yRatio;

  let moved =
    false;


  function move(ev){

    moved =
      true;

    const dx =
      ev.clientX -
      startX;

    const dy =
      ev.clientY -
      startY;


    let newX =
      originalX +
      dx /
      pageDiv.clientWidth;

    let newY =
      originalY +
      dy /
      pageDiv.clientHeight;


    obj.xRatio =
      Math.max(
        0,
        Math.min(
          1 -
          obj.widthRatio,
          newX
        )
      );


    obj.yRatio =
      Math.max(
        0,
        Math.min(
          1 -
          obj.heightRatio,
          newY
        )
      );


    el.style.left =
      (
        obj.xRatio *
        pageDiv.clientWidth
      ) +
      "px";

    el.style.top =
      (
        obj.yRatio *
        pageDiv.clientHeight
      ) +
      "px";

  }


  function end(){

    document.removeEventListener(
      "pointermove",
      move
    );

    document.removeEventListener(
      "pointerup",
      end
    );

    if(moved){

      saveHistory();

    }

  }


  document.addEventListener(
    "pointermove",
    move
  );

  document.addEventListener(
    "pointerup",
    end
  );

}


/* =========================
   RESIZE
========================= */

function startResizing(
  e,
  obj,
  el,
  pageDiv
){

  e.preventDefault();

  const startX =
    e.clientX;

  const startY =
    e.clientY;


  const oldWidth =
    obj.widthRatio *
    pageDiv.clientWidth;

  const oldHeight =
    obj.heightRatio *
    pageDiv.clientHeight;


  const aspectRatio =
    oldHeight /
    oldWidth;


  function move(ev){

    const dx =
      ev.clientX -
      startX;

    const dy =
      ev.clientY -
      startY;


    let newPixelWidth =
      oldWidth +
      dx;


    newPixelWidth =
      Math.max(
        35,
        Math.min(
          pageDiv.clientWidth *
          0.95,
          newPixelWidth
        )
      );


    let newPixelHeight;


    if(
      obj.type === "image" ||
      obj.type === "qr"
    ){

      newPixelHeight =
        newPixelWidth *
        aspectRatio;

    }else{

      newPixelHeight =
        oldHeight +
        dy;

      newPixelHeight =
        Math.max(
          25,
          newPixelHeight
        );

    }


    newPixelHeight =
      Math.min(
        newPixelHeight,
        pageDiv.clientHeight *
        0.95
      );


    obj.widthRatio =
      newPixelWidth /
      pageDiv.clientWidth;

    obj.heightRatio =
      newPixelHeight /
      pageDiv.clientHeight;


    obj.widthRatio =
      Math.min(
        obj.widthRatio,
        1 -
        obj.xRatio
      );

    obj.heightRatio =
      Math.min(
        obj.heightRatio,
        1 -
        obj.yRatio
      );


    el.style.width =
      (
        obj.widthRatio *
        pageDiv.clientWidth
      ) +
      "px";

    el.style.height =
      (
        obj.heightRatio *
        pageDiv.clientHeight
      ) +
      "px";

  }


  function end(){

    document.removeEventListener(
      "pointermove",
      move
    );

    document.removeEventListener(
      "pointerup",
      end
    );

    saveHistory();

  }


  document.addEventListener(
    "pointermove",
    move
  );

  document.addEventListener(
    "pointerup",
    end
  );

}

/* =========================
   HEX TO RGB
========================= */

function hexToRgb(hex){

  hex =
    hex.replace("#","");

  return {

    r:
      parseInt(
        hex.substring(0,2),
        16
      ) / 255,

    g:
      parseInt(
        hex.substring(2,4),
        16
      ) / 255,

    b:
      parseInt(
        hex.substring(4,6),
        16
      ) / 255

  };

}


/* =========================
   PDF FONT
========================= */

function getPdfFontName(
  family,
  bold,
  italic
){

  const f =
    family.toLowerCase();


  if(
    f.includes("times") ||
    f.includes("georgia")
  ){

    if(
      bold &&
      italic
    )
      return PDFLib.StandardFonts.TimesRomanBoldItalic;

    if(bold)
      return PDFLib.StandardFonts.TimesRomanBold;

    if(italic)
      return PDFLib.StandardFonts.TimesRomanItalic;

    return PDFLib.StandardFonts.TimesRoman;

  }


  if(
    f.includes("courier")
  ){

    if(
      bold &&
      italic
    )
      return PDFLib.StandardFonts.CourierBoldOblique;

    if(bold)
      return PDFLib.StandardFonts.CourierBold;

    if(italic)
      return PDFLib.StandardFonts.CourierOblique;

    return PDFLib.StandardFonts.Courier;

  }


  if(
    bold &&
    italic
  )
    return PDFLib.StandardFonts.HelveticaBoldOblique;

  if(bold)
    return PDFLib.StandardFonts.HelveticaBold;

  if(italic)
    return PDFLib.StandardFonts.HelveticaOblique;

  return PDFLib.StandardFonts.Helvetica;

}


/* =========================
   DATA URL
========================= */

async function dataUrlToBytes(
  dataUrl
){

  const response =
    await fetch(dataUrl);

  return await response.arrayBuffer();

}


/* =========================
   IMAGE BYTES
========================= */

async function getImageBytesForPDF(
  obj
){

  if(
    obj.mime !== "image/webp"
  ){

    return {

      bytes:
        await dataUrlToBytes(
          obj.src
        ),

      type:
        obj.mime ||
        "image/png"

    };

  }


  const img =
    new Image();

  img.src =
    obj.src;


  await new Promise(
    function(resolve,reject){

      img.onload =
        resolve;

      img.onerror =
        reject;

    }
  );


  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    img.naturalWidth;

  canvas.height =
    img.naturalHeight;


  const ctx =
    canvas.getContext("2d");

  ctx.drawImage(
    img,
    0,
    0
  );


  const png =
    canvas.toDataURL(
      "image/png"
    );


  return {

    bytes:
      await dataUrlToBytes(
        png
      ),

    type:
      "image/png"

  };

}

/* =========================
   DOWNLOAD PDF
========================= */

async function downloadPDF(){

  if(!uploadedFile)
    return;


  downloadBtn.disabled =
    true;

  setStatus(
    "Creating PDF..."
  );


  try{

    const originalBytes =
      await uploadedFile.arrayBuffer();


    const pdfDoc =
      await PDFLib.PDFDocument.load(
        originalBytes
      );


    const pages =
      pdfDoc.getPages();


    /*
     IMPORTANT:
     Font embedding is async.
    */

    const fontCache = {};


    async function getFont(
      family,
      bold,
      italic
    ){

      const key =
        family +
        "|" +
        bold +
        "|" +
        italic;


      if(
        !fontCache[key]
      ){

        fontCache[key] =
          pdfDoc.embedFont(
            getPdfFontName(
              family,
              bold,
              italic
            )
          );

      }


      return await fontCache[key];

    }


    /* =====================
       EXISTING TEXT
    ===================== */

    for(
      const item of existingTexts
    ){

      if(
        !item.deleted &&
        !item.edited
      )
        continue;


      const page =
        pages[item.page - 1];

      if(!page)
        continue;


      const x =
        item.x;


      const size =
        Math.max(
          6,
          item.fontSize
        );


      /*
       Cover original text.
      */

      const coverWidth =
        Math.max(
          item.width,
          size * 0.5
        );


      const coverY =
        Math.max(
          0,
          item.y -
          size * 0.40
        );


      const coverHeight =
        Math.max(
          size * 1.35,
          item.height
        );


      page.drawRectangle({

        x:
          x,

        y:
          coverY,

        width:
          coverWidth,

        height:
          coverHeight,

        color:
          PDFLib.rgb(
            1,
            1,
            1
          )

      });


      /*
       Draw edited text at the
       same PDF coordinate.
      */

      if(
        item.edited &&
        !item.deleted &&
        item.text
      ){

        const font =
          await getFont(
            "Arial",
            false,
            false
          );


        page.drawText(
          item.text,
          {

            x:
              x,

            y:
              item.y -
              size * 0.18,

            size:
              size,

            font:
              font,

            color:
              PDFLib.rgb(
                0,
                0,
                0
              )

          }
        );

      }

    }


    /* =====================
       ADDED OBJECTS
    ===================== */

    for(
      const obj of addedObjects
    ){

      const page =
        pages[obj.page - 1];

      if(!page)
        continue;


      const pageWidth =
        page.getWidth();

      const pageHeight =
        page.getHeight();


      const x =
        obj.xRatio *
        pageWidth;


      const width =
        obj.widthRatio *
        pageWidth;


      const height =
        obj.heightRatio *
        pageHeight;


      const y =
        pageHeight -
        (
          obj.yRatio *
          pageHeight
        ) -
        height;


      /* ===================
         TEXT
      =================== */

      if(
        obj.type === "text"
      ){

        const font =
          await getFont(
            obj.fontFamily,
            obj.bold,
            obj.italic
          );


        const rgb =
          hexToRgb(
            obj.color
          );


        let size =
          Number(
            obj.fontSizePdf
          );


        if(
          !Number.isFinite(size) ||
          size <= 0
        ){

          const pageDiv =
            document.querySelector(
              '.pdf-page[data-page="' +
              obj.page +
              '"]'
            );


          if(pageDiv){

            const scale =
              pageWidth /
              pageDiv.clientWidth;

            size =
              Number(obj.fontSize) *
              scale;

          }else{

            size =
              Number(obj.fontSize) ||
              20;

          }

        }


        size =
          Math.max(
            6,
            size
          );


        /*
         IMPORTANT:
         x is PDF left coordinate.

         y is calculated from
         the TOP position of the
         browser object.

         PDF uses bottom-left origin.
        */

        const baselineY =
          pageHeight -
          (
            obj.yRatio *
            pageHeight
          ) -
          size;


        page.drawText(
          obj.text,
          {

            x:
              x,

            y:
              baselineY,

            size:
              size,

            font:
              font,

            color:
              PDFLib.rgb(
                rgb.r,
                rgb.g,
                rgb.b
              )

          }
        );

      }


      /* ===================
         IMAGE
      =================== */

      if(
        obj.type === "image"
      ){

        const imageInfo =
          await getImageBytesForPDF(
            obj
          );


        let image;


        if(
          imageInfo.type ===
          "image/jpeg"
        ){

          image =
            await pdfDoc.embedJpg(
              imageInfo.bytes
            );

        }else{

          image =
            await pdfDoc.embedPng(
              imageInfo.bytes
            );

        }


        /*
         Keep image aspect ratio.
         This prevents distortion.
        */

        const imageWidth =
          image.width;

        const imageHeight =
          image.height;


        const scale =
          Math.min(
            width / imageWidth,
            height / imageHeight
          );


        const drawWidth =
          imageWidth *
          scale;


        const drawHeight =
          imageHeight *
          scale;


        const drawX =
          x +
          (
            width -
            drawWidth
          ) / 2;


        const drawY =
          y +
          (
            height -
            drawHeight
          ) / 2;


        page.drawImage(
          image,
          {

            x:
              drawX,

            y:
              drawY,

            width:
              drawWidth,

            height:
              drawHeight

          }
        );

      }


      /* ===================
         QR
      =================== */

      if(
        obj.type === "qr"
      ){

        const qrData =
          await qrToDataURL(
            obj.data
          );


        const bytes =
          await dataUrlToBytes(
            qrData
          );


        const image =
          await pdfDoc.embedPng(
            bytes
          );


        page.drawImage(
          image,
          {

            x:
              x,

            y:
              y,

            width:
              width,

            height:
              height

          }
        );

      }

    }


    /* =====================
       SAVE
    ===================== */

    const finalBytes =
      await pdfDoc.save({
        useObjectStreams:false
      });


    const blob =
      new Blob(
        [finalBytes],
        {
          type:
            "application/pdf"
        }
      );


    const url =
      URL.createObjectURL(
        blob
      );


    const a =
      document.createElement("a");

    a.href =
      url;


    let name =
      document
      .getElementById(
        "fileName"
      )
      .value
      .trim();


    if(!name)
      name =
        "edited-pdf.pdf";


    if(
      !name
      .toLowerCase()
      .endsWith(".pdf")
    ){

      name += ".pdf";

    }


    a.download =
      name;


    document.body.appendChild(
      a
    );

    a.click();

    a.remove();


    setTimeout(
      function(){

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );


    setStatus(
      "PDF downloaded successfully."
    );


  }catch(error){

    console.error(error);

    alert(
      "PDF download करते समय error आया।"
    );

    setStatus(
      "Download failed."
    );

  }


  downloadBtn.disabled =
    false;

}


downloadBtn.onclick =
downloadPDF;


/* =========================
   RESPONSIVE RENDER
========================= */

let resizeTimer;


window.addEventListener(
  "resize",
  function(){

    if(!pdfDocument)
      return;


    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function(){

          await renderPDF();

          updateSelectionUI();

          refreshSelection();

        },
        300
      );

  }
);
