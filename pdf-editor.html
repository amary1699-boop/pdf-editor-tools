<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Free PDF Editor - Edit PDF Online</title>

<meta name="description"
content="Free online PDF editor. Edit PDF text, add images and QR codes and download your edited PDF.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#222;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header-inner{
  max-width:1180px;
  min-height:68px;
  margin:auto;
  padding:10px 18px;

  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;

  text-decoration:none;
  color:#222;

  font-size:20px;
  font-weight:700;
}

.logo-icon{
  width:38px;
  height:38px;

  border-radius:9px;

  background:#e53232;
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:15px;
  font-weight:800;
}

.home-btn{
  text-decoration:none;
  color:#333;

  padding:9px 14px;

  border-radius:8px;
  border:1px solid #ddd;

  background:#fff;

  font-weight:600;
}

.home-btn:hover{
  background:#f5f5f5;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  max-width:1180px;

  margin:20px auto 0;
  padding:25px 20px;

  border-radius:16px;

  background:linear-gradient(
    135deg,
    #fff,
    #fff5f5
  );

  border:1px solid #f0dddd;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#666;
}


/* =========================================================
   WRAPPER
========================================================= */

.editor-wrapper{
  max-width:1180px;

  margin:18px auto 50px;

  padding:0 15px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  position:sticky;

  top:68px;

  z-index:900;

  background:#fff;

  border:1px solid #e5e5e5;

  border-radius:14px;

  padding:12px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.06);

  display:flex;

  flex-wrap:wrap;

  gap:8px;

  margin-bottom:15px;
}

.tool-btn{
  border:1px solid #ddd;

  background:#fff;

  color:#222;

  border-radius:8px;

  padding:9px 12px;

  cursor:pointer;

  font-weight:600;

  font-size:14px;
}

.tool-btn:hover{
  background:#f5f5f5;
}

.tool-btn.primary{
  background:#e53232;

  border-color:#e53232;

  color:#fff;
}

.tool-btn.primary:hover{
  background:#c92727;
}

.tool-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}


/* =========================================================
   FILE
========================================================= */

.file-area{
  background:#fff;

  border:2px dashed #ddd;

  border-radius:14px;

  padding:25px;

  text-align:center;

  margin-bottom:18px;

  transition:.2s;
}

.file-area.drag{
  border-color:#e53232;
  background:#fff7f7;
}

.file-label{
  display:inline-block;

  background:#e53232;

  color:#fff;

  padding:11px 20px;

  border-radius:8px;

  cursor:pointer;

  font-weight:700;
}

.file-label:hover{
  background:#c92727;
}

#pdfFile{
  display:none;
}

.file-name{
  margin-top:10px;

  color:#666;

  font-size:14px;

  word-break:break-word;
}


/* =========================================================
   STATUS
========================================================= */

.status{
  margin:12px 0;

  text-align:center;

  color:#666;

  font-size:14px;

  min-height:20px;
}


/* =========================================================
   PDF
========================================================= */

.pdf-container{
  width:100%;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:25px;
}

.pdf-page{
  position:relative;

  width:100%;

  max-width:850px;

  background:#fff;

  box-shadow:
    0 5px 25px rgba(0,0,0,.15);

  overflow:hidden;

  border:2px solid transparent;

  transition:border-color .15s;
}

.pdf-page.active-page{
  border-color:rgba(229,50,50,.35);
}

.pdf-canvas{
  display:block;

  width:100%;

  height:auto;
}


/* =========================================================
   LAYERS
========================================================= */

.existing-layer,
.object-layer{
  position:absolute;

  inset:0;

  overflow:hidden;
}

.existing-layer{
  z-index:15;
  pointer-events:none;
}

.object-layer{
  z-index:10;
  pointer-events:none;
}


/* =========================================================
   EXISTING TEXT
========================================================= */

.existing-text{
  position:absolute;

  margin:0;
  padding:0;

  white-space:pre;

  overflow:hidden;

  color:transparent;

  background:transparent;

  cursor:text;

  pointer-events:auto;

  line-height:1;

  user-select:none;

  border:1px solid transparent;
}

.existing-text:hover{
  background:rgba(229,50,50,.10);

  border-color:
    rgba(229,50,50,.35);
}

.existing-text.selected{
  background:rgba(229,50,50,.14);

  border:2px solid #e53232;
}

.existing-text.edited-visible{
  color:#111;

  background:rgba(255,255,255,.96);

  border:1px solid rgba(0,0,0,.08);
}


/* =========================================================
   DELETED TEXT
========================================================= */

.deleted-cover{
  position:absolute;

  background:#fff;

  pointer-events:auto;

  cursor:pointer;

  z-index:7;
}


/* =========================================================
   EXISTING PDF IMAGES
========================================================= */

.existing-image{
  position:absolute;
  z-index:20;
  pointer-events:auto;
  cursor:pointer;
  border:2px solid transparent;
  background:transparent;
  transition:.15s;
  overflow:hidden;
  box-sizing:border-box;
}

.existing-image:hover{
  background:rgba(229,50,50,.08);
  border-color:rgba(229,50,50,.35);
}

.existing-image.selected{
  background:rgba(229,50,50,.10);
  border:2px solid #e53232;
  box-shadow:0 0 0 1px rgba(229,50,50,.15);
}

.existing-image:hover{
  background:rgba(229,50,50,.08);

  border-color:
    rgba(229,50,50,.35);
}

.existing-image.selected{
  background:rgba(229,50,50,.10);

  border:2px solid #e53232;
}

.existing-image img{
  width:100%;
  height:100%;

  display:block;

  object-fit:contain;

  pointer-events:none;
}


/* =========================================================
   DELETED EXISTING IMAGE
========================================================= */

.deleted-image{
  position:absolute;

  z-index:9;

  background:#fff;

  pointer-events:auto;

  cursor:pointer;
}
.existing-image .resize-handle{
  display:none;
}

.existing-image.selected .resize-handle{
  display:block;
}

.deleted-image.selected{
  border:2px solid #e53232;
  background:#fff;
  box-shadow:0 0 0 1px rgba(229,50,50,.15);
  box-sizing:border-box;
}

/* =========================================================
   ADDED OBJECTS
========================================================= */

.editor-object{
  position:absolute;

  pointer-events:auto;

  user-select:none;

  cursor:move;

  touch-action:none;
}

.text-object{
  min-width:30px;
  min-height:20px;

  padding:2px 4px;

  white-space:pre;

  background:rgba(255,255,255,.04);

  overflow:hidden;

  line-height:1.15;
}

.image-object,
.qr-object{
  overflow:visible;
}

.text-object.selected,
.image-object.selected,
.qr-object.selected{
  outline:2px solid #e53232;
}

.image-object img,
.qr-object img{
  display:block;

  width:100%;
  height:100%;

  object-fit:contain;

  pointer-events:none;
}


/* =========================================================
   RESIZE HANDLE
========================================================= */

.resize-handle{
  position:absolute;

  width:13px;
  height:13px;

  right:-7px;
  bottom:-7px;

  background:#e53232;

  border:2px solid #fff;

  border-radius:50%;

  cursor:nwse-resize;

  z-index:20;
}


/* =========================================================
   TEXT TOOLBAR
========================================================= */

.text-toolbar{
  position:absolute;

  display:flex;

  align-items:center;

  gap:5px;

  padding:6px;

  background:#fff;

  border:1px solid #ddd;

  border-radius:9px;

  box-shadow:
    0 4px 15px rgba(0,0,0,.15);

  z-index:100;

  pointer-events:auto;

  max-width:calc(100% - 10px);

  flex-wrap:wrap;
}

.text-toolbar button,
.text-toolbar select,
.text-toolbar input{
  height:30px;

  border:1px solid #ddd;

  background:#fff;

  border-radius:6px;

  font-size:12px;

  cursor:pointer;
}

.text-toolbar button{
  min-width:30px;

  padding:0 7px;

  font-weight:700;
}

.text-toolbar select{
  padding:0 5px;

  max-width:105px;
}

.text-toolbar input[type="number"]{
  width:55px;

  padding:0 5px;
}

.text-toolbar button:hover{
  background:#f5f5f5;
}

.text-toolbar .delete-text-btn{
  color:#e53232;
}


/* =========================================================
   PAGE NUMBER
========================================================= */

.page-number{
  position:absolute;

  bottom:5px;
  left:8px;

  padding:2px 5px;

  border-radius:4px;

  background:rgba(255,255,255,.75);

  font-size:11px;

  color:#777;

  pointer-events:none;

  z-index:30;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message{
  width:100%;

  max-width:850px;

  min-height:250px;

  display:flex;

  align-items:center;

  justify-content:center;

  text-align:center;

  background:#fff;

  border:1px solid #ddd;

  border-radius:14px;

  color:#777;

  padding:30px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:3000;

  background:rgba(0,0,0,.55);

  align-items:center;

  justify-content:center;

  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  max-width:430px;

  background:#fff;

  border-radius:15px;

  padding:20px;

  box-shadow:
    0 15px 50px rgba(0,0,0,.25);
}

.modal-box h3{
  margin:0 0 18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;

  font-size:13px;

  font-weight:700;

  margin-bottom:6px;
}

.form-group input,
.form-group select{
  width:100%;

  padding:10px;

  border:1px solid #ddd;

  border-radius:8px;

  font-size:14px;
}

.modal-actions{
  display:flex;

  gap:8px;

  justify-content:flex-end;

  margin-top:18px;
}

.cancel-btn{
  background:#eee;

  border:0;

  padding:10px 15px;

  border-radius:8px;

  cursor:pointer;
}

.ok-btn{
  background:#e53232;

  color:#fff;

  border:0;

  padding:10px 18px;

  border-radius:8px;

  cursor:pointer;

  font-weight:700;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .hero{
    margin:12px 10px 0;
  }

  .hero h1{
    font-size:23px;
  }

  .toolbar{
    top:60px;
  }

}

@media(max-width:600px){

  .header-inner{
    min-height:60px;

    padding:8px 12px;
  }

  .logo{
    font-size:16px;
  }

  .logo-icon{
    width:32px;
    height:32px;

    font-size:12px;
  }

  .home-btn{
    padding:7px 10px;

    font-size:13px;
  }

  .hero{
    padding:18px 15px;

    border-radius:12px;
  }

  .hero h1{
    font-size:21px;
  }

  .hero p{
    font-size:13px;
  }

  .editor-wrapper{
    padding:0 8px;
  }

  .toolbar{
    top:58px;

    padding:8px;

    gap:6px;
  }

  .tool-btn{
    padding:8px 9px;

    font-size:12px;
  }

  .file-area{
    padding:20px 12px;
  }

  .text-toolbar{
    gap:4px;

    padding:5px;
  }

  .text-toolbar button,
  .text-toolbar select,
  .text-toolbar input{
    height:28px;

    font-size:11px;
  }

  .text-toolbar select{
    max-width:85px;
  }

  .text-toolbar input[type="number"]{
    width:48px;
  }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

  .header,
  .hero,
  .toolbar,
  .file-area,
  .status{
    display:none!important;
  }

}

</style>
</head>


<body>


<header class="header">

  <div class="header-inner">

    <a href="index.html" class="logo">

      <span class="logo-icon">
        PDF
      </span>

      <span>
        PDF Editor Tools
      </span>

    </a>


    <a href="index.html" class="home-btn">
      Home
    </a>

  </div>

</header>


<section class="hero">

  <h1>
    Free PDF Editor
  </h1>

  <p>
    Edit text, add images and QR codes, replace existing images and download your PDF.
  </p>

</section>


<main class="editor-wrapper">


<!-- =====================================================
     FILE AREA
===================================================== -->

<div class="file-area" id="dropArea">

  <div>
    <strong>
      Select your PDF file
    </strong>
  </div>

  <div style="margin-top:12px">

    <label
      for="pdfFile"
      class="file-label">

      Choose PDF

    </label>

    <input
      type="file"
      id="pdfFile"
      accept="application/pdf">

  </div>

  <div
    class="file-name"
    id="fileName">

</div>


<!-- =====================================================
     TOOLBAR
===================================================== -->

<div class="toolbar">

  <button
    class="tool-btn primary"
    id="addTextBtn">

    + Text

  </button>


  <button
    class="tool-btn"
    id="addImageBtn">

  <button
    class="tool-btn"
    id="replaceImageBtn">

    Replace Image

  </button>


  <button
    class="tool-btn"
    id="addQRBtn">

    + QR

  </button>


  <button
    class="tool-btn"
    id="replaceQRBtn">

    Replace QR

  </button>


  <button
    class="tool-btn"
    id="deleteBtn">

    Delete

  </button>


  <button

  <button

  </button>


  <button

    id="downloadBtn">

  </button>

</div>


<div
  class="status"
  id="status">
</div>


<!-- =====================================================
     PDF CONTAINER
===================================================== -->

<div
  class="pdf-container"
  id="pdfContainer">

  <div class="empty-message">

    Upload a PDF to start editing.

  </div>

</div>


</main>


<!-- =====================================================
     TEXT MODAL
===================================================== -->

<div
  class="modal"
  id="textModal">

  <div class="modal-box">

    <h3>
      Add Text
    </h3>


    <div class="form-group">

      <label>
        Text
      </label>

      <input
        type="text"
        id="textInput"
        placeholder="Enter text">

    </div>


    <div class="form-group">

      <label>
        Font Size
      </label>

      <input
        type="number"
        id="fontSizeInput"
        value="16"
        min="6"
        max="100">

    </div>


    <div class="form-group">

      <label>
        Font
      </label>

      <select id="fontFamilyInput">

        <option value="Helvetica">
          Helvetica
        </option>

        <option value="Times-Roman">
          Times
        </option>

        <option value="Courier">
          Courier
        </option>

      </select>

    </div>


    <div class="modal-actions">

      <button
        class="cancel-btn"
        id="textCancel">

        Cancel

      </button>


      <button
        class="ok-btn"
        id="textOk">

        Add Text

      </button>

    </div>

  </div>

</div>


<!-- =====================================================
     QR MODAL
===================================================== -->

<div
  class="modal"
  id="qrModal">

  <div class="modal-box">

    <h3 id="qrTitle">
      Add QR Code
    </h3>


    <div class="form-group">

      <label>
        QR Text / URL
      </label>

      <input
        type="text"
        id="qrInput"
        placeholder="Enter text or URL">

    </div>


    <div class="form-group">

      <label>
        Size
      </label>

      <input
        type="number"
        id="qrSizeInput"
        value="120"
        min="40"
        max="500">

    </div>


    <div class="modal-actions">

      <button
        class="cancel-btn"
        id="qrCancel">

        Cancel

      </button>


      <button
        class="ok-btn"
        id="qrOk">

        Add QR

      </button>

    </div>

  </div>

</div>


<script>


/* =========================================================
   PDF LIBRARIES
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";


const {
  PDFDocument,
  rgb,
  StandardFonts
} = PDFLib;


/* =========================================================
   GLOBAL
========================================================= */

let pdfBytes = null;

let pdfDocument = null;

let currentFile = null;


let existingTexts = [];

let existingImages = [];

let addedObjects = [];


let selectedObject = null;

let activePageNumber = 1;


let history = [];

let historyIndex = -1;


let objectCounter = 1;


let replaceQRMode = false;


/*
  PDF preview is rendered at 2x.
*/

const BASE_SCALE = 2;


/* =========================================================
   ELEMENTS
========================================================= */

const pdfFile =
document.getElementById("pdfFile");


const dropArea =
document.getElementById("dropArea");


const fileName =
document.getElementById("fileName");


const pdfContainer =
document.getElementById("pdfContainer");


const status =
document.getElementById("status");


const textModal =
document.getElementById("textModal");


const qrModal =
document.getElementById("qrModal");


const qrTitle =
document.getElementById("qrTitle");


const qrOk =
document.getElementById("qrOk");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){

  status.textContent =
    message;

}


/* =========================================================
   PDF FILE
========================================================= */

pdfFile.addEventListener(
  "change",
  function(e){

    const file =
      e.target.files[0];

    if(file){

      loadPDF(file);

    }

  }
);


/* =========================================================
   DRAG PDF
========================================================= */

dropArea.addEventListener(
  "dragover",
  function(e){

    e.preventDefault();

    dropArea.classList.add(
      "drag"
    );

  }
);


dropArea.addEventListener(
  "dragleave",
  function(){

    dropArea.classList.remove(
      "drag"
    );

  }
);


dropArea.addEventListener(
  "drop",
  function(e){

    e.preventDefault();

    dropArea.classList.remove(
      "drag"
    );


    const file =
      e.dataTransfer.files[0];


    if(
      file &&
      (
        file.type ===
        "application/pdf" ||
        file.name
          .toLowerCase()
          .endsWith(".pdf")
      )
    ){

      loadPDF(file);

    }
    else{

      alert(
        "Please select a PDF file."
      );

    }

  }
);


/* =========================================================
   LOAD PDF
========================================================= */

async function loadPDF(file){

  try{

    setStatus(
      "Loading PDF..."
    );


    currentFile =
      file;


    fileName.textContent =
      file.name;


    pdfBytes =
      await file.arrayBuffer();


    const loadingData =
      new Uint8Array(
        pdfBytes.slice(0)
      );


    pdfDocument =
      await pdfjsLib
        .getDocument({
          data:loadingData
        })
        .promise;


    existingTexts = [];

    existingImages = [];

    addedObjects = [];


    selectedObject = null;

    activePageNumber = 1;


    history = [];

    historyIndex = -1;


    objectCounter = 1;


    pdfContainer.innerHTML =
      "";


    for(
      let pageNumber = 1;
      pageNumber <=
      pdfDocument.numPages;
      pageNumber++
    ){

      await renderPage(
        pageNumber
      );

    }


    markActivePage();


    saveHistory();


    setStatus(
      pdfDocument.numPages +
      " page(s) loaded. Existing images can now be selected."
    );

  }
  catch(error){

    console.error(error);

    pdfDocument = null;

    setStatus(
      "Unable to load PDF."
    );

    alert(
      "PDF load nahi ho saka. Please valid PDF select karein."
    );

  }

}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(
  pageNumber
){

  const page =
    await pdfDocument.getPage(
      pageNumber
    );


  const baseViewport =
    page.getViewport({
      scale:1
    });


  const viewport =
    page.getViewport({
      scale:BASE_SCALE
    });


  const pageDiv =
    document.createElement(
      "div"
    );


  pageDiv.className =
    "pdf-page";


  pageDiv.dataset.page =
    pageNumber;


  pageDiv.dataset.pdfWidth =
    baseViewport.width;


  pageDiv.dataset.pdfHeight =
    baseViewport.height;


  pageDiv.style.aspectRatio =
    baseViewport.width +
    "/" +
    baseViewport.height;


  const canvas =
    document.createElement(
      "canvas"
    );


  canvas.className =
    "pdf-canvas";


  const context =
    canvas.getContext(
      "2d",
      {
        alpha:false
      }
    );


  const deviceScale =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );


  canvas.width =
    Math.floor(
      viewport.width *
      deviceScale
    );


  canvas.height =
    Math.floor(
      viewport.height *
      deviceScale
    );


  pageDiv.appendChild(
    canvas
  );


  const pageNumberEl =
    document.createElement(
      "div"
    );


  pageNumberEl.className =
    "page-number";


  pageNumberEl.textContent =
    "Page " +
    pageNumber;


  pageDiv.appendChild(
    pageNumberEl
  );


  const existingLayer =
    document.createElement(
      "div"
    );


  existingLayer.className =
    "existing-layer";


  pageDiv.appendChild(
    existingLayer
  );


  const objectLayer =
    document.createElement(
      "div"
    );


  objectLayer.className =
    "object-layer";


  pageDiv.appendChild(
    objectLayer
  );


  pdfContainer.appendChild(
    pageDiv
  );


  await page.render({

    canvasContext:
      context,

    viewport:
      viewport,

    transform:[
      deviceScale,
      0,
      0,
      deviceScale,
      0,
      0
    ]

  }).promise;


  await extractExistingText(
    page,
    pageDiv,
    existingLayer,
    viewport,
    pageNumber
  );


  await extractExistingImages(
  page,
  pageDiv,
  existingLayer,
  viewport,
  pageNumber
);


/* =====================================================
   RENDER EXISTING PDF IMAGES
   This creates the clickable image overlay
===================================================== */

existingImages
  .filter(
    item =>
      item.page === pageNumber
  )
  .forEach(
    item => {

      if(item.deleted){

        renderDeletedImageCover(
          item,
          pageDiv,
          existingLayer,
          viewport
        );

      }
      else{

        renderExistingImage(
          item,
          pageDiv,
          existingLayer,
          viewport
        );

      }

    }
  );


renderObjectsForPage(
  pageDiv,
  objectLayer,
  pageNumber
);


  pageDiv.addEventListener(
    "click",
    function(){

      activePageNumber =
        pageNumber;

      markActivePage();

    }
  );

}


/* =========================================================
   EXTRACT EXISTING TEXT
========================================================= */

async function extractExistingText(
  page,
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  const textContent =
    await page.getTextContent();


  textContent.items.forEach(
    function(item,index){

      if(!item.str){
        return;
      }


      const rawTransform =
        item.transform.slice();


      const textObject = {

        id:
          "existing-text-" +
          pageNumber +
          "-" +
          index,

        type:
          "existingText",

        page:
          pageNumber,

        text:
          item.str,

        originalText:
          item.str,

        originalTransform:
          rawTransform,

        x:
          rawTransform[4],

        y:
          rawTransform[5],

        width:
          Math.max(
            1,
            item.width || 1
          ),

        height:
          Math.max(
            1,
            Math.abs(
              rawTransform[3] ||
              rawTransform[2] ||
              10
            )
          ),

        fontSize:
          Math.max(
            1,
            Math.abs(
              rawTransform[3] ||
              rawTransform[2] ||
              10
            )
          ),

        fontName:
          item.fontName || "",

        deleted:
          false,

        edited:
          false

      };


      existingTexts.push(
        textObject
      );


      renderExistingTextItem(
        textObject,
        pageDiv,
        layer,
        viewport
      );

    }
  );

}


/* =========================================================
   EXTRACT EXISTING PDF IMAGES
========================================================= */

async function extractExistingImages(
  page,
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  try{

    const opList =
      await page.getOperatorList();


    let transform =
      [1,0,0,1,0,0];


    const transformStack =
      [];


    for(
      let i = 0;
      i < opList.fnArray.length;
      i++
    ){

      const fn =
        opList.fnArray[i];


      const args =
        opList.argsArray[i];


      if(
        fn ===
        pdfjsLib.OPS.save
      ){

        transformStack.push(
          transform.slice()
        );

      }


      else if(
        fn ===
        pdfjsLib.OPS.restore
      ){

        if(
          transformStack.length
        ){

          transform =
            transformStack.pop();

        }

      }


      else if(
        fn ===
        pdfjsLib.OPS.transform
      ){

        transform =
          multiplyMatrices(
            transform,
            args
          );

      }


      else if(
        fn ===
        pdfjsLib.OPS.paintImageXObject ||
        fn ===
        pdfjsLib.OPS.paintJpegXObject ||
        fn ===
        pdfjsLib.OPS.paintInlineImageXObject ||
        fn ===
        pdfjsLib.OPS.paintImageMaskXObject
      ){

        /*
          IMPORTANT:

          PDF coordinates are bottom-left.

          viewport.transform converts them
          into PDF.js top-left viewport
          coordinates.

          This fixes the old image Y-position
          problem.
        */

        const finalMatrix =
          multiplyMatrices(
            viewport.transform,
            transform
          );


        const p1 =
          transformPoint(
            finalMatrix,
            0,
            0
          );


        const p2 =
          transformPoint(
            finalMatrix,
            1,
            0
          );


        const p3 =
          transformPoint(
            finalMatrix,
            0,
            1
          );


        const p4 =
          transformPoint(
            finalMatrix,
            1,
            1
          );


        const xs = [
          p1[0],
          p2[0],
          p3[0],
          p4[0]
        ];


        const ys = [
          p1[1],
          p2[1],
          p3[1],
          p4[1]
        ];


        const minX =
          Math.min(
            ...xs
          );


        const maxX =
          Math.max(
            ...xs
          );


        const minY =
          Math.min(
            ...ys
          );


        const maxY =
          Math.max(
            ...ys
          );


        const width =
          maxX - minX;


        const height =
          maxY - minY;


        /*
          Ignore tiny invalid image objects.
        */

        if(
          width < 2 ||
          height < 2
        ){
          continue;
        }


        const image = {

          id:
            "existing-image-" +
            pageNumber +
            "-" +
            Date.now() +
            "-" +
            i,

          type:
            "existingImage",

          page:
            pageNumber,

          /*
            These values are stored
            in BASE_SCALE viewport pixels.
          */

          x:
            minX,

          y:
            minY,

          width:
            width,

          height:
            height,

          deleted:
            false,

          replaced:
            false,

          replacementSrc:
            null,

          replacementType:
            "image",

          replacementQRValue:
            "",

          imageName:
            args &&
            args[0]
              ? String(args[0])
              : ""

        };


        existingImages.push(
          image
        );

      }

    }

  }
  catch(error){

    console.error(
      "Existing image extraction error:",
      error
    );

  }

}


/* =========================================================
   MATRIX MULTIPLICATION
========================================================= */

function multiplyMatrices(
  m1,
  m2
){

  return [

    m1[0] * m2[0] +
    m1[2] * m2[1],

    m1[1] * m2[0] +
    m1[3] * m2[1],

    m1[0] * m2[2] +
    m1[2] * m2[3],

    m1[1] * m2[2] +
    m1[3] * m2[3],

    m1[0] * m2[4] +
    m1[2] * m2[5] +
    m1[4],

    m1[1] * m2[4] +
    m1[3] * m2[5] +
    m1[5]

  ];

}


/* =========================================================
   TRANSFORM POINT
========================================================= */

function transformPoint(
  matrix,
  x,
  y
){

  return [

    matrix[0] * x +
    matrix[2] * y +
    matrix[4],

    matrix[1] * x +
    matrix[3] * y +
    matrix[5]

  ];

}


/* =========================================================
   RENDER EXISTING TEXT
========================================================= */

function renderExistingTextItem(
  item,
  pageDiv,
  layer,
  viewport
){

  const tx =
    pdfjsLib.Util.transform(
      viewport.transform,
      item.originalTransform
    );


  const fontHeight =
    Math.sqrt(
      tx[2] * tx[2] +
      tx[3] * tx[3]
    );


  const cssScale =
    pageDiv.clientWidth /
    viewport.width;


  const span =
    document.createElement(
      "div"
    );


  span.className =
    "existing-text";


  span.dataset.existingId =
    item.id;


  span.textContent =
    item.text;


  span.style.left =
    (
      tx[4] *
      cssScale
    ) + "px";


  span.style.top =
    (
      (
        tx[5] -
        fontHeight * .9
      ) *
      cssScale
    ) + "px";


  span.style.width =
    Math.max(
      5,
      item.width *
      BASE_SCALE *
      cssScale
    ) + "px";


  span.style.height =
    Math.max(
      8,
      fontHeight *
      1.35 *
      cssScale
    ) + "px";


  span.style.fontSize =
    Math.max(
      6,
      fontHeight *
      cssScale
    ) + "px";


  if(item.edited){

    span.classList.add(
      "edited-visible"
    );

  }


  span.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      activePageNumber =
        item.page;

      selectExistingText(
        item
      );

    }
  );


  span.addEventListener(
    "dblclick",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      editExistingText(
        item
      );

    }
  );


  layer.appendChild(
    span
  );

}


/* =========================================================
   RENDER EXISTING IMAGE
========================================================= */

function renderExistingImage(
  item,
  pageDiv,
  layer,
  viewport
){

  if(
    !item ||
    item.deleted
  ){

    return;

  }


  const cssScale =
    pageDiv.clientWidth /
    viewport.width;


  const el =
    document.createElement(
      "div"
    );


  el.className =
    "existing-image";


  el.dataset.existingId =
    item.id;


  el.style.left =
    (
      item.x *
      cssScale
    ) + "px";


  el.style.top =
    (
      item.y *
      cssScale
    ) + "px";


  el.style.width =
    Math.max(
      4,
      item.width *
      cssScale
    ) + "px";


  el.style.height =
    Math.max(
      4,
      item.height *
      cssScale
    ) + "px";


  /*
    If replacement exists,
    show replacement image.

    Otherwise keep original PDF canvas
    visible underneath.
  */

  if(
    item.replacementSrc
  ){

    const img =
      document.createElement(
        "img"
      );


    img.src =
      item.replacementSrc;


    img.alt =
      "Replacement Image";


    el.appendChild(
      img
    );

  }


  el.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();

      activePageNumber =
        item.page;

      selectExistingImage(
        item
      );

    }
  );


  layer.appendChild(
    el
  );

}


/* =========================================================
   RENDER DELETED EXISTING IMAGE
========================================================= */

function renderDeletedImageCover(

  pageDiv,
  layer,

){

  const cssScale =
    pageDiv.clientWidth /

  const cover =

    ) + "px";


  cover.style.top =
    (

      cssScale
    ) + "px";


  cover.style.width =

      item.width *

    ) + "px";


  cover.style.height =
    Math.max(
      4,
      item.height *

    ) + "px";

========================================================= */

  };

}

   SELECT EXISTING IMAGE
========================================================= */

function selectExistingImage(
  obj
){

    type:
      "existingImage",

    id:
      obj.id

  };


  activePageNumber =
    obj.page;


  markActivePage();

}


/* =========================================================
   EDIT EXISTING TEXT
========================================================= */

function editExistingText(
  obj
){

  const newText =
    prompt(
      "Edit text:",
      obj.text
    );


  if(
    newText === null
  ){

    return;

  }


  if(
    newText === ""
  ){

    if(
      confirm(
        "Text delete karna hai?"
      )
    ){

      obj.deleted =
        true;

      obj.edited =
        true;


      selectedObject =
        null;


      refreshPageLayers();

      saveHistory();

    }

    return;

  }


  obj.text =
    newText;


  obj.deleted =
    false;


  obj.edited =
    true;


  selectedObject = {

    type:
      "existingText",

    id:
      obj.id

  };


  refreshPageLayers();

  saveHistory();

}


/* =========================================================
   REFRESH PAGE LAYERS
========================================================= */

async function refreshPageLayers(){

  if(
    !pdfDocument
  ){

    return;

  }


  document
    .querySelectorAll(
      ".existing-layer"
    )
    .forEach(
      layer =>
        layer.innerHTML = ""
    );


  document
    .querySelectorAll(
      ".object-layer"
    )
    .forEach(
      layer =>
        layer.innerHTML = ""
    );


  const pageDivs =
    Array.from(
      document.querySelectorAll(
        ".pdf-page"
      )
    );


  for(
    const pageDiv of pageDivs
  ){

    const pageNumber =
      Number(
        pageDiv.dataset.page
      );


    const existingLayer =
      pageDiv.querySelector(
        ".existing-layer"
      );


    const objectLayer =
      pageDiv.querySelector(
        ".object-layer"
      );


    const page =
      await pdfDocument.getPage(
        pageNumber
      );


    const viewport =
      page.getViewport({
        scale:BASE_SCALE
      });


    /*
      EXISTING TEXT
    */

    existingTexts
      .filter(
        item =>
          item.page ===
          pageNumber
      )
      .forEach(
        item => {

          if(
            item.deleted
          ){

            renderDeletedCover(
              item,
              pageDiv,
              existingLayer,
              viewport
            );

          }
          else{

            renderExistingTextItem(
              item,
              pageDiv,
              existingLayer,
              viewport
            );

          }

        }
      );


    /*
      EXISTING IMAGES
    */

    existingImages
      .filter(
        item =>
          item.page ===
          pageNumber
      )
      .forEach(
        item => {

          if(
            item.deleted
          ){

            renderDeletedImageCover(
              item,
              pageDiv,
              existingLayer,
              viewport
            );

          }
          else{

            renderExistingImage(
              item,
              pageDiv,
              existingLayer,
              viewport
            );

          }

        }
      );


    /*
      ADDED OBJECTS
    */

    renderObjectsForPage(
      pageDiv,
      objectLayer,
      pageNumber
    );

  }


  markActivePage();

  refreshSelection();

}


/* =========================================================
   DELETED TEXT COVER
========================================================= */

function renderDeletedCover(
  item,
  pageDiv,
  layer,
  viewport
){

  const cssScale =
    pageDiv.clientWidth /
    viewport.width;


  const tx =
    pdfjsLib.Util.transform(
      viewport.transform,
      item.originalTransform
    );


  const fontHeight =
    Math.sqrt(
      tx[2] * tx[2] +
      tx[3] * tx[3]
    );


  const cover =
    document.createElement(
      "div"
    );


  cover.className =
    "deleted-cover";


  cover.dataset.existingId =
    item.id;


  cover.style.left =
    (
      tx[4] *
      cssScale
    ) + "px";


  cover.style.top =
    (
      (
        tx[5] -
        fontHeight * 1.05
      ) *
      cssScale
    ) + "px";


  cover.style.width =
    Math.max(
      6,
      (
        item.width +
        item.fontSize * .2
      ) *
      BASE_SCALE *
      cssScale
    ) + "px";


  cover.style.height =
    (
      fontHeight *
      1.4 *
      cssScale
    ) + "px";


  cover.addEventListener(
    "click",
    function(e){

      e.stopPropagation();

      selectExistingText(
        item
      );

    }
  );


  layer.appendChild(
    cover
  );

}

/* =========================================================
   TEXT OK
========================================================= */

document
.getElementById("textOk")
.addEventListener(
  "click",
  function(){

    const text =
      document
        .getElementById(
          "textInput"
        )
        .value
        .trim();


    const fontSize =
      Number(
        document
          .getElementById(
            "fontSizeInput"
          )
          .value
      );


    const fontFamily =
      document
        .getElementById(
          "fontFamilyInput"
        )
        .value;


    if(!text){

      alert(
        "Text enter karein."
      );

      return;

    }


    if(
      !Number.isFinite(
        fontSize
      ) ||
      fontSize < 6
    ){

      alert(
        "Valid font size enter karein."
      );

      return;

    }


    const pageDiv =
      document.querySelector(
        '.pdf-page[data-page="' +
        activePageNumber +
        '"]'
      );


    if(!pageDiv){

      alert(
        "PDF page available nahi hai."
      );

      return;

    }


    const pdfWidth =
      Number(
        pageDiv.dataset.pdfWidth
      );


    const pdfHeight =
      Number(
        pageDiv.dataset.pdfHeight
      );


    const estimatedWidth =
      Math.max(
        .12,
        Math.min(
          .75,
          (
            text.length *
            fontSize *
            .52
          ) /
          pdfWidth
        )
      );


    const estimatedHeight =
      Math.max(
        .035,
        Math.min(
          .15,
          (
            fontSize *
            1.5
          ) /
          pdfHeight
        )
      );


    const obj = {

      id:
        "text-" +
        objectCounter++,

      type:
        "text",

      page:
        activePageNumber,

      text:
        text,

      fontSize:
        fontSize,

      fontFamily:
        fontFamily,

      xRatio:
        .08,

      yRatio:
        .08,

      widthRatio:
        estimatedWidth,

      heightRatio:
        estimatedHeight

    };


    addedObjects.push(
      obj
    );


    textModal.classList.remove(
      "show"
    );


    document
      .getElementById(
        "textInput"
      )
      .value = "";


    renderAllObjects();

    selectObject(obj);

    saveHistory();

  }
);

              type:

              page:

              src:
                reader.result,

              xRatio:

              yRatio:

              widthRatio:
                .25,

              heightRatio:
                .20

            };


            addedObjects.push(
              obj
            );

            selectObject(obj);

            saveHistory();

          };


        reader.readAsDataURL(
          file
        );

      };


    input.click();

  }
);


/* =========================================================
   REPLACE IMAGE
========================================================= */

document
.getElementById("replaceImageBtn")
.addEventListener(
  "click",
  function(){

    if(
      !selectedObject ||
      (
        selectedObject.type !==
        "image" &&
        selectedObject.type !==
        "existingImage"
      )
    ){

      alert(
        "Pehle image select karein."
      );

      return;

    }


    const input =
      document.createElement(
        "input"
      );


    input.type =
      "file";


    input.accept =
      "image/png,image/jpeg,image/jpg";


    input.onchange =
      function(){

        const file =
          input.files[0];


        if(!file){
          return;
        }


        const reader =
          new FileReader();


        reader.onload =
          function(){

            /*
              EXISTING PDF IMAGE
            */

            if(
              selectedObject.type ===
              "existingImage"
            ){

              const existing =
                existingImages.find(
                  x =>
                    x.id ===
                    selectedObject.id
                );


              if(!existing){

                return;

              }


              existing.replaced =
                true;


              /*
                Keep original image
                covered by replacement.
              */

              existing.deleted =
                false;


              existing.replacementSrc =
                reader.result;


              existing.replacementType =
                "image";


              existing.replacementQRValue =
                "";


              selectedObject = {

                type:
                  "existingImage",

                id:
                  existing.id

              };


              refreshPageLayers();

              refreshSelection();

              saveHistory();

              return;

            }


            /*
              ADDED IMAGE
            */

            const obj =
              addedObjects.find(
                x =>
                  x.id ===
                  selectedObject.id
              );


            if(!obj){

              return;

            }


            obj.src =
              reader.result;


            renderAllObjects();

            selectObject(obj);

            saveHistory();

          };


        reader.readAsDataURL(
          file
        );

      };


    input.click();

  }
);

document
.getElementById("replaceQRBtn")
.addEventListener(

/* =========================================================
   QR OK
========================================================= */

qrOk.addEventListener(
  "click",
  async function(){

    const value =
      document
        .getElementById(
          "qrInput"
        )
        .value
        .trim();


    const size =
      Number(
        document
          .getElementById(
            "qrSizeInput"
          )
          .value
      );


    if(!value){

      alert(
        "QR text ya URL enter karein."
      );

      return;

    }


    if(
      !Number.isFinite(size) ||
      size < 40
    ){

      alert(
        "Valid QR size enter karein."
      );

      return;

    }


    try{

      const src =
await QRCode.toDataURL(
value,
{
width:size,
margin:1,
errorCorrectionLevel:"M",
type:"image/png"
}
);

      /*
        REPLACE EXISTING PDF IMAGE
        WITH QR
      */

      if(
        replaceQRMode &&
        selectedObject &&
        selectedObject.type ===
        "existingImage"
      ){

        const existing =
          existingImages.find(
            x =>
              x.id ===
              selectedObject.id
          );


        if(existing){

          existing.replaced =
            true;


          existing.deleted =
            false;


          existing.replacementSrc =
            src;


          existing.replacementType =
            "qr";


          existing.replacementQRValue =
            value;


          selectedObject = {

            type:
              "existingImage",

            id:
              existing.id

          };


          refreshPageLayers();

          refreshSelection();

          saveHistory();

        }

      }


      /*
        REPLACE ADDED QR
      */

      else if(
        replaceQRMode
      ){

        const obj =
          addedObjects.find(
            x =>
              x.id ===
              selectedObject.id
          );


        if(obj){

          obj.src =
            src;


          obj.value =
            value;


          renderAllObjects();

          selectObject(obj);

          saveHistory();

        }

      }


      /*
        ADD NEW QR
      */

      else{

        const obj = {

          id:
            "qr-" +
            objectCounter++,

          type:
            "qr",

          page:
            activePageNumber,

          src:
            src,

          value:
            value,

          xRatio:
            .08,

          yRatio:
            .15,

          widthRatio:
            .20,

          heightRatio:
            .20

        };


        addedObjects.push(
          obj
        );


        renderAllObjects();

        selectObject(obj);

        saveHistory();

      }


      replaceQRMode =
        false;


      qrModal.classList.remove(
        "show"
      );

    }
    catch(error){

      console.error(error);

      alert(
        "QR create nahi ho saka."
      );

    }

  }
);


/* =========================================================
   RENDER ALL OBJECTS
========================================================= */

function renderAllObjects(){

  document
    .querySelectorAll(
      ".object-layer"
    )
    .forEach(
      layer =>
        layer.innerHTML = ""
    );


  addedObjects.forEach(
    function(obj){

      const page =
        document.querySelector(
          '.pdf-page[data-page="' +
          obj.page +
          '"]'
        );


      if(!page){
        return;
      }


      const layer =
        page.querySelector(
          ".object-layer"
        );


      renderSingleObject(
        obj,
        page,
        layer
      );

    }
  );


  refreshSelection();

}


/* =========================================================
   RENDER OBJECTS FOR PAGE
========================================================= */

function renderObjectsForPage(
  pageDiv,
  layer,
  pageNumber
){

  addedObjects
    .filter(
      obj =>
        obj.page ===
        pageNumber
    )
    .forEach(
      obj =>
        renderSingleObject(
          obj,
          pageDiv,
          layer
        )
    );

}


/* =========================================================
   RENDER SINGLE OBJECT
========================================================= */

function renderSingleObject(
  obj,
  pageDiv,
  layer
){

  const width =
    pageDiv.clientWidth;


  const height =
    pageDiv.clientHeight;


  if(
    width <= 0 ||
    height <= 0
  ){

    return;

  }


  obj.xRatio =
    clamp(
      obj.xRatio,
      0,
      Math.max(
        0,
        1 - obj.widthRatio
      )
    );


  obj.yRatio =
    clamp(
      obj.yRatio,
      0,
      Math.max(
        0,
        1 - obj.heightRatio
      )
    );


  const element =
    document.createElement(
      "div"
    );


  element.className =
    "editor-object";


  element.dataset.id =
    obj.id;


  element.style.left =
    (
      obj.xRatio *
      width
    ) + "px";


  element.style.top =
    (
      obj.yRatio *
      height
    ) + "px";


  element.style.width =
    (
      obj.widthRatio *
      width
    ) + "px";


  element.style.height =
    (
      obj.heightRatio *
      height
    ) + "px";


  /*
    TEXT
  */

  if(
    obj.type ===
    "text"
  ){

    element.classList.add(
      "text-object"
    );


    element.textContent =
      obj.text;


    const pdfWidth =
      Number(
        pageDiv.dataset.pdfWidth
      );


    const cssScale =
      width /
      pdfWidth;


    element.style.fontSize =
      Math.max(
        6,
        obj.fontSize *
        cssScale
      ) + "px";


    element.style.fontFamily =
      getCssFont(
        obj.fontFamily
      );


    element.style.color =
      "#000";

  }


  /*
    IMAGE / QR
  */

  if(
    obj.type === "image" ||
    obj.type === "qr"
  ){

    element.classList.add(
      obj.type === "image"
        ? "image-object"
        : "qr-object"
    );


    const img =
      document.createElement(
        "img"
      );


    img.src =
      obj.src;


    img.alt =
      obj.type === "qr"
        ? "QR Code"
        : "Added Image";


    element.appendChild(
      img
    );

  }


  const handle =
    document.createElement(
      "div"
    );


  handle.className =
    "resize-handle";


  element.appendChild(
    handle
  );


  layer.appendChild(
    element
  );


  enableDrag(
    element,
    obj,
    pageDiv
  );


  enableResize(
    handle,
    element,
    obj,
    pageDiv
  );


  element.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "resize-handle"
        )
      ){

        return;

      }


      e.stopPropagation();


      activePageNumber =
        obj.page;


      markActivePage();


      selectObject(
        obj
      );

    }
  );

}


/* =========================================================
   FONT
========================================================= */

function getCssFont(
  font
){

  if(
    font ===
    "Times-Roman"
  ){

    return "Times New Roman";

  }


  if(
    font ===
    "Courier"
  ){

    return "Courier New";

  }


  return "Arial";

}


/* =========================================================
   TEXT TOOLBAR
========================================================= */

function removeTextToolbar(
  pageDiv
){

  const oldToolbar =
    pageDiv.querySelector(
      ".text-toolbar"
    );


  if(oldToolbar){

    oldToolbar.remove();

  }

}


function createTextToolbar(
  obj,
  pageDiv,
  element
){

  removeTextToolbar(
    pageDiv
  );


  const toolbar =
    document.createElement(
      "div"
    );


  toolbar.className =
    "text-toolbar";


  const editBtn =
    document.createElement(
      "button"
    );


  editBtn.type =
    "button";


  editBtn.textContent =
    "Edit";


  const sizeInput =
    document.createElement(
      "input"
    );


  sizeInput.type =
    "number";


  sizeInput.min =
    "6";


  sizeInput.max =
    "100";


  sizeInput.value =
    obj.fontSize;


  const fontSelect =
    document.createElement(
      "select"
    );


  fontSelect.innerHTML = `

    <option value="Helvetica">
      Helvetica
    </option>

    <option value="Times-Roman">
      Times
    </option>

    <option value="Courier">
      Courier
    </option>

  `;


  fontSelect.value =
    obj.fontFamily;


  const deleteBtn =
    document.createElement(
      "button"
    );


  deleteBtn.type =
    "button";


  deleteBtn.textContent =
    "Delete";


  deleteBtn.className =
    "delete-text-btn";


  toolbar.appendChild(
    editBtn
  );


  toolbar.appendChild(
    sizeInput
  );


  toolbar.appendChild(
    fontSelect
  );


  toolbar.appendChild(
    deleteBtn
  );


  pageDiv
    .querySelector(
      ".object-layer"
    )
    .appendChild(
      toolbar
    );


  function positionToolbar(){

    const pageWidth =
      pageDiv.clientWidth;


    const pageHeight =
      pageDiv.clientHeight;


    const objectLeft =
      obj.xRatio *
      pageWidth;


    const objectTop =
      obj.yRatio *
      pageHeight;


    const objectBottom =
      objectTop +
      (
        obj.heightRatio *
        pageHeight
      );


    const toolbarWidth =
      toolbar.offsetWidth;


    const toolbarHeight =
      toolbar.offsetHeight;


    let left =
      objectLeft;


    let top =
      objectTop -
      toolbarHeight -
      8;


    if(
      top < 5
    ){

      top =
        objectBottom +
        8;

    }


    if(
      left +
      toolbarWidth >
      pageWidth - 5
    ){

      left =
        pageWidth -
        toolbarWidth -
        5;

    }


    if(
      left < 5
    ){

      left = 5;

    }


    if(
      top +
      toolbarHeight >
      pageHeight - 5
    ){

      top =
        pageHeight -
        toolbarHeight -
        5;

    }


    if(
      top < 5
    ){

      top = 5;

    }


    toolbar.style.left =
      left + "px";


    toolbar.style.top =
      top + "px";

  }


  editBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      const newText =
        prompt(
          "Edit text:",
          obj.text
        );


      if(
        newText === null
      ){

        return;

      }


      if(
        !newText.trim()
      ){

        alert(
          "Text empty nahi ho sakta."
        );

        return;

      }


      obj.text =
        newText.trim();


      renderAllObjects();

      selectObject(obj);

      saveHistory();

    }
  );


  sizeInput.addEventListener(
    "change",
    function(e){

      e.stopPropagation();


      const value =
        Number(
          this.value
        );


      if(
        !Number.isFinite(value) ||
        value < 6
      ){

        this.value =
          obj.fontSize;

        return;

      }


      obj.fontSize =
        Math.min(
          100,
          value
        );


      renderAllObjects();

      selectObject(obj);

      saveHistory();

    }
  );


  fontSelect.addEventListener(
    "change",
    function(e){

      e.stopPropagation();


      obj.fontFamily =
        this.value;


      renderAllObjects();

      selectObject(obj);

      saveHistory();

    }
  );


  deleteBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      addedObjects =
        addedObjects.filter(
          x =>
            x.id !==
            obj.id
        );


      selectedObject =
        null;


      renderAllObjects();

      saveHistory();

    }
  );


  requestAnimationFrame(
    positionToolbar
  );


  return {

    toolbar,
    positionToolbar

  };

}


/* =========================================================
   SELECT ADDED OBJECT
========================================================= */

function selectObject(
  obj
){

  selectedObject =
    obj;


  activePageNumber =
    obj.page;


  markActivePage();

  refreshSelection();


  if(
    obj.type ===
    "text"
  ){

    requestAnimationFrame(
      function(){

        const pageDiv =
          document.querySelector(
            '.pdf-page[data-page="' +
            obj.page +
            '"]'
          );


        if(!pageDiv){
          return;
        }


        const element =
          pageDiv.querySelector(
            '[data-id="' +
            obj.id +
            '"]'
          );


        if(!element){
          return;
        }


        createTextToolbar(
          obj,
          pageDiv,
          element
        );

      }
    );

  }

}


/* =========================================================
   REFRESH SELECTION
========================================================= */

function refreshSelection(){

  document
    .querySelectorAll(
      ".editor-object"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  document
    .querySelectorAll(
      ".existing-text"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  document
    .querySelectorAll(
      ".existing-image"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  document
    .querySelectorAll(
      ".deleted-image"
    )
    .forEach(
      el =>
        el.classList.remove(
          "selected"
        )
    );


  if(
    !selectedObject
  ){

    return;

  }


  /*
    EXISTING TEXT
  */

  if(
    selectedObject.type ===
    "existingText"
  ){

    const el =
      document.querySelector(
        '[data-existing-id="' +
        selectedObject.id +
        '"]'
      );


    if(el){

      el.classList.add(
        "selected"
      );

    }


    return;

  }


  /*
    EXISTING IMAGE
  */

  if(
    selectedObject.type ===
    "existingImage"
  ){

    const el =
  document.querySelector(
    '[data-existing-id="' +
    selectedObject.id +
    '"]'
  );


    if(el){

      el.classList.add(
        "selected"
      );

    }


    return;

  }


  /*
    ADDED OBJECT
  */

  const el =
    document.querySelector(
      '[data-id="' +
      selectedObject.id +
      '"]'
    );


  if(el){

    el.classList.add(
      "selected"
    );

  }

}


/* =========================================================
   ACTIVE PAGE
========================================================= */

function markActivePage(){

  document
    .querySelectorAll(
      ".pdf-page"
    )
    .forEach(
      page => {

        page.classList.toggle(
          "active-page",
          Number(
            page.dataset.page
          ) ===
          activePageNumber
        );

      }
    );

}


/* =========================================================
   DRAG OBJECT
========================================================= */

function enableDrag(
  element,
  obj,
  pageDiv
){

  let dragging =
    false;


  let startX =
    0;


  let startY =
    0;


  let originalX =
    0;


  let originalY =
    0;


  element.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "resize-handle"
        )
      ){

        return;

      }


      e.preventDefault();

      e.stopPropagation();


      dragging =
        true;


      startX =
        e.clientX;


      startY =
        e.clientY;


      originalX =
        obj.xRatio;


      originalY =
        obj.yRatio;


      try{

        element.setPointerCapture(
          e.pointerId
        );

      }
      catch(err){}

    }
  );


  element.addEventListener(
    "pointermove",
    function(e){

      if(!dragging){
        return;
      }


      const dx =
        e.clientX -
        startX;


      const dy =
        e.clientY -
        startY;


      obj.xRatio =
        originalX +
        dx /
        pageDiv.clientWidth;


      obj.yRatio =
        originalY +
        dy /
        pageDiv.clientHeight;


      obj.xRatio =
        clamp(
          obj.xRatio,
          0,
          Math.max(
            0,
            1 -
            obj.widthRatio
          )
        );


      obj.yRatio =
        clamp(
          obj.yRatio,
          0,
          Math.max(
            0,
            1 -
            obj.heightRatio
          )
        );


      element.style.left =
        (
          obj.xRatio *
          pageDiv.clientWidth
        ) + "px";


      element.style.top =
        (
          obj.yRatio *
          pageDiv.clientHeight
        ) + "px";

    }
  );


  function finishDrag(){

    if(!dragging){

      return;

    }


    dragging =
      false;


    saveHistory();

  }


  element.addEventListener(
    "pointerup",
    finishDrag
  );


  element.addEventListener(
    "pointercancel",
    finishDrag
  );

}


/* =========================================================
   RESIZE OBJECT
========================================================= */

function enableResize(
  handle,
  element,
  obj,
  pageDiv
){

  let resizing =
    false;


  let startX =
    0;


  let startY =
    0;


  let originalWidth =
    0;


  let originalHeight =
    0;


  handle.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      e.stopPropagation();


      resizing =
        true;


      startX =
        e.clientX;


      startY =
        e.clientY;


      originalWidth =
        obj.widthRatio;


      originalHeight =
        obj.heightRatio;


      try{

        handle.setPointerCapture(
          e.pointerId
        );

      }
      catch(err){}

    }
  );


  handle.addEventListener(
    "pointermove",
    function(e){

      if(!resizing){
        return;
      }


      const dx =
        e.clientX -
        startX;


      const dy =
        e.clientY -
        startY;


      obj.widthRatio =
        Math.max(
          .02,
          originalWidth +
          dx /
          pageDiv.clientWidth
        );


      obj.heightRatio =
        Math.max(
          .02,
          originalHeight +
          dy /
          pageDiv.clientHeight
        );


      obj.widthRatio =
        Math.min(
          obj.widthRatio,
          1 -
          obj.xRatio
        );


      obj.heightRatio =
        Math.min(
          obj.heightRatio,
          1 -
          obj.yRatio
        );


      element.style.width =
        (
          obj.widthRatio *
          pageDiv.clientWidth
        ) + "px";


      element.style.height =
        (
          obj.heightRatio *
          pageDiv.clientHeight
        ) + "px";

    }
  );


  function finishResize(){

    if(!resizing){
      return;
    }


    resizing =
      false;


    saveHistory();

  }


  handle.addEventListener(
    "pointerup",
    finishResize
  );


  handle.addEventListener(
    "pointercancel",
    finishResize
  );

}


/* =========================================================
   DELETE
========================================================= */

document
.getElementById("deleteBtn")
.addEventListener(
  "click",
  function(){

    if(
      !selectedObject
    ){

      alert(
        "Pehle koi text, image ya QR select karein."
      );

      return;

    }


    /*
      EXISTING TEXT
    */

    if(
      selectedObject.type ===
      "existingText"
    ){

      const obj =
        existingTexts.find(
          x =>
            x.id ===
            selectedObject.id
        );


      if(obj){

        obj.deleted =
          true;

        obj.edited =
          true;

      }

    }


    /*
      EXISTING IMAGE / QR
    */

    else if(
      selectedObject.type ===
      "existingImage"
    ){

      const obj =
        existingImages.find(
          x =>
            x.id ===
            selectedObject.id
        );


      if(obj){

        obj.deleted =
          true;


        obj.replaced =
          false;


        obj.replacementSrc =
          null;


        obj.replacementType =
          "image";


        obj.replacementQRValue =
          "";

      }

    }


    /*
      ADDED IMAGE / QR / TEXT
    */

    else{

      addedObjects =
        addedObjects.filter(
          x =>
            x.id !==
            selectedObject.id
        );

    }


    selectedObject =
      null;


    refreshPageLayers();

    saveHistory();

  }
);

/* =========================================================
   HISTORY
========================================================= */

function createState(){

  return JSON.stringify({

    existingTexts:
      existingTexts,

    existingImages:
      existingImages,

    addedObjects:
      addedObjects

  });

}


function restoreState(
  state
){

  try{

    const data =
      JSON.parse(
        state
      );


    existingTexts =
      data.existingTexts ||
      [];


    existingImages =
      data.existingImages ||
      [];


    addedObjects =
      data.addedObjects ||
      [];


    selectedObject =
      null;


    refreshPageLayers();

  }
  catch(error){

    console.error(
      error
    );

  }

}


function saveHistory(){

  const state =
    createState();


  if(
    historyIndex >= 0 &&
    history[
      historyIndex
    ] === state
  ){

    return;

  }


  history =
    history.slice(
      0,
      historyIndex + 1
    );


  history.push(
    state
  );


  historyIndex =
    history.length - 1;


  if(
    history.length > 30
  ){

    history.shift();

    historyIndex--;

  }

}


/* =========================================================
   UNDO
========================================================= */

document
.getElementById("undoBtn")
.addEventListener(
  "click",
  function(){

    if(
      historyIndex <= 0
    ){

      return;

    }


    historyIndex--;


    restoreState(
      history[
        historyIndex
      ]
    );

  }
);


/* =========================================================
   REDO
========================================================= */

document
.getElementById("redoBtn")
.addEventListener(
  "click",
  function(){

    if(
      historyIndex >=
      history.length - 1
    ){

      return;

    }


    historyIndex++;


    restoreState(
      history[
        historyIndex
      ]
    );

  }
);


/* =========================================================
   DOWNLOAD PDF
========================================================= */

document
.getElementById("downloadBtn")
.addEventListener(
  "click",
  async function(){

    if(
      !pdfBytes
    ){

      alert(
        "Pehle PDF upload karein."
      );

      return;

    }


    try{

      setStatus(
        "Creating PDF..."
      );


      const pdfDoc =
        await PDFDocument.load(
          new Uint8Array(
            pdfBytes.slice(0)
          )
        );


      const pdfPages =
        pdfDoc.getPages();


      const fontCache =
        {};


      async function getFont(
        fontFamily
      ){

        if(
          fontCache[
            fontFamily
          ]
        ){

          return fontCache[
            fontFamily
          ];

        }


        let standardFont =
          StandardFonts.Helvetica;


        if(
          fontFamily ===
          "Times-Roman"
        ){

          standardFont =
            StandardFonts.TimesRoman;

        }
        else if(
          fontFamily ===
          "Courier"
        ){

          standardFont =
            StandardFonts.Courier;

        }


        fontCache[
          fontFamily
        ] =
          await pdfDoc.embedFont(
            standardFont
          );


        return fontCache[
          fontFamily
        ];

      }


      /* =================================================
         EXISTING TEXT EDITS
      ================================================= */

      for(
        const item of existingTexts
      ){

        if(
          !item.edited
        ){

          continue;

        }


        const page =
          pdfPages[
            item.page - 1
          ];


        if(!page){
          continue;
        }


        const fontSize =
          Math.max(
            1,
            item.fontSize
          );


        const x =
          item.x;


        const baselineY =
          item.y;


        const estimatedNewWidth =
          item.deleted
            ? 0
            : Math.max(
                item.width,
                item.text.length *
                fontSize *
                .48
              );


        const coverWidth =
          Math.max(
            item.width,
            estimatedNewWidth
          ) +
          fontSize * .35;


        const coverHeight =
          fontSize * 1.35;


        const coverY =
          baselineY -
          fontSize * .30;


        page.drawRectangle({

          x:
            Math.max(
              0,
              x -
              fontSize * .10
            ),

          y:
            Math.max(
              0,
              coverY
            ),

          width:
            coverWidth,

          height:
            coverHeight,

          color:
            rgb(
              1,
              1,
              1
            )

        });


        if(
          item.deleted
        ){

          continue;

        }


        const font =
          await getFont(
            "Helvetica"
          );


        page.drawText(
          item.text,
          {

            x:
              x,

            y:
              baselineY,

            size:
              fontSize,

            font:
              font,

            color:
              rgb(
                0,
                0,
                0
              )

          }
        );

      }


      /* =================================================
         EXISTING IMAGE DELETE / REPLACE
      ================================================= */

      for(
        const item of existingImages
      ){

        if(
          !item.deleted &&
          !item.replacementSrc
        ){

          continue;

        }


        const page =
          pdfPages[
            item.page - 1
          ];


        if(!page){
          continue;
        }


        const pageWidth =
          page.getWidth();


        const pageHeight =
          page.getHeight();


        /*
          Stored in BASE_SCALE viewport pixels.

          Convert back to PDF points.
        */

        const pdfX =
          item.x /
          BASE_SCALE;


        const pdfWidth =
          item.width /
          BASE_SCALE;


        const pdfHeight =
          item.height /
          BASE_SCALE;


        /*
          Convert top-left viewport
          to bottom-left PDF coordinates.
        */

        const pdfY =
          pageHeight -
          (
            item.y /
            BASE_SCALE
          ) -
          pdfHeight;


        /*
          Cover original image.
        */

        page.drawRectangle({

          x:
            Math.max(
              0,
              Math.min(
                pdfX,
                pageWidth
              )
            ),

          y:
            Math.max(
              0,
              Math.min(
                pdfY,
                pageHeight
              )
            ),

          width:
            Math.min(
              pdfWidth,
              pageWidth -
              Math.max(
                0,
                pdfX
              )
            ),

          height:
            Math.min(
              pdfHeight,
              pageHeight -
              Math.max(
                0,
                pdfY
              )
            ),

          color:
            rgb(
              1,
              1,
              1
            )

        });


        /*
          If deleted only:
          white cover remains.
        */

        if(
          item.deleted ||
          !item.replacementSrc
        ){

          continue;

        }


        /*
          Draw replacement image.
        */

        const imageBytes =
          dataURLToUint8Array(
            item.replacementSrc
          );


        let image;


        const lowerSrc =
          item.replacementSrc
            .toLowerCase();


        if(
          lowerSrc.startsWith(
            "data:image/jpeg"
          ) ||
          lowerSrc.startsWith(
            "data:image/jpg"
          )
        ){

          image =
            await pdfDoc.embedJpg(
              imageBytes
            );

        }
        else{

          image =
            await pdfDoc.embedPng(
              imageBytes
            );

        }


        page.drawImage(
          image,
          {

            x:
              pdfX,

            y:
              pdfY,

            width:
              pdfWidth,

            height:
              pdfHeight

          }
        );

      }


      /* =================================================
         ADDED OBJECTS
      ================================================= */

      for(
        const obj of addedObjects
      ){

        const page =
          pdfPages[
            obj.page - 1
          ];


        if(!page){
          continue;
        }


        const pageWidth =
          page.getWidth();


        const pageHeight =
          page.getHeight();


        const x =
          clamp(
            obj.xRatio,
            0,
            1
          ) *
          pageWidth;


        const width =
          clamp(
            obj.widthRatio,
            .001,
            1
          ) *
          pageWidth;


        const height =
          clamp(
            obj.heightRatio,
            .001,
            1
          ) *
          pageHeight;


        const top =
          clamp(
            obj.yRatio,
            0,
            1
          ) *
          pageHeight;


        const y =
          pageHeight -
          top -
          height;


        /*
          ADDED TEXT
        */

        if(
          obj.type ===
          "text"
        ){

          const font =
            await getFont(
              obj.fontFamily
            );


          const textY =
            y +
            height -
            obj.fontSize;


          page.drawText(
            obj.text,
            {

              x:
                x,

              y:
                textY,

              size:
                obj.fontSize,

              font:
                font,

              color:
                rgb(
                  0,
                  0,
                  0
                )

            }
          );

        }


        /*
          ADDED IMAGE / QR
        */

        if(
          obj.type === "image" ||
          obj.type === "qr"
        ){

          const imageBytes =
            dataURLToUint8Array(
              obj.src
            );


          let image;


          const lowerSrc =
            obj.src.toLowerCase();


          if(
            lowerSrc.startsWith(
              "data:image/jpeg"
            ) ||
            lowerSrc.startsWith(
              "data:image/jpg"
            )
          ){

            image =
              await pdfDoc.embedJpg(
                imageBytes
              );

          }
          else{

            image =
              await pdfDoc.embedPng(
                imageBytes
              );

          }


          page.drawImage(
            image,
            {

              x:
                x,

              y:
                y,

              width:
                width,

              height:
                height

            }
          );

        }

      }


      const output =
        await pdfDoc.save();


      const blob =
        new Blob(
          [output],
          {
            type:
              "application/pdf"
          }
        );


      const url =
        URL.createObjectURL(
          blob
        );


      const a =
        document.createElement(
          "a"
        );


      a.href =
        url;


      a.download =
        currentFile
          ? currentFile.name.replace(
              /\.pdf$/i,
              ""
            ) +
            "-edited.pdf"
          : "edited-pdf.pdf";


      document.body.appendChild(
        a
      );


      a.click();


      a.remove();


      setTimeout(
        function(){

          URL.revokeObjectURL(
            url
          );

        },
        1500
      );


      setStatus(
        "PDF downloaded successfully."
      );

    }
    catch(error){

      console.error(
        "PDF DOWNLOAD ERROR:",
        error
      );


      setStatus(
        "PDF download failed."
      );


      alert(
        "PDF download karte waqt error aaya. Console mein error check kiya ja sakta hai."
      );

    }

  }
);


/* =========================================================
   DATA URL
========================================================= */

function dataURLToUint8Array(
  dataURL
){

  const parts =
    dataURL.split(",");


  if(
    parts.length < 2
  ){

    throw new Error(
      "Invalid image data."
    );

  }


  const base64 =
    parts[1];


  const binary =
    atob(base64);


  const bytes =
    new Uint8Array(
      binary.length
    );


  for(
    let i = 0;
    i < binary.length;
    i++
  ){

    bytes[i] =
      binary.charCodeAt(i);

  }


  return bytes;

}


/* =========================================================
   CLAMP
========================================================= */

function clamp(
  value,
  min,
  max
){

  return Math.max(
    min,
    Math.min(
      max,
      value
    )
  );

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

let resizeTimer =
  null;


window.addEventListener(
  "resize",
  function(){

    clearTimeout(
      resizeTimer
    );


    resizeTimer =
      setTimeout(
        async function(){

          if(
            !pdfDocument
          ){

            return;

          }


          await refreshPageLayers();

        },
        250
      );

  }
);


/* =========================================================
   KEYBOARD DELETE
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    const tag =
      document.activeElement
        ? document.activeElement.tagName
        : "";


    if(
      tag === "INPUT" ||
      tag === "SELECT" ||
      tag === "TEXTAREA"
    ){

      return;

    }


    if(
      e.key === "Delete"
    ){

      if(
        selectedObject
      ){

        document
          .getElementById(
            "deleteBtn"
          )
          .click();

      }

    }

  }
);


/* =========================================================
   ESCAPE MODAL
========================================================= */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key !== "Escape"
    ){

      return;

    }


    textModal.classList.remove(
      "show"
    );


    qrModal.classList.remove(
      "show"
    );


    replaceQRMode =
      false;

  }
);


/* =========================================================
   INITIAL
========================================================= */

setStatus(
  "Ready. Select a PDF to begin."
);

</script>
