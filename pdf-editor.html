<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Free PDF Editor - Edit PDF Online</title>

<meta name="description"
content="Free online PDF editor. Edit PDF text, add images and QR codes and download your edited PDF.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f8fc;
  color:#222;
}

/* =========================================================
   DEVANAGARI FONT
========================================================= */

@font-face{
  font-family:"Noto Sans Devanagari";
  src:url("https://cdn.jsdelivr.net/gh/notofonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf")
      format("truetype");
  font-display:swap;
}


/* =========================================================
   HEADER
========================================================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:#fff;
  border-bottom:1px solid #e8e8e8;
  box-shadow:0 2px 10px rgba(0,0,0,.05);
}

.header-inner{
  max-width:1180px;
  min-height:68px;
  margin:auto;
  padding:10px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  text-decoration:none;
  color:#222;
  font-size:20px;
  font-weight:700;
}

.logo-icon{
  width:38px;
  height:38px;
  border-radius:9px;
  background:#e53232;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:15px;
  font-weight:800;
}

.home-btn{
  text-decoration:none;
  color:#333;
  padding:9px 14px;
  border-radius:8px;
  border:1px solid #ddd;
  background:#fff;
  font-weight:600;
}


/* =========================================================
   HERO
========================================================= */

.hero{
  max-width:1180px;
  margin:20px auto 0;
  padding:25px 20px;
  border-radius:16px;
  background:linear-gradient(135deg,#fff,#fff5f5);
  border:1px solid #f0dddd;
}

.hero h1{
  margin:0 0 7px;
  font-size:28px;
}

.hero p{
  margin:0;
  color:#666;
}


/* =========================================================
   WRAPPER
========================================================= */

.editor-wrapper{
  max-width:1180px;
  margin:18px auto 50px;
  padding:0 15px;
}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
  position:sticky;
  top:68px;
  z-index:900;
  background:#fff;
  border:1px solid #e5e5e5;
  border-radius:14px;
  padding:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-bottom:15px;
}

.tool-btn{
  border:1px solid #ddd;
  background:#fff;
  color:#222;
  border-radius:8px;
  padding:9px 12px;
  cursor:pointer;
  font-weight:600;
  font-size:14px;
}

.tool-btn:hover{
  background:#f5f5f5;
}

.tool-btn.primary{
  background:#e53232;
  border-color:#e53232;
  color:#fff;
}

.tool-btn.primary:hover{
  background:#c92727;
}


/* =========================================================
   FILE
========================================================= */

.file-area{
  background:#fff;
  border:2px dashed #ddd;
  border-radius:14px;
  padding:25px;
  text-align:center;
  margin-bottom:18px;
}

.file-area.drag{
  border-color:#e53232;
  background:#fff7f7;
}

.file-label{
  display:inline-block;
  background:#e53232;
  color:#fff;
  padding:11px 20px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}

#pdfFile{
  display:none;
}

.file-name{
  margin-top:10px;
  color:#666;
  font-size:14px;
  word-break:break-word;
}


/* =========================================================
   STATUS
========================================================= */

.status{
  margin:12px 0;
  text-align:center;
  color:#666;
  font-size:14px;
  min-height:20px;
}


/* =========================================================
   PDF
========================================================= */

.pdf-container{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:25px;
}

.pdf-page{
  position:relative;
  width:100%;
  max-width:850px;
  background:#fff;
  box-shadow:0 5px 25px rgba(0,0,0,.15);
  overflow:hidden;
  border:2px solid transparent;
}

.pdf-page.active-page{
  border-color:rgba(229,50,50,.35);
}

.pdf-canvas{
  display:block;
  width:100%;
  height:auto;
}


/* =========================================================
   LAYERS
========================================================= */

.existing-layer,
.object-layer{
  position:absolute;
  inset:0;
  overflow:hidden;
}

.existing-layer{
  z-index:40;
  pointer-events:none;
}

.object-layer{
  z-index:50;
  pointer-events:none;
}


/* =========================================================
   EXISTING TEXT
========================================================= */

.existing-text{
  position:absolute;
  z-index:45;
  margin:0;
  padding:0 1px;
  white-space:pre;
  overflow:hidden;

  color:transparent;
  background:transparent;

  cursor:text;

  pointer-events:auto;

  line-height:1;

  user-select:text;
  -webkit-user-select:text;
  -moz-user-select:text;

  border:1px solid transparent;

  font-family:Arial,Helvetica,sans-serif;
}

.existing-text::selection{
  background:rgba(50,120,255,.35);
  color:transparent;
}

.existing-text:hover{
  background:rgba(229,50,50,.10);
  border-color:rgba(229,50,50,.35);
}

.existing-text.selected{
  z-index:46;
  background:rgba(229,50,50,.14);
  border:2px solid #e53232;
}

.existing-text.edited-visible{
  color:#111;
  background:rgba(255,255,255,.96);
  border:1px solid rgba(0,0,0,.08);
}


/* =========================================================
   DELETED TEXT COVER
========================================================= */

.deleted-cover{
  position:absolute;
  z-index:44;
  background:#fff;
  pointer-events:auto;
  cursor:pointer;
}


/* =========================================================
   EXISTING IMAGE
========================================================= */

.existing-image{
  position:absolute;
  z-index:35;
  pointer-events:auto;
  cursor:pointer;
  border:2px solid transparent;
  background:transparent;
  overflow:visible;
}

.existing-image:hover{
  background:rgba(229,50,50,.08);
  border-color:rgba(229,50,50,.35);
}

.existing-image.selected{
  border:2px solid #e53232;
  background:rgba(229,50,50,.10);
  box-shadow:0 0 0 1px rgba(229,50,50,.15);
}

.existing-image img{
  width:100%;
  height:100%;
  display:block;
  object-fit:fill;
  pointer-events:none;
}

.existing-image .resize-handle{
  display:none;
}


/* =========================================================
   DELETED IMAGE
========================================================= */

.deleted-image{
  position:absolute;
  z-index:35;
  background:#fff;
  pointer-events:auto;
  cursor:pointer;
  border:2px solid transparent;
}

.deleted-image.selected{
  border:2px solid #e53232;
  box-shadow:0 0 0 1px rgba(229,50,50,.15);
}


/* =========================================================
   ADDED OBJECTS
========================================================= */

.editor-object{
  position:absolute;
  pointer-events:auto;
  user-select:none;
  cursor:move;
  touch-action:none;
}

.text-object{
  min-width:30px;
  min-height:20px;
  padding:2px 4px;
  white-space:pre;
  background:rgba(255,255,255,.04);
  overflow:hidden;
  line-height:1.15;

  user-select:text;
  -webkit-user-select:text;
}

.text-object::selection{
  background:rgba(50,120,255,.35);
}

.image-object,
.qr-object{
  overflow:visible;
}

.text-object.selected,
.image-object.selected,
.qr-object.selected{
  outline:2px solid #e53232;
}

.image-object img,
.qr-object img{
  display:block;
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
}


/* =========================================================
   RESIZE
========================================================= */

.resize-handle{
  position:absolute;
  width:13px;
  height:13px;
  right:-7px;
  bottom:-7px;
  background:#e53232;
  border:2px solid #fff;
  border-radius:50%;
  cursor:nwse-resize;
  z-index:20;
}


/* =========================================================
   EXISTING IMAGE RESIZE
========================================================= */

.existing-image .existing-resize-handle{
  position:absolute;
  width:13px;
  height:13px;
  right:-7px;
  bottom:-7px;
  background:#e53232;
  border:2px solid #fff;
  border-radius:50%;
  cursor:nwse-resize;
  z-index:100;
  display:none;
}

.existing-image.selected .existing-resize-handle{
  display:block;
}


/* =========================================================
   TEXT TOOLBAR
========================================================= */

.text-toolbar{
  position:absolute;
  display:flex;
  align-items:center;
  gap:5px;
  padding:6px;
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
  z-index:200;
  pointer-events:auto;
  max-width:calc(100% - 10px);
  flex-wrap:wrap;
}

.text-toolbar button,
.text-toolbar select,
.text-toolbar input{
  height:30px;
  border:1px solid #ddd;
  background:#fff;
  border-radius:6px;
  font-size:12px;
  cursor:pointer;
}

.text-toolbar button{
  min-width:30px;
  padding:0 7px;
  font-weight:700;
}

.text-toolbar select{
  padding:0 5px;
  max-width:115px;
}

.text-toolbar input[type="number"]{
  width:55px;
  padding:0 5px;
}

.delete-text-btn{
  color:#e53232;
}

.copy-text-btn{
  color:#1759b6;
}


/* =========================================================
   PAGE NUMBER
========================================================= */

.page-number{
  position:absolute;
  bottom:5px;
  left:8px;
  padding:2px 5px;
  border-radius:4px;
  background:rgba(255,255,255,.75);
  font-size:11px;
  color:#777;
  pointer-events:none;
  z-index:30;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message{
  width:100%;
  max-width:850px;
  min-height:250px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:#fff;
  border:1px solid #ddd;
  border-radius:14px;
  color:#777;
  padding:30px;
}


/* =========================================================
   MODAL
========================================================= */

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:3000;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  padding:15px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:500px;
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-box h3{
  margin:0 0 18px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}

.form-group input,
.form-group select,
.form-group textarea{
  width:100%;
  padding:10px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:14px;
}

.form-group textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.5;
  font-family:Arial,Helvetica,sans-serif;
}

.modal-actions{
  display:flex;
  gap:8px;
  justify-content:flex-end;
  margin-top:18px;
}

.cancel-btn{
  background:#eee;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.ok-btn{
  background:#e53232;
  color:#fff;
  border:0;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:700;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

  .hero{
    margin:12px 10px 0;
  }

  .hero h1{
    font-size:23px;
  }

  .toolbar{
    top:60px;
  }

}

@media(max-width:600px){

  .header-inner{
    min-height:60px;
    padding:8px 12px;
  }

  .logo{
    font-size:16px;
  }

  .logo-icon{
    width:32px;
    height:32px;
    font-size:12px;
  }

  .home-btn{
    padding:7px 10px;
    font-size:13px;
  }

  .hero{
    padding:18px 15px;
    border-radius:12px;
  }

  .hero h1{
    font-size:21px;
  }

  .hero p{
    font-size:13px;
  }

  .editor-wrapper{
    padding:0 8px;
  }

  .toolbar{
    top:58px;
    padding:8px;
    gap:6px;
  }

  .tool-btn{
    padding:8px 9px;
    font-size:12px;
  }

  .file-area{
    padding:20px 12px;
  }

  .text-toolbar{
    gap:4px;
    padding:5px;
  }

}


/* =========================================================
   PRINT
========================================================= */

@media print{

  .header,
  .hero,
  .toolbar,
  .file-area,
  .status{
    display:none!important;
  }

}

</style>
</head>

<body>

<!-- =========================================================

type="number"
id="fontSizeInput"
value="16"
min="6"
max="100">

id="qrInput"

<script>

/* =========================================================
   LIBRARIES
========================================================= */

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const {
  PDFDocument,
  rgb,
  StandardFonts
} = PDFLib;


/* =========================================================
   GLOBAL
========================================================= */

let pdfBytes = null;
let pdfDocument = null;
let currentFile = null;

let existingTexts = [];
let existingImages = [];
let addedObjects = [];

let selectedObject = null;
let activePageNumber = 1;

let history = [];
let historyIndex = -1;

let objectCounter = 1;

let replaceQRMode = false;

let editingTextObject = null;
let editingTextType = null;

let notoFontBytesPromise = null;

const BASE_SCALE = 2;


/* =========================================================
   ELEMENTS
========================================================= */

const pdfFile =
document.getElementById("pdfFile");

const dropArea =
document.getElementById("dropArea");

const fileName =
document.getElementById("fileName");

const pdfContainer =
document.getElementById("pdfContainer");

const status =
document.getElementById("status");

const textModal =
document.getElementById("textModal");

const textModalTitle =
document.getElementById("textModalTitle");

const textInput =
document.getElementById("textInput");

const fontSizeInput =
document.getElementById("fontSizeInput");

const fontFamilyInput =
document.getElementById("fontFamilyInput");

const textOk =
document.getElementById("textOk");

const qrModal =
document.getElementById("qrModal");

const qrTitle =
document.getElementById("qrTitle");

const qrOk =
document.getElementById("qrOk");


/* =========================================================
   STATUS
========================================================= */

function setStatus(message){
  status.textContent = message;
}


/* =========================================================
   DEVANAGARI DETECTION
========================================================= */

function containsDevanagari(text){

  return /[\u0900-\u097F]/.test(
    String(text || "")
  );

}


/* =========================================================
   FONT CSS
========================================================= */

function getCssFont(font){

  if(font==="Times-Roman"){
    return "Times New Roman, serif";
  }

  if(font==="Courier"){
    return "Courier New, monospace";
  }

  if(font==="NotoSansDevanagari"){
    return "'Noto Sans Devanagari', sans-serif";
  }

  return "Arial, Helvetica, sans-serif";

}


/* =========================================================
   EFFECTIVE FONT
========================================================= */

function getEffectiveFont(font,text){

  if(containsDevanagari(text)){
    return "NotoSansDevanagari";
  }

  return font || "Helvetica";

}


/* =========================================================
   LOAD NOTO FONT
========================================================= */

async function getNotoFontBytes(){

  if(notoFontBytesPromise){
    return notoFontBytesPromise;
  }

  const url =
    "https://cdn.jsdelivr.net/gh/notofonts/noto-fonts@main/hinted/ttf/NotoSansDevanagari/NotoSansDevanagari-Regular.ttf";

  notoFontBytesPromise =
    fetch(url,{
      mode:"cors",
      cache:"force-cache"
    })
    .then(function(response){

      if(!response.ok){
        throw new Error(
          "Noto Sans Devanagari font could not be loaded."
        );
      }

      return response.arrayBuffer();

    })
    .then(function(buffer){

      return new Uint8Array(buffer);

    });

  return notoFontBytesPromise;

}


/* =========================================================
   LOAD PDF
========================================================= */

pdfFile.addEventListener(
  "change",
  function(e){

    const file =
      e.target.files[0];

    if(file){
      loadPDF(file);
    }

  }
);


dropArea.addEventListener(
  "dragover",
  function(e){

    e.preventDefault();

    dropArea.classList.add("drag");

  }
);


dropArea.addEventListener(
  "dragleave",
  function(){

    dropArea.classList.remove("drag");

  }
);


dropArea.addEventListener(
  "drop",
  function(e){

    e.preventDefault();

    dropArea.classList.remove("drag");

    const file =
      e.dataTransfer.files[0];

    if(
      file &&
      (
        file.type==="application/pdf" ||
        file.name.toLowerCase().endsWith(".pdf")
      )
    ){

      loadPDF(file);

    }
    else{

      alert("Please select a PDF file.");

    }

  }
);


async function loadPDF(file){

  try{

    setStatus("Loading PDF...");

    currentFile = file;

    fileName.textContent =
      file.name;

    pdfBytes =
      await file.arrayBuffer();

    const loadingData =
      new Uint8Array(
        pdfBytes.slice(0)
      );

    pdfDocument =
      await pdfjsLib
      .getDocument({
        data:loadingData
      })
      .promise;

    existingTexts=[];
    existingImages=[];
    addedObjects=[];

    selectedObject=null;
    activePageNumber=1;

    history=[];
    historyIndex=-1;

    objectCounter=1;

    pdfContainer.innerHTML="";

    for(
      let pageNumber=1;
      pageNumber<=pdfDocument.numPages;
      pageNumber++
    ){

      await renderPage(pageNumber);

    }

    markActivePage();

    saveHistory();

    setStatus(
      pdfDocument.numPages+
      " page(s) loaded successfully."
    );

  }
  catch(error){

    console.error(error);

    pdfDocument=null;

    setStatus(
      "Unable to load PDF."
    );

    alert(
      "PDF load nahi ho saka. Please valid PDF select karein."
    );

  }

}


/* =========================================================
   RENDER PAGE
========================================================= */

async function renderPage(pageNumber){

  const page =
    await pdfDocument.getPage(
      pageNumber
    );

  const baseViewport =
    page.getViewport({
      scale:1
    });

  const viewport =
    page.getViewport({
      scale:BASE_SCALE
    });

  const pageDiv =
    document.createElement("div");

  pageDiv.className="pdf-page";

  pageDiv.dataset.page=
    pageNumber;

  pageDiv.dataset.pdfWidth=
    baseViewport.width;

  pageDiv.dataset.pdfHeight=
    baseViewport.height;

  pageDiv.style.aspectRatio=
    baseViewport.width+
    "/"+
    baseViewport.height;


  const canvas =
    document.createElement("canvas");

  canvas.className="pdf-canvas";

  const context =
    canvas.getContext(
      "2d",
      {alpha:false}
    );

  const deviceScale =
    Math.min(
      window.devicePixelRatio || 1,
      2
    );

  canvas.width =
    Math.floor(
      viewport.width*
      deviceScale
    );

  canvas.height =
    Math.floor(
      viewport.height*
      deviceScale
    );

  pageDiv.appendChild(canvas);


  const pageNumberEl =
    document.createElement("div");

  pageNumberEl.className=
    "page-number";

  pageNumberEl.textContent=
    "Page "+pageNumber;

  pageDiv.appendChild(
    pageNumberEl
  );


  const existingLayer =
    document.createElement("div");

  existingLayer.className=
    "existing-layer";

  pageDiv.appendChild(
    existingLayer
  );


  const objectLayer =
    document.createElement("div");

  objectLayer.className=
    "object-layer";

  pageDiv.appendChild(
    objectLayer
  );


  pdfContainer.appendChild(
    pageDiv
  );


  await page.render({

    canvasContext:context,

    viewport:viewport,

    transform:[
      deviceScale,
      0,
      0,
      deviceScale,
      0,
      0
    ]

  }).promise;


  await extractExistingText(
    page,
    pageDiv,
    existingLayer,
    viewport,
    pageNumber
  );


  await extractExistingImages(
    page,
    pageDiv,
    existingLayer,
    viewport,
    pageNumber
  );


  existingImages
  .filter(function(item){

    return item.page===pageNumber;

  })
  .forEach(function(item){

    if(item.deleted){

      renderDeletedImageCover(
        item,
        pageDiv,
        existingLayer,
        viewport
      );

    }
    else{

      renderExistingImage(
        item,
        pageDiv,
        existingLayer,
        viewport
      );

    }

  });


  renderObjectsForPage(
    pageDiv,
    objectLayer,
    pageNumber
  );


  pageDiv.addEventListener(
    "click",
    function(){

      activePageNumber=
        pageNumber;

      markActivePage();

    }
  );

}


/* =========================================================
   EXTRACT EXISTING TEXT
========================================================= */

async function extractExistingText(
  page,
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  const textContent =
    await page.getTextContent();

  textContent.items.forEach(
    function(item,index){

      if(!item.str){
        return;
      }

      const rawTransform =
        item.transform.slice();

      const fontSize =
        Math.max(
          1,
          Math.abs(
            rawTransform[3] ||
            rawTransform[2] ||
            10
          )
        );


      const textObject={

        id:
          "existing-text-"+
          pageNumber+
          "-"+
          index,

        type:"existingText",

        page:pageNumber,

        text:item.str,

        originalText:item.str,

        originalTransform:
          rawTransform,

        x:
          rawTransform[4],

        y:
          rawTransform[5],

        width:
          Math.max(
            1,
            item.width || 1
          ),

        height:
          Math.max(
            1,
            fontSize
          ),

        fontSize:
          fontSize,

        fontName:
          item.fontName || "",

        fontFamily:
          detectExistingFont(
            item.fontName
          ),

        deleted:false,

        edited:false

      };


      existingTexts.push(
        textObject
      );


      renderExistingTextItem(
        textObject,
        pageDiv,
        layer,
        viewport
      );

    }
  );

}


/* =========================================================
   EXTRACT EXISTING IMAGES
========================================================= */

async function extractExistingImages(
  page,
  pageDiv,
  layer,
  viewport,
  pageNumber
){

  try{

    const opList =
      await page.getOperatorList();

    let transform =
      [1,0,0,1,0,0];

    const transformStack=[];


    for(
      let i=0;
      i<opList.fnArray.length;
      i++
    ){

      const fn =
        opList.fnArray[i];

      const args =
        opList.argsArray[i];


      if(
        fn===pdfjsLib.OPS.save
      ){

        transformStack.push(
          transform.slice()
        );

      }


      else if(
        fn===pdfjsLib.OPS.restore
      ){

        if(transformStack.length){

          transform=
            transformStack.pop();

        }

      }


      else if(
        fn===pdfjsLib.OPS.transform
      ){

        transform=
          multiplyMatrices(
            transform,
            args
          );

      }


      else if(

        fn===pdfjsLib.OPS.paintImageXObject ||
        fn===pdfjsLib.OPS.paintJpegXObject ||
        fn===pdfjsLib.OPS.paintInlineImageXObject ||
        fn===pdfjsLib.OPS.paintImageMaskXObject

      ){

        const finalMatrix =
          multiplyMatrices(
            viewport.transform,
            transform
          );


        const p1 =
          transformPoint(
            finalMatrix,
            0,
            0
          );

        const p2 =
          transformPoint(
            finalMatrix,
            1,
            0
          );

        const p3 =
          transformPoint(
            finalMatrix,
            0,
            1
          );

        const p4 =
          transformPoint(
            finalMatrix,
            1,
            1
          );


        const xs=[
          p1[0],
          p2[0],
          p3[0],
          p4[0]
        ];

        const ys=[
          p1[1],
          p2[1],
          p3[1],
          p4[1]
        ];


        const minX=
          Math.min(...xs);

        const maxX=
          Math.max(...xs);

        const minY=
          Math.min(...ys);

        const maxY=
          Math.max(...ys);


        const width=
          maxX-minX;

        const height=
          maxY-minY;


        if(
          width<2 ||
          height<2
        ){
          continue;
        }


        /*
          Avoid duplicate image detections.
        */

        const duplicate =
          existingImages.some(
            function(old){

              return(
                old.page===pageNumber &&
                Math.abs(old.x-minX)<2 &&
                Math.abs(old.y-minY)<2 &&
                Math.abs(old.width-width)<2 &&
                Math.abs(old.height-height)<2
              );

            }
          );


        if(duplicate){
          continue;
        }


        existingImages.push({

          id:
            "existing-image-"+
            pageNumber+
            "-"+
            i+
            "-"+
            Date.now()+
            "-"+
            Math.random()
            .toString(36)
            .slice(2),

          type:"existingImage",

          page:pageNumber,

          x:minX,
          y:minY,

          width:width,
          height:height,

          originalX:minX,
          originalY:minY,

          originalWidth:width,
          originalHeight:height,

          deleted:false,
          replaced:false,

          replacementSrc:null,

          replacementType:"image",

          replacementQRValue:"",

          imageName:
            args && args[0]
              ? String(args[0])
              : ""

        });

      }

    }

  }
  catch(error){

    console.error(
      "Existing image extraction error:",
      error
    );

  }

}


/* =========================================================
   MATRIX
========================================================= */

function multiplyMatrices(
  m1,
  m2
){

  return [

    m1[0]*m2[0]+
    m1[2]*m2[1],

    m1[1]*m2[0]+
    m1[3]*m2[1],

    m1[0]*m2[2]+
    m1[2]*m2[3],

    m1[1]*m2[2]+
    m1[3]*m2[3],

    m1[0]*m2[4]+
    m1[2]*m2[5]+
    m1[4],

    m1[1]*m2[4]+
    m1[3]*m2[5]+
    m1[5]

  ];

}


function transformPoint(
  matrix,
  x,
  y
){

  return [

    matrix[0]*x+
    matrix[2]*y+
    matrix[4],

    matrix[1]*x+
    matrix[3]*y+
    matrix[5]

  ];

}


/* =========================================================
   EXISTING TEXT RENDER
========================================================= */

function renderExistingTextItem(
  item,
  pageDiv,
  layer,
  viewport
){

  if(
    !item ||
    item.deleted
  ){
    return;
  }


  const tx =
    pdfjsLib.Util.transform(
      viewport.transform,
      item.originalTransform
    );


  const fontHeight =
    Math.sqrt(
      tx[2]*tx[2]+
      tx[3]*tx[3]
    );


  const cssScale =
    pageDiv.clientWidth/
    viewport.width;


  const span =
    document.createElement("div");

  span.className=
    "existing-text";

  span.dataset.existingId=
    item.id;

  span.textContent=
    item.text;


  span.style.left=
    tx[4]*cssScale+
    "px";


  span.style.top=
    (
      tx[5]-
      fontHeight*.9
    )*
    cssScale+
    "px";


  span.style.width=
    Math.max(
      5,
      item.width*
      BASE_SCALE*
      cssScale
    )+
    "px";


  span.style.height=
    Math.max(
      8,
      fontHeight*
      1.35*
      cssScale
    )+
    "px";


  span.style.fontSize=
    Math.max(
      6,
      fontHeight*
      cssScale
    )+
    "px";


  const effectiveFont =
    getEffectiveFont(
      item.fontFamily,
      item.text
    );


  span.style.fontFamily=
    getCssFont(
      effectiveFont
    );


  if(item.edited){

    span.classList.add(
      "edited-visible"
    );

  }


  /*
    IMPORTANT:
    Do NOT preventDefault here.
    This allows normal browser text selection.
  */

  span.addEventListener(
    "pointerdown",
    function(e){

      e.stopPropagation();

      activePageNumber=
        item.page;

      selectExistingText(
        item,
        span
      );

    }
  );


  span.addEventListener(
    "dblclick",
    function(e){

      e.stopPropagation();

      editExistingText(
        item
      );

    }
  );


  layer.appendChild(
    span
  );

}


/* =========================================================
   EXISTING IMAGE RENDER
========================================================= */

function renderExistingImage(
  item,
  pageDiv,
  layer,
  viewport
){

  if(
    !item ||
    item.deleted
  ){
    return;
  }


  const cssScale =
    pageDiv.clientWidth/
    viewport.width;


  const el =
    document.createElement("div");

  el.className=
    "existing-image";

  el.dataset.existingId=
    item.id;


  el.style.left=
    item.x*
    cssScale+
    "px";


  el.style.top=
    item.y*
    cssScale+
    "px";


  el.style.width=
    Math.max(
      4,
      item.width*
      cssScale
    )+
    "px";


  el.style.height=
    Math.max(
      4,
      item.height*
      cssScale
    )+
    "px";


  if(item.replacementSrc){

    el.style.background=
      "#fff";


    const img =
      document.createElement("img");

    img.src=
      item.replacementSrc;

    img.alt=
      item.replacementType==="qr"
        ? "Replacement QR"
        : "Replacement Image";

    el.appendChild(
      img
    );

  }


  const handle =
    document.createElement("div");

  handle.className=
    "existing-resize-handle";

  el.appendChild(
    handle
  );


  el.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "existing-resize-handle"
        )
      ){
        return;
      }

      e.preventDefault();
      e.stopPropagation();

      activePageNumber=
        item.page;

      selectExistingImage(
        item
      );

    }
  );


  enableExistingImageResize(
    handle,
    el,
    item,
    pageDiv
  );


  layer.appendChild(
    el
  );

}


/* =========================================================
   EXISTING IMAGE RESIZE
========================================================= */

function enableExistingImageResize(
  handle,
  element,
  item,
  pageDiv
){

  let resizing=false;

  let startX=0;
  let startY=0;

  let oldWidth=0;
  let oldHeight=0;


  handle.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      resizing=true;

      startX=e.clientX;
      startY=e.clientY;

      oldWidth=item.width;
      oldHeight=item.height;

      try{

        handle.setPointerCapture(
          e.pointerId
        );

      }
      catch(err){}

    }
  );


  handle.addEventListener(
    "pointermove",
    function(e){

      if(!resizing){
        return;
      }


      const cssScale =
        pageDiv.clientWidth/
        (
          Number(
            pageDiv.dataset.pdfWidth
          )*
          BASE_SCALE
        );


      const dx=
        (e.clientX-startX)/
        cssScale;

      const dy=
        (e.clientY-startY)/
        cssScale;


      item.width=
        Math.max(
          5,
          oldWidth+dx
        );


      item.height=
        Math.max(
          5,
          oldHeight+dy
        );


      element.style.width=
        item.width*
        cssScale+
        "px";


      element.style.height=
        item.height*
        cssScale+
        "px";

    }
  );


  function finish(){

    if(!resizing){
      return;
    }

    resizing=false;

    saveHistory();

  }


  handle.addEventListener(
    "pointerup",
    finish
  );

  handle.addEventListener(
    "pointercancel",
    finish
  );

}


/* =========================================================
   DELETED IMAGE COVER
========================================================= */

function renderDeletedImageCover(
  item,
  pageDiv,
  layer,
  viewport
){

  if(!item){
    return;
  }


  const cssScale =
    pageDiv.clientWidth/
    viewport.width;


  const cover =
    document.createElement("div");

  cover.className=
    "deleted-image";

  cover.dataset.existingId=
    item.id;


  const extra=2;


  cover.style.left=
    Math.max(
      0,
      (item.x-extra)*
      cssScale
    )+
    "px";


  cover.style.top=
    Math.max(
      0,
      (item.y-extra)*
      cssScale
    )+
    "px";


  cover.style.width=
    (
      item.width+
      extra*2
    )*
    cssScale+
    "px";


  cover.style.height=
    (
      item.height+
      extra*2
    )*
    cssScale+
    "px";


  cover.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      activePageNumber=
        item.page;

      selectExistingImage(
        item
      );

    }
  );


  layer.appendChild(
    cover
  );

}


/* =========================================================
   SELECT EXISTING TEXT
========================================================= */

function selectExistingText(
  obj,
  el
){

  if(!obj){
    return;
  }


  selectedObject={
    type:"existingText",
    id:obj.id,
    page:obj.page
  };


  activePageNumber=
    obj.page;


  markActivePage();

  clearVisualSelection();

  if(el){

      "selected"
    );
  }


  createExistingTextToolbar(
    obj
  );

}


/* =========================================================
   EXISTING TEXT TOOLBAR
========================================================= */

function createExistingTextToolbar(
  obj
){

  const pageDiv =
    document.querySelector(
      '.pdf-page[data-page="'+
      obj.page+
      '"]'
    );


  if(!pageDiv){
    return;
  }


  removeTextToolbar(
    pageDiv
  );


  const toolbar =
    document.createElement("div");

  toolbar.className=
    "text-toolbar";


  const editBtn =
    document.createElement("button");

  editBtn.type="button";
  editBtn.textContent="Edit";


  const copyBtn =
    document.createElement("button");

  copyBtn.type="button";
  copyBtn.textContent="Copy";
  copyBtn.className=
    "copy-text-btn";


  const sizeInput =
    document.createElement("input");

  sizeInput.type="number";
  sizeInput.min="6";
  sizeInput.max="100";

  sizeInput.value=
    Math.round(
      obj.fontSize
    );


  const fontSelect =
    document.createElement("select");


  fontSelect.innerHTML=`

    <option value="Helvetica">
      Helvetica
    </option>

    <option value="Times-Roman">
      Times
    </option>

    <option value="Courier">
      Courier
    </option>

    <option value="NotoSansDevanagari">
      Noto Devanagari
    </option>

  `;


  fontSelect.value=
    getEffectiveFont(
      obj.fontFamily,
      obj.text
    );


  const deleteBtn =
    document.createElement("button");

  deleteBtn.type="button";

  deleteBtn.textContent=
    "Delete";

  deleteBtn.className=
    "delete-text-btn";


  toolbar.appendChild(
    editBtn
  );

  toolbar.appendChild(
    copyBtn
  );

  toolbar.appendChild(
    sizeInput
  );

  toolbar.appendChild(
    fontSelect
  );

  toolbar.appendChild(
    deleteBtn
  );


  pageDiv.appendChild(
    toolbar
  );


  function position(){

    const cssScale =
      pageDiv.clientWidth/
      (
        Number(
          pageDiv.dataset.pdfWidth
        )*
        BASE_SCALE
      );


    const x=
      obj.x*
      BASE_SCALE*
      cssScale;


    const y=
      pageDiv.clientHeight-
      obj.y*
      cssScale;


    const tw=
      toolbar.offsetWidth;


    const th=
      toolbar.offsetHeight;


    let left=x;

    let top=
      y-th-8;


    if(top<5){
      top=y+8;
    }


    if(
      left+tw>
      pageDiv.clientWidth-5
    ){

      left=
        pageDiv.clientWidth-
        tw-
        5;

    }


    if(left<5){
      left=5;
    }


    if(
      top+th>
      pageDiv.clientHeight-5
    ){

      top=
        pageDiv.clientHeight-
        th-
        5;

    }


    if(top<5){
      top=5;
    }


    toolbar.style.left=
      left+"px";

    toolbar.style.top=
      top+"px";

  }


  editBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      editExistingText(
        obj
      );

    }
  );


  copyBtn.addEventListener(
    "click",
    async function(e){

      e.preventDefault();
      e.stopPropagation();

      await copyText(
        obj.text
      );

    }
  );


  sizeInput.addEventListener(
    "change",
    function(e){

      e.stopPropagation();

      const value=
        Number(
          e.target.value
        );


      if(
        !Number.isFinite(value) ||
        value<6
      ){

        e.target.value=
          obj.fontSize;

        return;

      }


      obj.fontSize=
        Math.min(
          100,
          value
        );


      obj.edited=true;

      refreshPageLayers();

      saveHistory();


      requestAnimationFrame(
        function(){

          const latest=
            existingTexts.find(
              function(x){
                return x.id===obj.id;
              }
            );

          if(
            latest &&
            !latest.deleted
          ){

            createExistingTextToolbar(
              latest
            );

          }

        }
      );

    }
  );


  fontSelect.addEventListener(
    "change",
    function(e){

      e.stopPropagation();

      obj.fontFamily=
        e.target.value;

      obj.edited=true;

      refreshPageLayers();

      saveHistory();


      requestAnimationFrame(
        function(){

          const latest=
            existingTexts.find(
              function(x){
                return x.id===obj.id;
              }
            );

          if(
            latest &&
            !latest.deleted
          ){

            createExistingTextToolbar(
              latest
            );

          }

        }
      );

    }
  );


  deleteBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      obj.deleted=true;
      obj.edited=true;

      selectedObject=null;

      refreshPageLayers();

      saveHistory();

    }
  );


  requestAnimationFrame(
    position
  );

}


/* =========================================================
   COPY TEXT
========================================================= */

async function copyText(text){

  try{

    if(
      navigator.clipboard &&
      navigator.clipboard.writeText
    ){

      await navigator.clipboard.writeText(
        text
      );

      setStatus(
        "Text copied."
      );

      return;

    }

  }
  catch(error){

    console.warn(
      "Clipboard API failed:",
      error
    );

  }


  /*
    Fallback
  */

  const area =
    document.createElement(
      "textarea"
    );

  area.value=text;

  area.style.position=
    "fixed";

  area.style.left=
    "-10000px";

  document.body.appendChild(
    area
  );

  area.focus();

  area.select();

  try{

    document.execCommand(
      "copy"
    );

    setStatus(
      "Text copied."
    );

  }
  catch(error){

    alert(
      "Copy failed. Text manually select karke Ctrl+C karein."
    );

  }

  area.remove();

}

/* =========================================================
   TEXT SAVE
========================================================= */

textOk.addEventListener(
  "click",
  function(){

    const text=
      textInput.value;

    const fontSize=
      Number(
        fontSizeInput.value
      );

    let fontFamily=
      fontFamilyInput.value;


    if(!text.trim()){

      alert(
        "Text enter karein."
      );

      return;

    }


    if(
      !Number.isFinite(fontSize) ||
      fontSize<6
    ){

      alert(
        "Valid font size enter karein."
      );

      return;

    }


    /*
      Existing text edit
    */

    if(
      editingTextType===
      "existingText" &&
      editingTextObject
    ){

      const obj=
        existingTexts.find(
          function(x){

            return(
              x.id===
              editingTextObject.id
            );

          }
        );


      if(!obj){
        return;
      }


      obj.text=
        text;


      obj.fontSize=
        Math.min(
          100,
          fontSize
        );


      obj.fontFamily=
        getEffectiveFont(
          fontFamily,
          text
        );


      obj.deleted=false;

      obj.edited=true;


      selectedObject={
        type:"existingText",
        id:obj.id,
        page:obj.page
      };


      textModal.classList.remove(
        "show"
      );


      resetTextModal();


      refreshPageLayers();

      saveHistory();


      requestAnimationFrame(
        function(){

          const latest=
            existingTexts.find(
              function(x){
                return x.id===obj.id;
              }
            );

          if(
            latest &&
            !latest.deleted
          ){

            createExistingTextToolbar(
              latest
            );

          }

        }
      );


      return;

    }


    /*
      New text
    */

    const pageDiv=
      document.querySelector(
        '.pdf-page[data-page="'+
        activePageNumber+
        '"]'
      );


    if(!pageDiv){

      alert(
        "PDF page available nahi hai."
      );

      return;

    }


    const pdfWidth=
      Number(
        pageDiv.dataset.pdfWidth
      );

    const pdfHeight=
      Number(
        pageDiv.dataset.pdfHeight
      );


    /*
      Better approximate width for
      Latin + Hindi.
    */

    const characters=
      Array.from(
        text
      );


    let estimatedCharacters=0;


    characters.forEach(
      function(ch){

        if(
          /[\u0900-\u097F]/.test(ch)
        ){

          estimatedCharacters+=
            0.72;

        }
        else if(
          /[A-Z]/.test(ch)
        ){

          estimatedCharacters+=
            0.62;

        }
        else{

          estimatedCharacters+=
            0.52;

        }

      }
    );


    const estimatedWidth=
      Math.max(
        .12,
        Math.min(
          .85,
          estimatedCharacters*
          fontSize/
          pdfWidth
        )
      );


    const estimatedHeight=
      Math.max(
        .045,
        Math.min(
          .20,
          fontSize*
          1.5/
          pdfHeight
        )
      );


    const obj={

      id:
        "text-"+
        objectCounter++,

      type:"text",

      page:
        activePageNumber,

      text:
        text,

      fontSize:
        Math.min(
          100,
          fontSize
        ),

      fontFamily:
        getEffectiveFont(
          fontFamily,
          text
        ),

      xRatio:.08,

      yRatio:.08,

      widthRatio:
        estimatedWidth,

      heightRatio:
        estimatedHeight

    };


    addedObjects.push(
      obj
    );


    textModal.classList.remove(
      "show"
    );


    resetTextModal();


    renderAllObjects();

    selectObject(
      obj
    );

    saveHistory();

  }
);

/* =========================================================
   QR CREATE
========================================================= */

qrOk.addEventListener(
  "click",
  function(){

    const value=
      document
      .getElementById("qrInput")
      .value
      .trim();


    const size=
      Number(
        document
        .getElementById("qrSizeInput")
        .value
      );


    if(!value){

      alert(
        "QR text ya URL enter karein."
      );

      return;

    }


    if(
      !Number.isFinite(size) ||
      size<40
    ){

      alert(
        "Valid QR size enter karein."
      );

      return;

    }


    try{

      const temp=
        document.createElement(
          "div"
        );


      temp.style.position=
        "fixed";

      temp.style.left=
        "-10000px";

      temp.style.top=
        "-10000px";

      temp.style.width=
        size+"px";

      temp.style.height=
        size+"px";


      document.body.appendChild(
        temp
      );


      new QRCode(
        temp,
        {
          text:value,
          width:size,
          height:size,
          colorDark:"#000000",
          colorLight:"#ffffff",
          correctLevel:
            QRCode.CorrectLevel.M
        }
      );


      setTimeout(
        function(){

          const canvas=
            temp.querySelector(
              "canvas"
            );

          const img=
            temp.querySelector(
              "img"
            );


          let src="";


          if(canvas){

            src=
              canvas.toDataURL(
                "image/png"
              );

          }
          else if(img){

            src=
              img.src;

          }


          if(!src){

            temp.remove();

            alert(
              "QR create nahi ho saka."
            );

            return;

          }


          if(
            replaceQRMode &&
            selectedObject &&
            selectedObject.type===
            "existingImage"
          ){

            const existing=
              existingImages.find(
                function(x){

                  return(
                    x.id===
                    selectedObject.id
                  );

                }
              );


            if(existing){

              existing.replaced=true;

              existing.deleted=false;

              existing.replacementSrc=
                src;

              existing.replacementType=
                "qr";

              existing.replacementQRValue=
                value;


              selectedObject={
                type:"existingImage",
                id:existing.id,
                page:existing.page
              };


              refreshPageLayers();

              saveHistory();

            }

          }


          else if(
            replaceQRMode &&
            selectedObject
          ){

            const obj=
              addedObjects.find(
                function(x){

                  return(
                    x.id===
                    selectedObject.id
                  );

                }
              );


            if(obj){

              obj.src=
                src;

              obj.value=
                value;


              renderAllObjects();

              selectObject(
                obj
              );

              saveHistory();

            }

          }


          else{

            const obj={

              id:
                "qr-"+
                objectCounter++,

              type:"qr",

              page:
                activePageNumber,

              src:
                src,

              value:
                value,

              xRatio:.08,

              yRatio:.15,

              widthRatio:.20,

              heightRatio:.20

            };


            addedObjects.push(
              obj
            );


            renderAllObjects();

            selectObject(
              obj
            );

            saveHistory();

          }


          replaceQRMode=false;

          qrModal.classList.remove(
            "show"
          );


          temp.remove();

        },
        100
      );

    }
    catch(error){

      console.error(error);

      alert(
        "QR create nahi ho saka."
      );

    }

  }
);


/* =========================================================
   RENDER ALL OBJECTS
========================================================= */

function renderAllObjects(){

  document
  .querySelectorAll(
    ".object-layer"
  )
  .forEach(
    function(layer){

      layer.innerHTML="";

    }
  );


  addedObjects.forEach(
    function(obj){

      const page=
        document.querySelector(
          '.pdf-page[data-page="'+
          obj.page+
          '"]'
        );


      if(!page){
        return;
      }


      const layer=
        page.querySelector(
          ".object-layer"
        );


      renderSingleObject(
        obj,
        page,
        layer
      );

    }
  );


  refreshSelection();

}


/* =========================================================
   RENDER OBJECTS FOR PAGE
========================================================= */

function renderObjectsForPage(
  pageDiv,
  layer,
  pageNumber
){

  addedObjects
  .filter(
    function(obj){

      return(
        obj.page===
        pageNumber
      );

    }
  )
  .forEach(
    function(obj){

      renderSingleObject(
        obj,
        pageDiv,
        layer
      );

    }
  );

}


/* =========================================================
   SINGLE OBJECT
========================================================= */

function renderSingleObject(
  obj,
  pageDiv,
  layer
){

  const width=
    pageDiv.clientWidth;

  const height=
    pageDiv.clientHeight;


  if(
    width<=0 ||
    height<=0
  ){
    return;
  }


  obj.xRatio=
    clamp(
      obj.xRatio,
      0,
      Math.max(
        0,
        1-obj.widthRatio
      )
    );


  obj.yRatio=
    clamp(
      obj.yRatio,
      0,
      Math.max(
        0,
        1-obj.heightRatio
      )
    );


  const element=
    document.createElement(
      "div"
    );


  element.className=
    "editor-object";


  element.dataset.id=
    obj.id;


  element.style.left=
    obj.xRatio*
    width+
    "px";


  element.style.top=
    obj.yRatio*
    height+
    "px";


  element.style.width=
    obj.widthRatio*
    width+
    "px";


  element.style.height=
    obj.heightRatio*
    height+
    "px";


  if(obj.type==="text"){

    element.classList.add(
      "text-object"
    );


    element.textContent=
      obj.text;


    const pdfWidth=
      Number(
        pageDiv.dataset.pdfWidth
      );


    const cssScale=
      width/
      pdfWidth;


    element.style.fontSize=
      Math.max(
        6,
        obj.fontSize*
        cssScale
      )+
      "px";


    const effectiveFont=
      getEffectiveFont(
        obj.fontFamily,
        obj.text
      );


    element.style.fontFamily=
      getCssFont(
        effectiveFont
      );


    element.style.color=
      "#000";

  }


  if(
    obj.type==="image" ||
    obj.type==="qr"
  ){

    element.classList.add(
      obj.type==="image"
        ? "image-object"
        : "qr-object"
    );


    const img=
      document.createElement(
        "img"
      );


    img.src=
      obj.src;


    img.alt=
      obj.type==="qr"
        ? "QR Code"
        : "Added Image";


    element.appendChild(
      img
    );

  }


  const handle=
    document.createElement(
      "div"
    );


  handle.className=
    "resize-handle";


  element.appendChild(
    handle
  );


  layer.appendChild(
    element
  );


  enableDrag(
    element,
    obj,
    pageDiv
  );


  enableResize(
    handle,
    element,
    obj,
    pageDiv
  );


  element.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "resize-handle"
        )
      ){
        return;
      }


      e.preventDefault();
      e.stopPropagation();


      activePageNumber=
        obj.page;


      markActivePage();


      selectObject(
        obj
      );

    }
  );


  /*
    Double click text -> editor
  */

  if(obj.type==="text"){

    element.addEventListener(
      "dblclick",
      function(e){

        e.stopPropagation();

        editAddedText(
          obj
        );

      }
    );

  }

}

/* =========================================================
   ADDED TEXT TOOLBAR
========================================================= */

function createTextToolbar(
  obj,
  pageDiv
){

  removeTextToolbar(
    pageDiv
  );


  const toolbar=
    document.createElement(
      "div"
    );


  toolbar.className=
    "text-toolbar";


  const editBtn=
    document.createElement(
      "button"
    );


  editBtn.type="button";

  editBtn.textContent=
    "Edit";


  const copyBtn=
    document.createElement(
      "button"
    );


  copyBtn.type="button";

  copyBtn.textContent=
    "Copy";

  copyBtn.className=
    "copy-text-btn";


  const sizeInput=
    document.createElement(
      "input"
    );


  sizeInput.type=
    "number";

  sizeInput.min=
    "6";

  sizeInput.max=
    "100";

  sizeInput.value=
    obj.fontSize;


  const fontSelect=
    document.createElement(
      "select"
    );


  fontSelect.innerHTML=`

    <option value="Helvetica">
      Helvetica
    </option>

    <option value="Times-Roman">
      Times
    </option>

    <option value="Courier">
      Courier
    </option>

    <option value="NotoSansDevanagari">
      Noto Devanagari
    </option>

  `;


  fontSelect.value=
    getEffectiveFont(
      obj.fontFamily,
      obj.text
    );


  const deleteBtn=
    document.createElement(
      "button"
    );


  deleteBtn.type=
    "button";

  deleteBtn.textContent=
    "Delete";

  deleteBtn.className=
    "delete-text-btn";


  toolbar.appendChild(
    editBtn
  );

  toolbar.appendChild(
    copyBtn
  );

  toolbar.appendChild(
    sizeInput
  );

  toolbar.appendChild(
    fontSelect
  );

  toolbar.appendChild(
    deleteBtn
  );


  pageDiv
  .querySelector(
    ".object-layer"
  )
  .appendChild(
    toolbar
  );


  function positionToolbar(){

    const pageWidth=
      pageDiv.clientWidth;

    const pageHeight=
      pageDiv.clientHeight;


    const objectLeft=
      obj.xRatio*
      pageWidth;


    const objectTop=
      obj.yRatio*
      pageHeight;


    const objectBottom=
      objectTop+
      obj.heightRatio*
      pageHeight;


    const toolbarWidth=
      toolbar.offsetWidth;


    const toolbarHeight=
      toolbar.offsetHeight;


    let left=
      objectLeft;


    let top=
      objectTop-
      toolbarHeight-
      8;


    if(top<5){

      top=
        objectBottom+
        8;

    }


    if(
      left+toolbarWidth>
      pageWidth-5
    ){

      left=
        pageWidth-
        toolbarWidth-
        5;

    }


    if(left<5){
      left=5;
    }


    if(
      top+toolbarHeight>
      pageHeight-5
    ){

      top=
        pageHeight-
        toolbarHeight-
        5;

    }


    if(top<5){
      top=5;
    }


    toolbar.style.left=
      left+"px";


    toolbar.style.top=
      top+"px";

  }


  editBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      editAddedText(
        obj
      );

    }
  );


  copyBtn.addEventListener(
    "click",
    async function(e){

      e.preventDefault();
      e.stopPropagation();

      await copyText(
        obj.text
      );

    }
  );


  sizeInput.addEventListener(
    "change",
    function(e){

      e.stopPropagation();

      const value=
        Number(
          e.target.value
        );


      if(
        !Number.isFinite(value) ||
        value<6
      ){

        e.target.value=
          obj.fontSize;

        return;

      }


      obj.fontSize=
        Math.min(
          100,
          value
        );


      renderAllObjects();

      selectObject(
        obj
      );

      saveHistory();

    }
  );


  fontSelect.addEventListener(
    "change",
    function(e){

      e.stopPropagation();

      obj.fontFamily=
        e.target.value;


      renderAllObjects();

      selectObject(
        obj
      );

      saveHistory();

    }
  );


  deleteBtn.addEventListener(
    "click",
    function(e){

      e.preventDefault();
      e.stopPropagation();


      addedObjects=
        addedObjects.filter(
          function(x){

            return(
              x.id!==obj.id
            );

          }
        );


      selectedObject=null;


      renderAllObjects();

      saveHistory();

    }
  );


  requestAnimationFrame(
    positionToolbar
  );

}

/* =========================================================
   REFRESH SELECTION
========================================================= */

function refreshSelection(){

  clearVisualSelection();


  if(!selectedObject){
    return;
  }


  if(
    selectedObject.type===
    "existingText"
  ){

    const el=
      document.querySelector(
        '.existing-text[data-existing-id="'+
        selectedObject.id+
        '"]'
      );


    if(el){

      el.classList.add(
        "selected"
      );

    }


    return;

  }


  if(
    selectedObject.type===
    "existingImage"
  ){

    const normal=
      document.querySelector(
        '.existing-image[data-existing-id="'+
        selectedObject.id+
        '"]'
      );


    const deleted=
      document.querySelector(
        '.deleted-image[data-existing-id="'+
        selectedObject.id+
        '"]'
      );


    if(normal){

      normal.classList.add(
        "selected"
      );

    }


    if(deleted){

      deleted.classList.add(
        "selected"
      );

    }


    return;

  }


  const el=
    document.querySelector(
      '.editor-object[data-id="'+
      selectedObject.id+
      '"]'
    );


  if(el){

    el.classList.add(
      "selected"
    );

  }

}

/* =========================================================
   REFRESH PAGE LAYERS
========================================================= */

async function refreshPageLayers(){

  if(!pdfDocument){
    return;
  }


  removeAllTextToolbars();


  document
  .querySelectorAll(
    ".existing-layer"
  )
  .forEach(
    function(layer){

      layer.innerHTML="";

    }
  );


  document
  .querySelectorAll(
    ".object-layer"
  )
  .forEach(
    function(layer){

      layer.innerHTML="";

    }
  );


  const pageDivs=
    Array.from(
      document.querySelectorAll(
        ".pdf-page"
      )
    );


  for(
    const pageDiv of pageDivs
  ){

    const pageNumber=
      Number(
        pageDiv.dataset.page
      );


    const existingLayer=
      pageDiv.querySelector(
        ".existing-layer"
      );


    const objectLayer=
      pageDiv.querySelector(
        ".object-layer"
      );


    const page=
      await pdfDocument.getPage(
        pageNumber
      );


    const viewport=
      page.getViewport({
        scale:BASE_SCALE
      });


    existingTexts
    .filter(
      function(item){

        return(
          item.page===
          pageNumber
        );

      }
    )
    .forEach(
      function(item){

        if(item.deleted){

          renderDeletedCover(
            item,
            pageDiv,
            existingLayer,
            viewport
          );

        }
        else{

          renderExistingTextItem(
            item,
            pageDiv,
            existingLayer,
            viewport
          );

        }

      }
    );


    existingImages
    .filter(
      function(item){

        return(
          item.page===
          pageNumber
        );

      }
    )
    .forEach(
      function(item){

        if(item.deleted){

          renderDeletedImageCover(
            item,
            pageDiv,
            existingLayer,
            viewport
          );

        }
        else{

          renderExistingImage(
            item,
            pageDiv,
            existingLayer,
            viewport
          );

        }

      }
    );


    renderObjectsForPage(
      pageDiv,
      objectLayer,
      pageNumber
    );

  }


  markActivePage();

  refreshSelection();


  if(
    selectedObject &&
    selectedObject.type===
    "existingText"
  ){

    const obj=
      existingTexts.find(
        function(x){

          return(
            x.id===
            selectedObject.id
          );

        }
      );


    if(
      obj &&
      !obj.deleted
    ){

      requestAnimationFrame(
        function(){

          createExistingTextToolbar(
            obj
          );

        }
      );

    }

  }


  if(
    selectedObject &&
    selectedObject.type===
    "text"
  ){

    const obj=
      addedObjects.find(
        function(x){

          return(
            x.id===
            selectedObject.id
          );

        }
      );


    if(obj){

      requestAnimationFrame(
        function(){

          const pageDiv=
            document.querySelector(
              '.pdf-page[data-page="'+
              obj.page+
              '"]'
            );


          if(pageDiv){

            createTextToolbar(
              obj,
              pageDiv
            );

          }

        }
      );

    }

  }

}


/* =========================================================
   DELETED TEXT COVER
========================================================= */

function renderDeletedCover(
  item,
  pageDiv,
  layer,
  viewport
){

  const cssScale=
    pageDiv.clientWidth/
    viewport.width;


  const tx=
    pdfjsLib.Util.transform(
      viewport.transform,
      item.originalTransform
    );


  const fontHeight=
    Math.sqrt(
      tx[2]*tx[2]+
      tx[3]*tx[3]
    );


  const cover=
    document.createElement(
      "div"
    );


  cover.className=
    "deleted-cover";


  cover.dataset.existingId=
    item.id;


  cover.style.left=
    tx[4]*
    cssScale+
    "px";


  cover.style.top=
    (
      tx[5]-
      fontHeight*
      1.05
    )*
    cssScale+
    "px";


  cover.style.width=
    Math.max(
      6,
      (
        item.width+
        item.fontSize*.2
      )*
      BASE_SCALE*
      cssScale
    )+
    "px";


  cover.style.height=
    fontHeight*
    1.4*
    cssScale+
    "px";


  cover.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      e.stopPropagation();

      selectExistingText(
        item
      );

    }
  );


  layer.appendChild(
    cover
  );

}


/* =========================================================
   DRAG ADDED OBJECT
========================================================= */

function enableDrag(
  element,
  obj,
  pageDiv
){

  let dragging=false;

  let startX=0;
  let startY=0;

  let originalX=0;
  let originalY=0;


  element.addEventListener(
    "pointerdown",
    function(e){

      if(
        e.target.classList.contains(
          "resize-handle"
        )
      ){
        return;
      }


      e.preventDefault();
      e.stopPropagation();


      dragging=true;


      startX=e.clientX;

      startY=e.clientY;


      originalX=
        obj.xRatio;

      originalY=
        obj.yRatio;


      try{

        element.setPointerCapture(
          e.pointerId
        );

      }
      catch(err){}

    }
  );


  element.addEventListener(
    "pointermove",
    function(e){

      if(!dragging){
        return;
      }


      const dx=
        e.clientX-
        startX;


      const dy=
        e.clientY-
        startY;


      obj.xRatio=
        clamp(
          originalX+
          dx/
          pageDiv.clientWidth,
          0,
          Math.max(
            0,
            1-
            obj.widthRatio
          )
        );


      obj.yRatio=
        clamp(
          originalY+
          dy/
          pageDiv.clientHeight,
          0,
          Math.max(
            0,
            1-
            obj.heightRatio
          )
        );


      element.style.left=
        obj.xRatio*
        pageDiv.clientWidth+
        "px";


      element.style.top=
        obj.yRatio*
        pageDiv.clientHeight+
        "px";

    }
  );


  function finish(){

    if(!dragging){
      return;
    }


    dragging=false;

    saveHistory();

  }


  element.addEventListener(
    "pointerup",
    finish
  );


  element.addEventListener(
    "pointercancel",
    finish
  );

}


/* =========================================================
   RESIZE ADDED
========================================================= */

function enableResize(
  handle,
  element,
  obj,
  pageDiv
){

  let resizing=false;

  let startX=0;

  let startY=0;

  let originalWidth=0;

  let originalHeight=0;


  handle.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();
      e.stopPropagation();


      resizing=true;


      startX=e.clientX;

      startY=e.clientY;


      originalWidth=
        obj.widthRatio;

      originalHeight=
        obj.heightRatio;


      try{

        handle.setPointerCapture(
          e.pointerId
        );

      }
      catch(err){}

    }
  );


  handle.addEventListener(
    "pointermove",
    function(e){

      if(!resizing){
        return;
      }


      const dx=
        e.clientX-
        startX;


      const dy=
        e.clientY-
        startY;


      obj.widthRatio=
        Math.max(
          .02,
          originalWidth+
          dx/
          pageDiv.clientWidth
        );


      obj.heightRatio=
        Math.max(
          .02,
          originalHeight+
          dy/
          pageDiv.clientHeight
        );


      obj.widthRatio=
        Math.min(
          obj.widthRatio,
          1-
          obj.xRatio
        );


      obj.heightRatio=
        Math.min(
          obj.heightRatio,
          1-
          obj.yRatio
        );


      element.style.width=
        obj.widthRatio*
        pageDiv.clientWidth+
        "px";


      element.style.height=
        obj.heightRatio*
        pageDiv.clientHeight+
        "px";

    }
  );


  function finish(){

    if(!resizing){
      return;
    }


    resizing=false;

    saveHistory();

  }


  handle.addEventListener(
    "pointerup",
    finish
  );


  handle.addEventListener(
    "pointercancel",
    finish
  );

}
