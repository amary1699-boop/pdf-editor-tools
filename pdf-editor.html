<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PDF Editor - PDF Editor Tools Free</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f6fa;
  color:#222;
}

.header{
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:15px 20px;
  text-align:center;
}

.header h1{
  color:#e53232;
  font-size:24px;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:25px 15px;
}

.editor-box{
  background:#fff;
  border-radius:15px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.upload-area{
  border:2px dashed #e53232;
  border-radius:12px;
  padding:35px 15px;
  text-align:center;
  margin-bottom:20px;
}

.upload-area input{
  display:none;
}

.upload-btn{
  display:inline-block;
  background:#e53232;
  color:#fff;
  padding:13px 25px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:20px;
}

.toolbar button{
  border:1px solid #ddd;
  background:#fff;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.toolbar button:hover{
  background:#f1f1f1;
}

.download{
  background:#e53232 !important;
  color:white;
  border:none !important;
}

#pdf-container{
  background:#ddd;
  padding:20px;
  border-radius:10px;
  overflow:auto;
  text-align:center;
}

.page{
  position:relative;
  display:inline-block;
  margin:0 auto 20px;
  background:white;
  box-shadow:0 3px 12px rgba(0,0,0,.2);
}

.page canvas{
  display:block;
  max-width:100%;
}

.text-item{
  position:absolute;
  left:50px;
  top:50px;
  color:#111;
  font-size:20px;
  font-weight:500;
  cursor:move;
  user-select:none;
  padding:3px 6px;
  border:1px dashed transparent;
}

.text-item:hover{
  border-color:#e53232;
}

.empty{
  color:#777;
  padding:40px 10px;
}

@media(max-width:600px){

  .container{
    padding:15px 10px;
  }

  .editor-box{
    padding:12px;
  }

  .toolbar button{
    flex:1;
    min-width:100px;
  }

  .upload-area{
    padding:25px 10px;
  }
}
</style>
</head>

<body>

<header class="header">
  <h1>PDF Editor Tools Free</h1>
</header>

<div class="container">

  <div class="editor-box">

    <div class="upload-area">

      <h2>Select PDF File</h2>

      <p style="margin:10px 0 18px;color:#666;">
        Upload a PDF to start editing
      </p>

      <label for="pdfFile" class="upload-btn">
        Choose PDF
      </label>

      <input type="file" id="pdfFile" accept="application/pdf">

    </div>

    <div class="toolbar">

      <button onclick="addText()">
        ✎ Add Text
      </button>

      <button onclick="clearTexts()">
        🗑 Clear Text
      </button>

      <button class="download" onclick="downloadPDF()">
        ⬇ Download PDF
      </button>

    </div>

    <div id="pdf-container">
      <div class="empty">
        Your PDF preview will appear here.
      </div>
    </div>

  </div>

</div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

let pdfDocument = null;
let pages = [];
let textMode = false;

document.getElementById("pdfFile").addEventListener("change", function(e){

  const file = e.target.files[0];

  if(!file){
    return;
  }

  const reader = new FileReader();

  reader.onload = function(){

    const typedarray = new Uint8Array(reader.result);

    pdfjsLib.getDocument(typedarray).promise.then(function(pdf){

      pdfDocument = pdf;

      renderPDF();

    }).catch(function(error){

      alert("PDF load nahi ho pa raha hai.");

      console.error(error);

    });

  };

  reader.readAsArrayBuffer(file);

});


function renderPDF(){

  const container = document.getElementById("pdf-container");

  container.innerHTML = "";

  pages = [];

  for(let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++){

    renderPage(pageNumber);

  }

}


function renderPage(pageNumber){

  pdfDocument.getPage(pageNumber).then(function(page){

    const viewport = page.getViewport({
      scale:1.3
    });

    const pageDiv = document.createElement("div");

    pageDiv.className = "page";

    pageDiv.dataset.page = pageNumber;

    pageDiv.style.width = viewport.width + "px";
    pageDiv.style.height = viewport.height + "px";

    const canvas = document.createElement("canvas");

    const context = canvas.getContext("2d");

    canvas.width = viewport.width;
    canvas.height = viewport.height;

    pageDiv.appendChild(canvas);

    document.getElementById("pdf-container").appendChild(pageDiv);

    page.render({
      canvasContext:context,
      viewport:viewport
    });

    pages.push(pageDiv);

  });

}


function addText(){

  if(!pdfDocument){

    alert("Pehle PDF upload karein.");

    return;

  }

  const text = prompt("Jo text add karna hai woh likhiye:");

  if(!text){

    return;

  }

  const firstPage = document.querySelector(".page");

  if(!firstPage){

    return;

  }

  const item = document.createElement("div");

  item.className = "text-item";

  item.innerText = text;

  makeDraggable(item);

  firstPage.appendChild(item);

}


function makeDraggable(element){

  let offsetX = 0;
  let offsetY = 0;
  let dragging = false;

  element.addEventListener("mousedown", function(e){

    dragging = true;

    offsetX = e.offsetX;
    offsetY = e.offsetY;

  });

  document.addEventListener("mousemove", function(e){

    if(!dragging){

      return;

    }

    const parent = element.parentElement;

    const rect = parent.getBoundingClientRect();

    let x = e.clientX - rect.left - offsetX;
    let y = e.clientY - rect.top - offsetY;

    x = Math.max(0, x);
    y = Math.max(0, y);

    element.style.left = x + "px";
    element.style.top = y + "px";

  });

  document.addEventListener("mouseup", function(){

    dragging = false;

  });

}


function clearTexts(){

  document.querySelectorAll(".text-item").forEach(function(item){

    item.remove();

  });

}


async function downloadPDF(){
  if(!pdfDocument){
    alert("Pehle PDF upload karein.");
    return;
  }

  const firstPage = document.querySelector(".page");
  if(!firstPage){
    return;
  }

  const originalCanvas = firstPage.querySelector("canvas");
  if(!originalCanvas){
    return;
  }

  // Export canvas - same size as PDF preview
  const exportCanvas = document.createElement("canvas");
  exportCanvas.width = originalCanvas.width;
  exportCanvas.height = originalCanvas.height;

  const ctx = exportCanvas.getContext("2d");

  // Original PDF page
  ctx.drawImage(
    originalCanvas,
    0,
    0,
    exportCanvas.width,
    exportCanvas.height
  );

  const pageRect = firstPage.getBoundingClientRect();

  // Add all text exactly where it appears in preview
  document.querySelectorAll(".text-item").forEach(function(item){

    const itemRect = item.getBoundingClientRect();
    const computed = window.getComputedStyle(item);

    const scaleX = exportCanvas.width / pageRect.width;
    const scaleY = exportCanvas.height / pageRect.height;

    const x = (itemRect.left - pageRect.left) * scaleX;
    const y = (itemRect.top - pageRect.top) * scaleY;

    const fontSize =
      parseFloat(computed.fontSize) * scaleY;

    ctx.font =
      computed.fontWeight + " " +
      fontSize + "px " +
      computed.fontFamily;

    ctx.fillStyle = computed.color;

    ctx.textBaseline = "top";

    ctx.fillText(
      item.innerText,
      x,
      y
    );
  });

  // Create PDF
  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({
    orientation: exportCanvas.width > exportCanvas.height ? "l" : "p",
    unit: "px",
    format: [
      exportCanvas.width,
      exportCanvas.height
    ]
  });

  const imgData = exportCanvas.toDataURL(
    "image/jpeg",
    0.95
  );

  pdf.addImage(
    imgData,
    "JPEG",
    0,
    0,
    exportCanvas.width,
    exportCanvas.height
  );

  pdf.save("edited-pdf.pdf");
}
